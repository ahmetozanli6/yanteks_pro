// ── 6. TEKLİFLER ─────────────────────────────────────────────────────────
function OffersView({ data, customers, onRefresh }) {
  const [q, setQ] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [busy, setBusy] = useState(null);
  const [modal, setModal] = useState(null); // null | 'new' | item
  const [saving, setSaving] = useState(false);
  const [openFirms, setOpenFirms] = useState(new Set());

  const [selIds, setSelIds] = useState(new Set());
  const [bulkBusy, setBulkBusy] = useState(false);

  // Excel İçe Aktar State
  const [impModal, setImpModal] = useState(false);
  const [impFirma, setImpFirma] = useState('');
  const [impDate, setImpDate] = useState(new Date().toISOString().slice(0,10));
  const [impDurum, setImpDurum] = useState('Teklif Verildi');
  const [impRows, setImpRows] = useState([]);
  const [impSaving, setImpSaving] = useState(false);

  // Form State
  const emptyForm = { 
    firma_adi: '', urun: '', fiyat: '', durum: 'Teklif Verildi',
    teklif_tarihi: new Date().toISOString().slice(0,10), 
    gecerlilik_tarihi: '', notlar: '' 
  };
  const [form, setForm] = useState(emptyForm);
  const [multiRows, setMultiRows] = useState([{ urun: '', fiyat: '' }]);

  const firmalarList = useMemo(() => {
    return [...new Set(customers.map(c => c.firma_adi).filter(Boolean))].sort();
  }, [customers]);

  const DURUMLAR = ['Teklif Verildi', 'Onaylandı', 'Onaylanmadı'];
  const DCLR = {
    'Teklif Verildi': [C.tealS, C.teal, 'rgba(8,145,178,.2)'],
    'Onaylandı':      [C.greenS, C.green, 'rgba(21,128,61,.2)'],
    'Onaylanmadı':    [C.redS, C.red, 'rgba(153,27,27,.2)'],
  };

  const daysDiff = (d) => {
    if (!d) return null;
    return Math.floor((new Date(d).getTime() - Date.now()) / 86400000);
  };

  const filtered = useMemo(() => {
    return data.filter(t => {
      if (statusFilter !== 'all' && t.durum !== statusFilter) return false;
      if (q) {
        const Q = trl(q);
        if (!trl(t.firma_adi||'').includes(Q) && !trl(t.urun||'').includes(Q) && !trl(t.notlar||'').includes(Q)) return false;
      }
      return true;
    });
  }, [data, statusFilter, q]);

  const groupedFirms = useMemo(() => {
    const G = new Map();
    filtered.forEach(t => {
      const f = t.firma_adi || 'BELİRSİZ';
      if (!G.has(f)) G.set(f, []);
      G.get(f).push(t);
    });
    return [...G.entries()].sort((a,b) => {
      const da = a[1][0]?.teklif_tarihi || a[1][0]?.created_at || '';
      const db2 = b[1][0]?.teklif_tarihi || b[1][0]?.created_at || '';
      return db2.localeCompare(da);
    });
  }, [filtered]);

  const toggleFirm = (name) => {
    setOpenFirms(prev => {
      const n = new Set(prev);
      n.has(name) ? n.delete(name) : n.add(name);
      return n;
    });
  };

  const toggleSel = (id) => setSelIds(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const clearSel = () => setSelIds(new Set());

  const bulkStatus = async (ns) => {
    if (!selIds.size) return;
    setBulkBusy(true);
    const ids = [...selIds];
    await db.from('fiyat_teklifleri').update({ durum: ns, updated_at: new Date().toISOString() }).in('id', ids);
    setBulkBusy(false); clearSel(); await onRefresh();
  };

  const bulkDelete = async () => {
    if (!selIds.size || !window.confirm(selIds.size + ' teklif silinsin mi?')) return;
    setBulkBusy(true);
    await db.from('fiyat_teklifleri').delete().in('id', [...selIds]);
    setBulkBusy(false); clearSel(); await onRefresh();
  };

  const setDurum = async (t, durum) => {
    setBusy(t.id);
    await db.from('fiyat_teklifleri').update({ durum, updated_at: new Date().toISOString() }).eq('id', t.id);
    await onRefresh();
    setBusy(null);
  };

  const delItem = async (t) => {
    if (!window.confirm(`"${t.urun||'Teklif'}" silinsin mi?`)) return;
    setBusy(t.id);
    await db.from('fiyat_teklifleri').delete().eq('id', t.id);
    await onRefresh();
    setBusy(null);
  };

  const openAdd = (firmaAdi = '') => {
    setForm({ ...emptyForm, firma_adi: firmaAdi });
    setMultiRows([{ urun:'', fiyat:'' }]);
    setModal('new');
  };

  const openEdit = (t) => {
    setForm({ 
      firma_adi: t.firma_adi || '', urun: t.urun || '', fiyat: String(t.fiyat || ''),
      durum: t.durum || 'Teklif Verildi', teklif_tarihi: t.teklif_tarihi || '',
      gecerlilik_tarihi: t.gecerlilik_tarihi || '', notlar: t.notlar || '' 
    });
    setModal(t);
  };

  const save = async () => {
    if (!form.firma_adi.trim()) return;
    setSaving(true);
    const now = new Date().toISOString();
    const base = { 
      firma_adi: form.firma_adi.trim().toUpperCase(), durum: form.durum,
      teklif_tarihi: form.teklif_tarihi || null, gecerlilik_tarihi: form.gecerlilik_tarihi || null,
      notlar: form.notlar.trim() || null, updated_at: now 
    };
    
    if (modal === 'new') {
      const validRows = multiRows.filter(r => r.urun.trim());
      if (!validRows.length) { setSaving(false); return; }
      const payload = validRows.map(r => ({ ...base, urun: r.urun.trim(), fiyat: parseFloat(r.fiyat) || null, created_at: now }));
      await db.from('fiyat_teklifleri').insert(payload);
    } else {
      if (!form.urun.trim()) { setSaving(false); return; }
      await db.from('fiyat_teklifleri').update({ ...base, urun: form.urun.trim(), fiyat: parseFloat(form.fiyat) || null }).eq('id', modal.id);
    }
    setSaving(false); setModal(null); await onRefresh();
  };

  const previewImport = async (file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(buf);
      const sh = wb.worksheets[0];
      const rows = [];
      sh.eachRow((row, rn) => {
        if (rn < 3) return; // Başlıkları atla
        const urun  = String(row.getCell(1).value || '').trim();
        const fiyat = parseFloat(row.getCell(2).value) || null;
        if (urun) rows.push({ urun, fiyat });
      });
      setImpRows(rows);
    } catch(e) { alert('Excel okunamadı: ' + e.message); }
  };

  const doImport = async () => {
    if (!impFirma.trim() || !impRows.length) return;
    setImpSaving(true);
    const now = new Date().toISOString();
    const payload = impRows.map(r => ({
      firma_adi: impFirma.trim().toUpperCase(),
      urun: r.urun, fiyat: r.fiyat,
      durum: impDurum, teklif_tarihi: impDate || null,
      updated_at: now, created_at: now
    }));
    await db.from('fiyat_teklifleri').insert(payload);
    setImpSaving(false); setImpModal(false); setImpFirma(''); setImpRows([]); await onRefresh();
  };

  const exportFirmaXL = async (firmaAdi, teklifler) => {
    const dt = safeFileDate();
    const wb = new ExcelJS.Workbook(); 
    const sh = wb.addWorksheet('Teklif');
    sh.mergeCells(1,1,1,5);
    const tc = sh.getCell('A1');
    tc.value = (firmaAdi || 'TÜM FİRMALAR') + ' — FİYAT TEKLİFLERİ (' + dt + ')';
    tc.font = { bold:true, size:13, color:{ argb:'FFFFFFFF' } };
    tc.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0672A0' } };
    tc.alignment = { horizontal:'center', vertical:'middle' };
    sh.getRow(1).height = 28;
    
    const hr = sh.addRow(['Firma','Ürün / Kalite','Fiyat ($)','Durum','Teklif Tarihi']);
    hr.eachCell(c => { c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0891B2' } }; c.font = { color:{ argb:'FFFFFFFF' }, bold:true }; c.alignment = { horizontal:'center' }; });
    sh.columns = [{width:30},{width:35},{width:14},{width:18},{width:16}];
    
    const rows = teklifler || filtered;
    rows.forEach(t => {
      const r = sh.addRow([t.firma_adi || '', t.urun || '', t.fiyat || '', t.durum || '', t.teklif_tarihi || '']);
      if (t.durum === 'Onaylandı') r.getCell(4).font = { color:{ argb:'FF15803D' }, bold:true };
      if (t.durum === 'Onaylanmadı') r.getCell(4).font = { color:{ argb:'FF991B1B' }, bold:true };
    });
    
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = 'Teklif_' + (firmaAdi || 'Tum').replace(/\s+/g,'_') + '_' + dt + '.xlsx';
    a.click();
  };

  const total = data.length;
  const onay = data.filter(t => t.durum === 'Onaylandı').length;
  const teklif = data.filter(t => t.durum === 'Teklif Verildi').length;
  const ret = data.filter(t => t.durum === 'Onaylanmadı').length;
  const onayTutar = data.filter(t => t.durum === 'Onaylandı' && t.fiyat).reduce((s,t) => s + parseFloat(t.fiyat || 0), 0);

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
      {/* İçe Aktar Modal */}
      {impModal && (
        <div onClick={e => e.target === e.currentTarget && setImpModal(false)} style={S.mOv}>
          <div style={{ ...S.mBx, maxWidth:420 }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}>
              <h3 style={{ fontSize:17, fontWeight:800, color:C.txt }}>📥 Excel'den Aktar</h3>
              <button onClick={() => setImpModal(false)} style={{ background:'none', border:'none', cursor:'pointer' }}><IcoX size={20}/></button>
            </div>
            <p style={{ fontSize:12, color:C.txt2, marginBottom:14 }}>
              Firma seç, ardından Excel yükle.<br/>
              <span style={{ fontFamily:'monospace', fontSize:11 }}>A=Ürün Adı · B=Fiyat ($) · 3. satırdan başlar</span>
            </p>
            <div style={{ marginBottom:12 }}>
              <label style={S.lbl}>Firma *</label>
              <FirmaInput value={impFirma} onChange={setImpFirma} firmalar={firmalarList} />
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
              <div>
                <label style={S.lbl}>Teklif Tarihi</label>
                <input type="date" value={impDate} onChange={e => setImpDate(e.target.value)} style={S.inp} />
              </div>
              <div>
                <label style={S.lbl}>Durum</label>
                <select value={impDurum} onChange={e => setImpDurum(e.target.value)} style={{...S.inp, cursor:'pointer'}}>
                  {DURUMLAR.map(d => <option key={d}>{d}</option>)}
                </select>
              </div>
            </div>
            <div style={{ marginBottom:12 }}>
              <label style={S.lbl}>Excel Dosyası *</label>
              <input type="file" accept=".xlsx,.xls" onChange={e => previewImport(e.target.files[0])} style={{ ...S.inp, background:'#F8FAFC' }} />
            </div>
            {impRows.length > 0 && (
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:10, fontWeight:700, color:C.txt2, textTransform:'uppercase', marginBottom:6 }}>
                  Önizleme — {impRows.length} satır
                </div>
                <div style={{ maxHeight:160, overflowY:'auto', border:`1px solid ${C.border}`, borderRadius:10, background:C.page }}>
                  {impRows.slice(0,20).map((r,i) => (
                    <div key={i} style={{ display:'flex', justifyContent:'space-between', padding:'7px 12px', borderBottom:`1px solid ${C.border}`, fontSize:12 }}>
                      <span style={{ color:C.txt, fontWeight:600 }}>{r.urun}</span>
                      <span style={{ color:C.green, fontFamily:'monospace', fontWeight:700 }}>{r.fiyat ? '$'+r.fiyat : '—'}</span>
                    </div>
                  ))}
                  {impRows.length > 20 && <div style={{ padding:'6px 12px', fontSize:11, color:C.txt2 }}>+{impRows.length - 20} daha…</div>}
                </div>
              </div>
            )}
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => setImpModal(false)} style={S.bCan}>İptal</button>
              <button onClick={doImport} disabled={impSaving || !impFirma.trim() || !impRows.length} style={{ ...S.bSav, background:C.navActive, opacity: (impSaving || !impFirma.trim() || !impRows.length) ? 0.5 : 1 }}>
                {impSaving ? 'Aktarılıyor…' : `📥 ${impRows.length || ''} Teklifi Aktar`}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Düzenle/Ekle Modal */}
      {modal && (
        <div onClick={e => e.target === e.currentTarget && setModal(null)} style={S.mOv}>
          <div style={{ ...S.mBx, maxWidth:500 }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}>
              <h3 style={{ fontSize:17, fontWeight:800, color:C.txt }}>{modal === 'new' ? '➕ Yeni Teklif' : '✏️ Teklifi Düzenle'}</h3>
              <button onClick={() => setModal(null)} style={{ background:'none', border:'none', cursor:'pointer' }}><IcoX size={20}/></button>
            </div>
            
            <div style={{ marginBottom:12 }}>
              <label style={S.lbl}>Firma Adı *</label>
              <FirmaInput value={form.firma_adi} onChange={v => setForm(f => ({ ...f, firma_adi: v }))} firmalar={firmalarList} />
            </div>
            
            {modal === 'new' ? (
              <div style={{ marginBottom:12 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
                  <label style={S.lbl}>Ürün / Kalite & Fiyat</label>
                  <button onClick={() => setMultiRows(r => [...r, { urun:'', fiyat:'' }])} style={{ fontSize:11, fontWeight:700, color:C.teal, background:C.tealS, border:`1px solid rgba(8,145,178,.2)`, borderRadius:7, padding:'3px 9px', cursor:'pointer', display:'flex', alignItems:'center', gap:3 }}>
                    <IcoPlus size={11}/> Satır Ekle
                  </button>
                </div>
                {multiRows.map((r, i) => (
                  <div key={i} style={{ display:'grid', gridTemplateColumns:'1fr 90px 28px', gap:6, marginBottom:6 }}>
                    <input value={r.urun} onChange={e => setMultiRows(p => p.map((x,j) => j===i ? {...x, urun: e.target.value} : x))} placeholder="Ürün" style={S.inp} />
                    <input type="number" step="0.01" value={r.fiyat} onChange={e => setMultiRows(p => p.map((x,j) => j===i ? {...x, fiyat: e.target.value} : x))} placeholder="$ Fiyat" style={{ ...S.inp, textAlign:'right', fontFamily:'monospace' }} />
                    {multiRows.length > 1 ? (
                      <button onClick={() => setMultiRows(p => p.filter((_,j) => j!==i))} style={{ background:'none', border:`1px solid ${C.border2}`, borderRadius:8, cursor:'pointer', color:C.red, display:'flex', alignItems:'center', justifyContent:'center' }}><IcoX size={14}/></button>
                    ) : <div/>}
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ marginBottom:12 }}>
                <label style={S.lbl}>Ürün / Kalite *</label>
                <input value={form.urun} onChange={e => setForm(f => ({ ...f, urun: e.target.value }))} style={S.inp} />
                <label style={{ ...S.lbl, marginTop:10 }}>Fiyat ($)</label>
                <input type="number" step="0.01" value={form.fiyat} onChange={e => setForm(f => ({ ...f, fiyat: e.target.value }))} style={{ ...S.inp, fontFamily:'monospace' }} />
              </div>
            )}
            
            <div style={{ marginBottom:12 }}>
              <label style={S.lbl}>Durum</label>
              <select value={form.durum} onChange={e => setForm(f => ({ ...f, durum: e.target.value }))} style={{...S.inp, cursor:'pointer'}}>
                {DURUMLAR.map(d => <option key={d}>{d}</option>)}
              </select>
            </div>
            
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
              <div>
                <label style={S.lbl}>Teklif Tarihi</label>
                <input type="date" value={form.teklif_tarihi} onChange={e => setForm(f => ({ ...f, teklif_tarihi: e.target.value }))} style={S.inp} />
              </div>
              <div>
                <label style={S.lbl}>Geçerlilik</label>
                <input type="date" value={form.gecerlilik_tarihi} onChange={e => setForm(f => ({ ...f, gecerlilik_tarihi: e.target.value }))} style={S.inp} />
              </div>
            </div>
            
            <div style={{ marginBottom:18 }}>
              <label style={S.lbl}>Notlar</label>
              <textarea value={form.notlar} onChange={e => setForm(f => ({ ...f, notlar: e.target.value }))} rows={2} style={{ ...S.inp, resize:'vertical' }} />
            </div>
            
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => setModal(null)} style={S.bCan}>İptal</button>
              <button onClick={save} disabled={saving || !form.firma_adi.trim()} style={{ ...S.bSav, background:C.navActive, opacity: (saving || !form.firma_adi.trim()) ? 0.5 : 1 }}>
                {saving ? 'Kaydediliyor…' : '💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Başlık ve Butonlar */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:900, color:C.txt }}>Fiyat Teklifleri</h2>
          <p style={{ fontSize:12, color:C.txt2, marginTop:2 }}>{filtered.length} / {data.length} teklif · {groupedFirms.length} firma</p>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={() => exportFirmaXL('', filtered)} style={{ ...S.bCan, width:'auto', padding:'8px 14px', color:C.green, borderColor:C.green, display:'flex', alignItems:'center', gap:5 }}>📊 Excel</button>
          <button onClick={() => setImpModal(true)} style={{ ...S.bCan, width:'auto', padding:'8px 14px', display:'flex', alignItems:'center', gap:5 }}>📥 İçe Aktar</button>
          <button onClick={() => openAdd()} style={{ ...S.bSav, background:C.navActive, width:'auto', padding:'8px 16px', display:'flex', alignItems:'center', gap:5 }}><IcoPlus size={16}/> Yeni Teklif</button>
        </div>
      </div>

      {/* KPI Kartları */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:10 }}>
        {[
          ['📋 Toplam', total, C.teal, C.tealS],
          ['⏳ Teklif Verildi', teklif, C.amber, C.amberS],
          ['✅ Onaylanan', onay, C.green, C.greenS],
          ['❌ Onaylanmadı', ret, C.red, C.redS],
        ].map(([lbl, val, col, bg]) => (
          <div key={lbl} style={{ background:bg, borderRadius:12, padding:'12px 16px', border:`1px solid ${col}30` }}>
            <p style={{ fontSize:11, fontWeight:700, color:col, marginBottom:4 }}>{lbl}</p>
            <p style={{ fontSize:26, fontWeight:900, color:col, fontFamily:'monospace', letterSpacing:'-.02em' }}>{val}</p>
          </div>
        ))}
      </div>
      
      {onayTutar > 0 && (
        <div style={{ background:C.greenS, borderRadius:10, padding:'10px 16px', border:`1px solid rgba(21,128,61,.2)`, fontSize:13, fontWeight:700, color:C.green }}>
          💰 Onaylanan toplam tutar: <span style={{ fontFamily:'monospace', fontSize:15 }}>${onayTutar.toFixed(2)}</span>
        </div>
      )}

      {/* Filtre ve Arama */}
      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2 }}><IcoSearch size={14}/></span>
          <input placeholder="Firma, ürün veya not ara…" value={q} onChange={e => setQ(e.target.value)} style={{ ...S.inp, paddingLeft:34 }} />
        </div>
      </div>
      
      <div style={{ display:'flex', gap:7, flexWrap:'wrap' }}>
        {[
          ['all', 'Tümü', total],
          ['Teklif Verildi', '⏳ Bekleyen', teklif],
          ['Onaylandı', '✅ Onaylanan', onay],
          ['Onaylanmadı', '❌ Reddedilen', ret]
        ].map(([val, lbl, cnt]) => {
          const active = statusFilter === val;
          const [bg, col] = DCLR[val] || [C.tealS, C.teal];
          return (
            <button key={val} onClick={() => setStatusFilter(val)}
              style={{ padding:'6px 13px', borderRadius:18, border:`2px solid ${active ? col : C.border}`, background:active ? bg : 'transparent', color:active ? col : C.txt2, fontSize:12, fontWeight:700, cursor:'pointer', transition:'all .15s' }}>
              {lbl} <span style={{ opacity:.7 }}>({cnt})</span>
            </button>
          );
        })}
      </div>

      {/* Seçim İşlem Çubuğu */}
      {selIds.size > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 14px', background:'#1E293B', borderRadius:12, flexWrap:'wrap', position:'sticky', top:10, zIndex:20 }}>
          <span style={{ fontSize:13, fontWeight:700, color:'#fff', flex:1 }}>✅ {selIds.size} seçili</span>
          {DURUMLAR.map(st => (
            <button key={st} onClick={()=>bulkStatus(st)} disabled={bulkBusy} style={{ padding:'6px 12px', borderRadius:8, border:'none', background:DCLR[st][1], color:'#fff', fontSize:11, fontWeight:700, cursor:'pointer' }}>{st}</button>
          ))}
          <button onClick={bulkDelete} disabled={bulkBusy} style={{ padding:'5px 10px', borderRadius:8, border:'1px solid #DC2626', background:'transparent', color:'#DC2626', fontSize:11, fontWeight:700, cursor:'pointer' }}>🗑 Sil</button>
          <button onClick={clearSel} style={{ padding:'5px 10px', borderRadius:8, border:'1px solid #475569', background:'transparent', color:'#94A3B8', fontSize:11, cursor:'pointer' }}>İptal</button>
        </div>
      )}

      {/* Akordeon Listeler */}
      <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
        {groupedFirms.length === 0 ? (
          <div style={{ padding:32, textAlign:'center', color:C.txt2, background:C.surface, borderRadius:16, border:`1px solid ${C.border}` }}>
            {q || statusFilter !== 'all' ? 'Filtreye uyan teklif yok.' : 'Henüz teklif kaydı yok.'}
          </div>
        ) : (
          groupedFirms.map(([firmaAdi, teklifler]) => {
            const isOpen = openFirms.has(firmaAdi) || q.length > 0;
            const onayN = teklifler.filter(t => t.durum === 'Onaylandı').length;
            const teklifN = teklifler.filter(t => t.durum === 'Teklif Verildi').length;
            const retN = teklifler.filter(t => t.durum === 'Onaylanmadı').length;
            
            return (
              <div key={firmaAdi} style={S.card}>
                <div onClick={() => toggleFirm(firmaAdi)}
                  style={{ display:'flex', alignItems:'center', gap:14, padding:'14px 20px', cursor:'pointer', borderBottom:isOpen ? `1px solid ${C.border}` : 'none', transition:'background .15s' }}
                  onMouseEnter={e => e.currentTarget.style.background = C.page} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  
                  <input type="checkbox" checked={teklifler.length > 0 && teklifler.every(x => selIds.has(x.id))} onChange={e => { e.stopPropagation(); setSelIds(p => { const n = new Set(p); const allS = teklifler.every(x => p.has(x.id)); teklifler.forEach(x => allS ? n.delete(x.id) : n.add(x.id)); return n; }) }} style={{ width:16, height:16, cursor:'pointer', accentColor:C.green, marginRight: 8 }} onClick={e => e.stopPropagation()}/>
                  
                  <div style={{ width:40, height:40, borderRadius:11, background:C.tealS, display:'flex', alignItems:'center', justifyContent:'center', color:C.teal, fontWeight:900, fontSize:16, flexShrink:0 }}>
                    {firmaAdi.charAt(0)}
                  </div>
                  
                  <div style={{ flex:1, minWidth:0 }}>
                    <h4 style={{ fontWeight:800, fontSize:14, color:C.txt, margin:0 }}>{firmaAdi}</h4>
                    <div style={{ display:'flex', gap:8, marginTop:4, flexWrap:'wrap' }}>
                      {teklifN > 0 && <span style={{ fontSize:11, fontWeight:700, color:C.teal, background:C.tealS, padding:'2px 7px', borderRadius:5 }}>⏳ {teklifN}</span>}
                      {onayN > 0 && <span style={{ fontSize:11, fontWeight:700, color:C.green, background:C.greenS, padding:'2px 7px', borderRadius:5 }}>✅ {onayN}</span>}
                      {retN > 0 && <span style={{ fontSize:11, fontWeight:700, color:C.red, background:C.redS, padding:'2px 7px', borderRadius:5 }}>❌ {retN}</span>}
                      <span style={{ fontSize:11, color:C.txt2 }}>{teklifler.length} teklif</span>
                    </div>
                  </div>
                  
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <button onClick={e => { e.stopPropagation(); exportFirmaXL(firmaAdi, teklifler); }} style={{ background:'none', border:`1px solid ${C.green}`, color:C.green, borderRadius:8, padding:'5px 10px', cursor:'pointer', fontSize:11, fontWeight:700 }}>📊</button>
                    <button onClick={e => { e.stopPropagation(); openAdd(firmaAdi); }} style={{ background:C.tealS, border:`1px solid rgba(8,145,178,.2)`, color:C.teal, borderRadius:8, padding:'5px 10px', cursor:'pointer', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:4 }}><IcoPlus size={12}/> Ekle</button>
                    <span style={{ color:C.txt2, fontSize:18, transform:isOpen ? 'rotate(180deg)' : 'none', transition:'transform .2s' }}>▾</span>
                  </div>
                </div>

                {isOpen && teklifler.map((t, ti) => {
                  const [dBg, dCol] = DCLR[t.durum] || [C.tealS, C.teal];
                  const diff = daysDiff(t.gecerlilik_tarihi);
                  const isBusy = busy === t.id;
                  
                  return (
                    <div key={t.id || ti} className="hov-row" style={{ padding:'12px 20px', borderBottom:ti < teklifler.length - 1 ? `1px solid ${C.border}` : 'none', opacity:isBusy ? 0.5 : 1, display:'flex', alignItems:'center', gap:12 }}>
                      <input type="checkbox" checked={selIds.has(t.id)} onChange={() => toggleSel(t.id)} style={{ width:16, height:16, cursor:'pointer', accentColor:C.green, flexShrink:0 }} />
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                          <span style={{ fontWeight:700, fontSize:13, color:C.txt }}>{t.urun || '—'}</span>
                          {t.fiyat && <span style={{ fontFamily:'monospace', fontWeight:900, color:C.green, fontSize:14 }}>${t.fiyat}</span>}
                        </div>
                        <div style={{ display:'flex', gap:10, marginTop:4, flexWrap:'wrap', alignItems:'center' }}>
                          {t.teklif_tarihi && <span style={{ fontSize:11, color:C.txt2, fontFamily:'monospace' }}>📅 {fmtDate(t.teklif_tarihi)}</span>}
                          {diff !== null && t.durum === 'Teklif Verildi' && (
                            <span style={{ fontSize:11, fontWeight:700, color:diff < 0 ? C.red : diff < 7 ? C.amber : C.green }}>
                              {diff < 0 ? `⚠️ ${Math.abs(diff)} gün geçti` : `⏱ ${diff} gün kaldı`}
                            </span>
                          )}
                          {t.notlar && <span style={{ fontSize:11, color:C.txt2, fontStyle:'italic' }}>💬 {t.notlar}</span>}
                        </div>
                      </div>
                      
                      <select value={t.durum} disabled={isBusy} onChange={e => setDurum(t, e.target.value)}
                        style={{ padding:'5px 9px', borderRadius:8, border:`1.5px solid ${dCol}`, background:dBg, color:dCol, fontSize:11, fontWeight:700, cursor:'pointer', outline:'none', flexShrink:0 }}>
                        {DURUMLAR.map(d => <option key={d}>{d}</option>)}
                      </select>
                      
                      <div style={{ display:'flex', gap:4, flexShrink:0 }}>
                        <button onClick={() => openEdit(t)} disabled={isBusy} style={{ background:'none', border:'none', cursor:'pointer', color:C.border2, padding:5, borderRadius:6 }} onMouseEnter={e => e.currentTarget.style.color = C.teal} onMouseLeave={e => e.currentTarget.style.color = C.border2}><IcoEdit size={14}/></button>
                        <button onClick={() => delItem(t)} disabled={isBusy} style={{ background:'none', border:'none', cursor:'pointer', color:C.border2, padding:5, borderRadius:6 }} onMouseEnter={e => e.currentTarget.style.color = C.red} onMouseLeave={e => e.currentTarget.style.color = C.border2}><IcoTrash size={14}/></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// ── 7. NOTLARIM ──────────────────────────────────────────────────────
function NotesView({ data, customers, onRefresh }) {
  const [q, setQ] = useState('');
  const [colorFilter, setColorFilter] = useState('all');
  const [tagFilter, setTagFilter] = useState('all');
  const [modal, setModal] = useState(null);
  const [saving, setSaving] = useState(false);
  
  const emptyForm = { icerik: '', renk: 'default', musteri: '', tags: [] };
  const [form, setForm] = useState(emptyForm);

  const firmalarList = useMemo(() => {
    return [...new Set((customers || []).map(c => c.firma_adi).filter(Boolean))].sort();
  }, [customers]);

  const filtered = useMemo(() => {
    return data.filter(n => {
      if (colorFilter !== 'all' && (n.renk || 'default') !== colorFilter) return false;
      const { tags } = parseNoteTags(n.icerik);
      if (tagFilter !== 'all' && !tags.includes(tagFilter)) return false;
      if (q) {
        const Q = trl(q);
        if (!trl(n.icerik || '').includes(Q) && !trl(n.musteri || '').includes(Q)) return false;
      }
      return true;
    }).sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));
  }, [data, colorFilter, tagFilter, q]);

  const openAdd = () => { setForm(emptyForm); setModal('new'); };
  
  const openEdit = (n) => {
    const { tags, body } = parseNoteTags(n.icerik);
    setForm({ icerik: body, renk: n.renk || 'default', musteri: n.musteri || '', tags });
    setModal(n);
  };

  const toggleFormTag = (tag) => {
    setForm(prev => ({
      ...prev,
      tags: prev.tags.includes(tag) ? prev.tags.filter(t => t !== tag) : [...prev.tags, tag]
    }));
  };

  const save = async () => {
    if (!form.icerik.trim()) return;
    setSaving(true);
    const now = new Date().toISOString();
    const fullIcerik = buildNoteContent(form.tags, form.icerik.trim());
    const pay = { icerik: fullIcerik, renk: form.renk, musteri: form.musteri.trim() || null, updated_at: now };
    
    if (modal === 'new') {
      await db.from('genel_notlar').insert([{ ...pay, created_at: now }]);
    } else {
      await db.from(modal._tbl || 'genel_notlar').update(pay).eq('id', modal.id);
    }
    setSaving(false); setModal(null); await onRefresh();
  };

  const delNote = async (n) => {
    if (!window.confirm('Bu notu silmek istediğinize emin misiniz?')) return;
    await db.from(n._tbl || 'genel_notlar').delete().eq('id', n.id);
    await onRefresh();
  };

  const handleNoteKey = (e) => {
    if (e.key !== 'Enter') return;
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd, val = ta.value;
    const lineStart = val.lastIndexOf('\n', s - 1) + 1;
    const curLine = val.substring(lineStart, s);
    const hasBullet = /^\s*- /.test(curLine);
    const isEmpty = curLine.trim() === '-' || curLine.trim() === '- ' || curLine.trim() === '';
    
    if (hasBullet && isEmpty) return; // Break out
    if (hasBullet) {
      e.preventDefault();
      const ins = '\n- ';
      const nv = val.substring(0, s) + ins + val.substring(en);
      setForm(f => ({ ...f, icerik: nv }));
      setTimeout(() => { ta.selectionStart = ta.selectionEnd = s + ins.length; }, 0);
    }
  };

  const renderBody = (bodyStr, renkObj) => {
    if (!bodyStr) return null;
    return bodyStr.split('\n').map((line, i) => {
      if (line.trim() === '---' || line.trim() === '—') {
        return <hr key={i} style={{ border: 'none', borderTop: `1px solid ${renkObj.border}`, margin: '6px 0', opacity: 0.6 }} />;
      }
      if (/^\s*- (.+)/.test(line)) {
        return (
          <div key={i} style={{ display: 'flex', gap: 6, alignItems: 'flex-start', fontSize: 13, color: renkObj.txt, lineHeight: 1.6 }}>
            <span style={{ marginTop: 2, opacity: 0.5, flexShrink: 0 }}>•</span>
            <span style={{ opacity: 0.9 }}>{line.replace(/^\s*- /, '')}</span>
          </div>
        );
      }
      if (line.trim() === '') return <div key={i} style={{ height: 6 }} />;
      return <div key={i} style={{ fontSize: 13, color: renkObj.txt, opacity: 0.9, lineHeight: 1.6 }}>{line}</div>;
    });
  };

  const cntByRenk = {};
  Object.keys(NOTE_COLORS).forEach(r => { cntByRenk[r] = data.filter(n => (n.renk || 'default') === r).length; });
  const cntByTag = {};
  NOTE_TAGS.forEach(tag => { cntByTag[tag] = data.filter(n => parseNoteTags(n.icerik || '').tags.includes(tag)).length; });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {/* Modal */}
      {modal && (
        <div onClick={e => e.target === e.currentTarget && setModal(null)} style={S.mOv}>
          <div style={{ ...S.mBx, maxWidth: 500, background: NOTE_COLORS[form.renk]?.bg || '#fff', border: `2px solid ${NOTE_COLORS[form.renk]?.border || '#E2E8F0'}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
              <h3 style={{ fontSize: 17, fontWeight: 800, color: NOTE_COLORS[form.renk]?.txt || C.txt }}>{modal === 'new' ? '📝 Yeni Not' : '✏️ Notu Düzenle'}</h3>
              <button onClick={() => setModal(null)} style={{ background: 'none', border: 'none', cursor: 'pointer' }}><IcoX size={20} /></button>
            </div>

            <div style={{ marginBottom: 12 }}>
              <label style={S.lbl}>Etiketler</label>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {NOTE_TAGS.map(t => {
                  const active = form.tags.includes(t);
                  const col = TAG_COLORS[t] || C.txt2;
                  return (
                    <button key={t} onClick={() => toggleFormTag(t)}
                      style={{ padding: '4px 10px', borderRadius: 14, border: `1.5px solid ${active ? col : C.border2}`, background: active ? col + '20' : 'transparent', color: active ? col : C.txt2, fontSize: 11, fontWeight: 700, cursor: 'pointer', transition: 'all .15s' }}>
                      #{t}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ marginBottom: 14 }}>
              <label style={S.lbl}>Renk</label>
              <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
                {Object.entries(NOTE_COLORS).map(([k, r]) => (
                  <button key={k} onClick={() => setForm(f => ({ ...f, renk: k }))} title={r.label}
                    style={{ width: 26, height: 26, borderRadius: '50%', border: `3px solid ${form.renk === k ? C.teal : r.border}`, background: r.bg, cursor: 'pointer', outline: form.renk === k ? `2px solid ${C.teal}` : 'none', outlineOffset: 2 }} />
                ))}
              </div>
            </div>

            <div style={{ marginBottom: 12 }}>
              <label style={S.lbl}>🏢 Firma (Opsiyonel)</label>
              <FirmaInput value={form.musteri} onChange={v => setForm(f => ({ ...f, musteri: v }))} firmalar={firmalarList} placeholder="Firma seç veya yaz..." />
            </div>

            <div style={{ marginBottom: 18 }}>
              <label style={S.lbl}>Not İçeriği *</label>
              <div style={{ marginBottom: 6, display: 'flex', gap: 6 }}>
                <button type="button" onClick={() => setForm(f => ({ ...f, icerik: f.icerik + (f.icerik && !f.icerik.endsWith('\n') ? '\n' : '') + '- ' }))}
                  style={{ padding: '3px 8px', fontSize: 11, borderRadius: 6, border: `1px solid ${NOTE_COLORS[form.renk]?.border || C.border2}`, background: 'rgba(255,255,255,.5)', color: C.txt2, cursor: 'pointer', fontWeight: 600 }}>• Madde</button>
                <button type="button" onClick={() => setForm(f => ({ ...f, icerik: f.icerik + (f.icerik && !f.icerik.endsWith('\n') ? '\n' : '') + '---\n' }))}
                  style={{ padding: '3px 8px', fontSize: 11, borderRadius: 6, border: `1px solid ${NOTE_COLORS[form.renk]?.border || C.border2}`, background: 'rgba(255,255,255,.5)', color: C.txt2, cursor: 'pointer', fontWeight: 600 }}>── Çizgi</button>
              </div>
              <textarea value={form.icerik} onChange={e => setForm(f => ({ ...f, icerik: e.target.value }))} onKeyDown={handleNoteKey} rows={7} placeholder="Notunuzu buraya yazın..."
                style={{ ...S.inp, background: 'rgba(255,255,255,.6)', resize: 'vertical', lineHeight: 1.7, color: NOTE_COLORS[form.renk]?.txt || C.txt }} />
            </div>

            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={() => setModal(null)} style={S.bCan}>İptal</button>
              <button onClick={save} disabled={saving || !form.icerik.trim()} style={{ ...S.bSav, background: 'linear-gradient(135deg,#4F46E5,#6366F1)', opacity: saving || !form.icerik.trim() ? 0.5 : 1 }}>
                {saving ? 'Kaydediliyor…' : '💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Başlık */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
        <div>
          <h2 style={{ fontSize: 22, fontWeight: 900, color: C.txt }}>Notlarım</h2>
          <p style={{ fontSize: 12, color: C.txt2, marginTop: 2 }}>{filtered.length} / {data.length} not</p>
        </div>
        <button onClick={openAdd} style={{ ...S.bSav, background: 'linear-gradient(135deg,#4F46E5,#6366F1)', width: 'auto', display: 'flex', alignItems: 'center', gap: 5, padding: '8px 16px' }}>
          <IcoPlus size={16} /> Yeni Not
        </button>
      </div>

      {/* Arama ve Filtreler */}
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <div style={{ position: 'relative', flex: 1, minWidth: 200 }}>
          <span style={{ position: 'absolute', left: 11, top: '50%', transform: 'translateY(-50%)', color: C.txt2 }}><IcoSearch size={14} /></span>
          <input placeholder="Not veya firma ara…" value={q} onChange={e => setQ(e.target.value)} style={{ ...S.inp, paddingLeft: 34 }} />
        </div>
      </div>

      <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', alignItems: 'center' }}>
        {[['all', 'Tümü', data.length], ...Object.entries(NOTE_COLORS).map(([k, r]) => [k, r.label, cntByRenk[k] || 0])].map(([val, lbl, cnt]) => {
          const active = colorFilter === val;
          const rObj = NOTE_COLORS[val];
          return (
            <button key={val} onClick={() => setColorFilter(val)}
              style={{ padding: '5px 12px', borderRadius: 18, border: `2px solid ${active ? (rObj ? rObj.border : '#0891B2') : C.border}`, background: active ? (rObj ? rObj.bg : C.tealS) : 'transparent', color: active ? (rObj ? rObj.txt : C.teal) : C.txt2, fontSize: 12, fontWeight: 700, cursor: 'pointer', transition: 'all .15s', whiteSpace: 'nowrap' }}>
              {lbl} <span style={{ opacity: .65 }}>({cnt})</span>
            </button>
          );
        })}
      </div>

      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: C.txt2, textTransform: 'uppercase', letterSpacing: '.08em' }}>Etiket:</span>
        <button onClick={() => setTagFilter('all')} style={{ padding: '4px 10px', borderRadius: 14, border: `1.5px solid ${tagFilter === 'all' ? C.teal : C.border}`, background: tagFilter === 'all' ? C.tealS : 'transparent', color: tagFilter === 'all' ? C.teal : C.txt2, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>Tümü</button>
        {NOTE_TAGS.filter(tag => cntByTag[tag] > 0).map(tag => {
          const col = TAG_COLORS[tag] || C.txt2;
          return (
            <button key={tag} onClick={() => setTagFilter(tagFilter === tag ? 'all' : tag)}
              style={{ padding: '4px 10px', borderRadius: 14, border: `1.5px solid ${tagFilter === tag ? col : C.border}`, background: tagFilter === tag ? col + '18' : 'transparent', color: tagFilter === tag ? col : C.txt2, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>
              #{tag} <span style={{ opacity: .7 }}>({cntByTag[tag]})</span>
            </button>
          );
        })}
      </div>

      {/* Not Grid */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', gap: 16 }}>
        {filtered.length === 0 ? (
          <div style={{ gridColumn: '1/-1', padding: 32, textAlign: 'center', color: C.txt2, background: C.surface, borderRadius: 16, border: `1px solid ${C.border}` }}>
            {q || colorFilter !== 'all' || tagFilter !== 'all' ? 'Filtreye uyan not yok.' : 'Henüz not eklenmemiş.'}
          </div>
        ) : (
          filtered.map((n) => {
            const r = NOTE_COLORS[n.renk || 'default'] || NOTE_COLORS.default;
            const { tags, body } = parseNoteTags(n.icerik);
            const lines = body.split('\n');
            const title = lines.find(l => l.trim() !== '') || 'İsimsiz Not';
            const contentBody = lines.filter(l => l.trim() !== title).join('\n').trim();

            return (
              <div key={n.id} onClick={() => openEdit(n)} className="hov-row"
                style={{ background: r.bg, border: `1.5px solid ${r.border}`, borderRadius: 16, padding: 18, position: 'relative', cursor: 'pointer', display: 'flex', flexDirection: 'column' }}>
                <div style={{ display: 'flex', gap: 4, marginBottom: 8, flexWrap: 'wrap' }}>
                  {tags.map(x => <span key={x} style={{ fontSize: 10, fontWeight: 700, padding: '2px 7px', borderRadius: 10, background: (TAG_COLORS[x] || C.txt2) + '20', color: TAG_COLORS[x] || C.txt2 }}>#{x}</span>)}
                  {n.musteri && <span style={{ fontSize: 10, fontWeight: 700, opacity: .6, color: r.txt, alignSelf: 'center' }}>🏢 {n.musteri}</span>}
                </div>
                
                <h4 style={{ fontWeight: 800, fontSize: 14, color: r.txt, marginBottom: 8, paddingRight: 28, lineHeight: 1.3, wordBreak: 'break-word' }}>
                  {title}
                </h4>
                
                {contentBody && (
                  <div style={{ marginBottom: 28, overflow: 'hidden', maxHeight: 120 }}>
                    {renderBody(contentBody, r)}
                  </div>
                )}
                
                <div style={{ marginTop: 'auto', paddingTop: 12 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 10, color: r.txt, opacity: .55, fontWeight: 600, letterSpacing: '.05em', fontFamily: 'monospace' }}>
                    <IcoClock size={10} /> {fmtDate(n.updated_at || n.created_at)}
                  </div>
                </div>

                <button onClick={e => { e.stopPropagation(); delNote(n); }}
                  style={{ position: 'absolute', top: 12, right: 12, background: 'none', border: 'none', color: r.txt, opacity: .4, cursor: 'pointer', padding: 4, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                  onMouseEnter={e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.color = '#DC2626'; }}
                  onMouseLeave={e => { e.currentTarget.style.opacity = '.4'; e.currentTarget.style.color = r.txt; }}>
                  <IcoTrash size={14} />
                </button>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

    { id:'converter', label:'Dönüştürücü', Icon:IcoRefresh },

      <aside className={`ypSidebarWrap${sideOpen?' open':''}`} style={{ width:252, background:C.sidebar, borderRight:`1px solid ${C.sBorder}`, boxShadow:'4px 0 24px rgba(0,0,0,.4)', display:'flex', flexDirection:'column' }}>
        <div style={{ height:72, padding:'0 20px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'space-between', background:C.sHead, borderBottom:`1px solid ${C.sBorder}` }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:9, background:C.navActive, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', boxShadow:'0 2px 10px rgba(8,145,178,.4)' }}><IcoZap size={18} /></div>
            <span style={{ fontSize:18, fontWeight:800, color:'#fff', letterSpacing:'-.01em' }}>Yanteks<span style={{ color:C.tealL }}>Pro</span></span>
          </div>
          <button className="ypMobile" onClick={()=>setSideOpen(false)} style={{ background:'none', border:'none', color:'rgba(255,255,255,.45)', cursor:'pointer', padding:6, borderRadius:8, display:'flex' }}><IcoX size={18} /></button>
        </div>

        <nav style={{ flex:1, overflowY:'auto', padding:'10px 0', scrollbarWidth:'thin', scrollbarColor:'rgba(255,255,255,.12) transparent' }}>
          <p style={{ padding:'8px 20px 6px', fontSize:9, fontWeight:700, color:'rgba(255,255,255,.25)', letterSpacing:'.13em', textTransform:'uppercase' }}>ANA MENÜ</p>
          {nav.map(({ id, label, Icon }) => {
            const active = tab === id;
            return (
              <button key={id} onClick={() => goTo(id)} style={{ width:'calc(100% - 16px)', margin:'2px 8px', display:'flex', alignItems:'center', gap:12, padding:'12px 14px', borderRadius:12, border:'none', cursor:'pointer', fontSize:13, fontWeight:600, background: active ? C.navActive : 'transparent', boxShadow: active ? C.navGlow : 'none', color: active ? '#fff' : C.navTxt, transition:'background .15s, color .15s' }} onMouseEnter={e => { if (!active) { e.currentTarget.style.background=C.navHover; e.currentTarget.style.color='rgba(255,255,255,.9)'; } }} onMouseLeave={e => { if (!active) { e.currentTarget.style.background='transparent'; e.currentTarget.style.color=C.navTxt; } }}>
                <span style={{ width:22, textAlign:'center', flexShrink:0, opacity:active?1:.75 }}><Icon size={18} /></span>
                <span>{label}</span>
                {active && <span style={{ marginLeft:'auto', width:6, height:6, borderRadius:'50%', background:'rgba(255,255,255,.7)' }} />}
              </button>
            );
          })}
        </nav>
      </aside>

      <main style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, overflow:'hidden' }}>
        <header style={{ height:72, background:C.surface, borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:16 }}>
            <button className="ypMobile" onClick={()=>setSideOpen(true)} style={{ background:C.page, border:`1px solid ${C.border}`, color:C.txt2, cursor:'pointer', padding:8, borderRadius:10, display:'flex' }}><IcoMenu size={18} /></button>
            <h1 style={{ fontSize:16, fontWeight:800, color:C.txt, display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ color:C.teal }}><current.Icon size={18}/></span> {current.label}
            </h1>
          </div>
        </header>

        <div style={{ flex:1, overflowY:'auto', padding:'24px', position:'relative' }}>
          <div style={{ maxWidth:1100, margin:'0 auto' }}>
            {loading ? (
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:280, gap:14 }}>
                <span className="ypSpin" style={{ color:C.teal, display:'flex' }}><IcoRefresh size={40} /></span>
                <p style={{ color:C.txt2, fontWeight:500 }}>Yükleniyor…</p>
              </div>
            ) : (
              <>
                {tab === 'dashboard' && <DashboardView customers={customers} samples={samples} prices={prices} notes={notes} offers={offers} onNav={goTo} />}
                {tab === 'customers' && <CustomersView data={customers} onRefresh={loadData} />}
                {tab === 'samples'   && <SamplesView   data={samples} tbl={samplesTbl} onRefresh={loadData} />}
                {tab === 'prices'    && <PricesView    data={prices}    onRefresh={loadData} />}
                {tab === 'cost'      && <CostView      data={costs}     onRefresh={loadData} />}
                {tab === 'notes'     && <NotesView     data={notes} customers={customers} onRefresh={loadData} />}
                {tab === 'offers'    && <OffersView    data={offers} customers={customers} onRefresh={loadData} />}
                {tab === 'converter' && <ConverterView />}
              </>
            )}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
