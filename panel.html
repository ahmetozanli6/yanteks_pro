// ── Yardımcılar ───────────────────────────────────────────────────────────
const getVal = (item, keys, fallback = null) => {
  if (!item) return fallback;
  for (let k of keys) {
    const sk = k.toLocaleLowerCase('tr-TR').replace(/[^a-z0-9ğüşöçı]/g,'');
    for (let ok of Object.keys(item)) {
      const sok = ok.toLocaleLowerCase('tr-TR').replace(/[^a-z0-9ğüşöçı]/g,'');
      if (sok === sk && item[ok] !== null && item[ok] !== '') return item[ok];
    }
  }
  for (let k of keys) {
    const sk = k.toLocaleLowerCase('tr-TR').replace(/[^a-z0-9ğüşöçı]/g,'');
    if (sk.length < 3) continue;
    for (let ok of Object.keys(item)) {
      const sok = ok.toLocaleLowerCase('tr-TR').replace(/[^a-z0-9ğüşöçı]/g,'');
      if (sok.includes(sk) && item[ok] !== null && item[ok] !== '') return item[ok];
    }
  }
  return fallback;
};

const debugVal = (item, keys) => {
  const v = getVal(item, keys, null);
  if (v !== null) return v;
  if (item && Object.keys(item).length > 0) {
    const ks = Object.keys(item).filter(k => !['id','created_at'].includes(k)).join(', ');
    return `[Sütunlar: ${ks}]`;
  }
  return '-';
};

const fmtDate = (d) => {
  if (!d) return '-';
  try {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('tr-TR', { day:'2-digit', month:'short', year:'numeric' });
  } catch { return d; }
};

    'Reddedildi':   ['rgba(153,27,27,.1)',   '#991B1B', 'rgba(153,27,27,.25)'],
  };
  const [bg, color, border] = m[status] || ['rgba(71,85,105,.1)','#475569','rgba(71,85,105,.2)'];

        <div>

function CustomersView({ data, onRefresh }) {
  const [q, setQ]           = React.useState('');
  const [sf, setSf]         = React.useState('all');
  const [sort, setSort]     = React.useState('az');
  const [busy, setBusy]     = React.useState(null);
  const [showAdd, setShowAdd]   = React.useState(false);
  const [editItem, setEditItem] = React.useState(null);
  const [saving, setSaving]     = React.useState(false);
  const emptyForm = { firma_adi:'', bolge:'', son_ziyaret:'', ziyaret_durumu:'ziyaret edilecek', notlar:'' };
  const [form, setForm]     = React.useState(emptyForm);

  const tdy = () => new Date().toISOString().slice(0,10);

  const daysSince = (d) => {
    if (!d) return null;
    const diff = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
    return diff >= 0 ? diff : null;
  };

  const lateLevel = (m) => {
    if (m.ziyaret_durumu !== 'ziyaret edildi') return null;
    const ds = daysSince(m.son_ziyaret);
    if (ds === null) return null;
    if (ds >= 60) return 'red';
    if (ds >= 30) return 'amber';
    return null;
  };

  const visited = (m) => m.ziyaret_durumu === 'ziyaret edildi';

  const filtered = data
    .filter(m => {
      if (sf === 'visited' && !visited(m)) return false;
      if (sf === 'pending' && visited(m)) return false;
      if (sf === 'late' && lateLevel(m) !== 'red' && lateLevel(m) !== 'amber') return false;
      if (sf === 'notlu' && !m.notlar) return false;
      if (q) {
        const Q = q.toLowerCase();
        const f1 = (m.firma_adi||'').toLowerCase();
        const f2 = (m.bolge||'').toLowerCase();
        const f3 = (m.notlar||'').toLowerCase();
        if (!f1.includes(Q) && !f2.includes(Q) && !f3.includes(Q)) return false;
      }
      return true;
    })
    .sort((a, b) => {
      if (sort === 'az')   return (a.firma_adi||'').localeCompare(b.firma_adi||'', 'tr');
      if (sort === 'late') return (daysSince(b.son_ziyaret)||0) - (daysSince(a.son_ziyaret)||0);
      if (sort === 'bolge') return (a.bolge||'').localeCompare(b.bolge||'', 'tr');
      return 0;
    });

  const visitToday = async (m) => {
    setBusy(m.id);
    await db.from('musteriler').update({ ziyaret_durumu:'ziyaret edildi', son_ziyaret: tdy() }).eq('id', m.id);
    await onRefresh(); setBusy(null);
  };

  const delItem = async (m) => {
    if (!window.confirm(`"${m.firma_adi}" silinsin mi?`)) return;
    setBusy(m.id);
    await db.from('musteriler').delete().eq('id', m.id);
    await onRefresh(); setBusy(null);
  };

  const openAdd = () => { setForm(emptyForm); setEditItem(null); setShowAdd(true); };
  const openEdit = (m) => {
    setForm({ firma_adi:m.firma_adi||'', bolge:m.bolge||'', son_ziyaret:m.son_ziyaret||'', ziyaret_durumu:m.ziyaret_durumu||'ziyaret edilecek', notlar:m.notlar||'' });
    setEditItem(m); setShowAdd(true);
  };

  const save = async () => {
    if (!form.firma_adi.trim()) return;
    setSaving(true);
    const pay = { firma_adi: form.firma_adi.trim().toUpperCase(), bolge: form.bolge.trim().toUpperCase(), son_ziyaret: form.son_ziyaret || null, ziyaret_durumu: form.ziyaret_durumu, notlar: form.notlar.trim() || null };
    if (editItem) await db.from('musteriler').update(pay).eq('id', editItem.id);
    else           await db.from('musteriler').insert([pay]);
    setSaving(false); setShowAdd(false); setEditItem(null);
    await onRefresh();
  };

  const cntV = data.filter(visited).length;
  const cntP = data.length - cntV;
  const cntL = data.filter(m => lateLevel(m) !== null).length;
  const cntN = data.filter(m => m.notlar).length;

  const FILTERS = [
    ['all','Tümü',data.length,C.teal,C.tealS],
    ['visited','✅ Gidilen',cntV,C.green,C.greenS],
    ['pending','⏳ Bekleyen',cntP,C.amber,C.amberS],
    ['late','🔴 Geciken',cntL,C.red,C.redS],
    ['notlu','📝 Notlu',cntN,'#7C3AED','rgba(124,58,237,.1)'],
  ];

  // Bölge gruplama
  const [openBolge, setOpenBolge] = React.useState(new Set());
  const toggleBolge = (b) => setOpenBolge(prev => {
    const n = new Set(prev); n.has(b) ? n.delete(b) : n.add(b); return n;
  });
  const bolgeMap = {};
  filtered.forEach(m => {
    const b = m.bolge || '—';
    if (!bolgeMap[b]) bolgeMap[b] = [];
    bolgeMap[b].push(m);
  });
  const bolgeList = Object.keys(bolgeMap).sort((a,b) => a.localeCompare(b,'tr'));

  const exportXL = async () => {
    const dt = new Date().toLocaleDateString('tr-TR');
    const wb = new ExcelJS.Workbook(); wb.creator = 'Yanteks Pro';
    const sh = wb.addWorksheet('Müşteriler');
    sh.mergeCells('A1:F1');
    const tc = sh.getCell('A1');
    tc.value = 'YANTEKS MÜŞTERİ LİSTESİ · ' + dt;
    tc.font = { bold:true, size:13, color:{ argb:'FFFFFFFF' } };
    tc.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0672A0' } };
    tc.alignment = { horizontal:'center', vertical:'middle' };
    sh.getRow(1).height = 28;
    const hr = sh.addRow(['FİRMA ADI','BÖLGE','SON ZİYARET','SÜRE (GÜN)','DURUM','NOTLAR']);
    hr.eachCell(c => { c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0891B2'}}; c.font={color:{argb:'FFFFFFFF'},bold:true}; c.alignment={horizontal:'center'}; });
    hr.height = 20;
    sh.columns = [{width:32},{width:16},{width:14},{width:14},{width:18},{width:40}];
    filtered.forEach(m => {
      const ds = daysSince(m.son_ziyaret);
      const row = sh.addRow([m.firma_adi||'', m.bolge||'', m.son_ziyaret||'', ds!==null?ds:'', visited(m)?'Ziyaret Edildi':'Bekliyor', m.notlar||'']);
      row.getCell(1).font = { bold:true };
      if (lateLevel(m)==='red') row.getCell(4).font = { color:{argb:'FF991B1B'}, bold:true };
      else if (lateLevel(m)==='amber') row.getCell(4).font = { color:{argb:'FFB45309'}, bold:true };
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Yanteks_Musteriler_'+dt.replace(/\./g,'-')+'.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>

      {/* Modal: Yeni / Düzenle */}
      {showAdd && (
        <div onClick={e=>e.target===e.currentTarget&&setShowAdd(false)}
          style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:50,
            display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
          <div style={{ background:'#fff', borderRadius:20, padding:24, width:'100%', maxWidth:420,
            boxShadow:'0 20px 60px rgba(0,0,0,.3)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18 }}>
              <h3 style={{ fontSize:17, fontWeight:800, color:C.txt }}>{editItem ? '✏️ Düzenle' : '➕ Yeni Müşteri'}</h3>
              <button onClick={()=>setShowAdd(false)} style={{ background:'none',border:'none',cursor:'pointer',color:C.txt2,display:'flex' }}><IcoX size={20}/></button>
            </div>
            {[['Firma Adı *','firma_adi','text'],['Bölge','bolge','text'],['Son Ziyaret','son_ziyaret','date']].map(([lbl,key,type])=>(
              <div key={key} style={{ marginBottom:12 }}>
                <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>{lbl}</label>
                <input type={type} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                  style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt }} />
              </div>
            ))}
            <div style={{ marginBottom:12 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Durum</label>
              <select value={form.ziyaret_durumu} onChange={e=>setForm(f=>({...f,ziyaret_durumu:e.target.value}))}
                style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt,background:'#fff',cursor:'pointer' }}>
                <option value="ziyaret edilecek">⏳ Ziyaret Edilecek</option>
                <option value="ziyaret edildi">✅ Ziyaret Edildi</option>
              </select>
            </div>
            <div style={{ marginBottom:18 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Notlar</label>
              <textarea value={form.notlar} onChange={e=>setForm(f=>({...f,notlar:e.target.value}))} rows={2}
                style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt,resize:'vertical' }} />
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={()=>setShowAdd(false)} style={{ flex:1,padding:10,border:`1px solid ${C.border2}`,borderRadius:10,cursor:'pointer',background:'none',fontSize:13,fontWeight:600,color:C.txt2 }}>İptal</button>
              <button onClick={save} disabled={saving||!form.firma_adi.trim()}
                style={{ flex:2,padding:10,border:'none',borderRadius:10,cursor:'pointer',
                  background:'linear-gradient(135deg,#0672A0,#0891B2)',color:'#fff',fontSize:13,fontWeight:700,
                  opacity:saving||!form.firma_adi.trim()?0.5:1 }}>
                {saving ? 'Kaydediliyor…' : '💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Başlık */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:900, color:C.txt, letterSpacing:'-.02em' }}>Müşteri Portföyü</h2>
          <p style={{ fontSize:12, color:C.txt2, marginTop:2 }}>{filtered.length} / {data.length} firma</p>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={exportXL} style={{ background:'none', border:`1px solid ${C.border2}`, borderRadius:10,
            padding:'8px 14px', fontSize:12, fontWeight:700, color:C.txt2, cursor:'pointer',
            display:'flex', alignItems:'center', gap:5 }}>📊 Excel</button>
          <button onClick={openAdd} style={{ background:'linear-gradient(135deg,#0672A0,#0891B2)',
            color:'#fff', border:'none', borderRadius:10, padding:'8px 16px', fontSize:13,
            fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:5,
            boxShadow:'0 4px 12px rgba(8,145,178,.3)' }}><IcoPlus size={16}/> Yeni Müşteri</button>
        </div>
      </div>

      {/* Arama + Sıralama */}
      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2, display:'flex' }}><IcoSearch size={14}/></span>
          <input placeholder="Firma adı, bölge veya not ara…" value={q} onChange={e=>setQ(e.target.value)}
            style={{ width:'100%', paddingLeft:34, paddingRight:12, paddingTop:9, paddingBottom:9,
              border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13, fontFamily:'Inter,sans-serif',
              outline:'none', color:C.txt, background:C.surface }} />
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{ padding:'9px 12px', border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13,
            fontFamily:'Inter,sans-serif', outline:'none', color:C.txt, background:C.surface, cursor:'pointer' }}>
          <option value="az">🔤 A-Z</option>
          <option value="late">📅 Son Ziyarete Göre</option>
          <option value="bolge">📍 Bölgeye Göre</option>
          <option value="late">⏰ Geç Ziyaret</option>
        </select>
      </div>

      {/* Filtre çipleri */}
      <div style={{ display:'flex', gap:7, flexWrap:'wrap' }}>
        {FILTERS.map(([val,lbl,cnt,col,bg]) => {
          const active = sf === val;
          return (
            <button key={val} onClick={()=>setSf(val)}
              style={{ padding:'6px 13px', borderRadius:18, border:`2px solid ${active?col:C.border}`,
                background:active?bg:'transparent', color:active?col:C.txt2, fontSize:12,
                fontWeight:700, cursor:'pointer', transition:'all .15s', whiteSpace:'nowrap' }}>
              {lbl} <span style={{ opacity:.7 }}>{cnt}</span>
            </button>
          );
        })}
      </div>

      {/* Bölge Akordeonları */}
      {filtered.length === 0
        ? <div style={{ padding:32, textAlign:'center', color:C.txt2, background:C.surface, borderRadius:16, border:`1px solid ${C.border}` }}>
            {q||sf!=='all' ? 'Filtreye uyan kayıt yok.' : 'Henüz müşteri kaydı yok.'}
          </div>
        : bolgeList.map(bolge => {
          const items = bolgeMap[bolge];
          const isOpen = openBolge.has(bolge) || q.length > 0 || sf !== 'all';
          const lateC  = items.filter(m => lateLevel(m) !== null).length;
          return (
            <div key={bolge} style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, overflow:'hidden' }}>
              {/* Bölge başlığı */}
              <div onClick={()=>toggleBolge(bolge)}
                style={{ display:'flex', alignItems:'center', gap:10, padding:'12px 18px',
                  cursor:'pointer', background:isOpen?C.page:C.surface, borderBottom:isOpen?`1px solid ${C.border2}`:'none' }}>
                <span style={{ fontSize:14, color:C.txt2, transition:'transform .2s',
                  transform:isOpen?'rotate(0deg)':'rotate(-90deg)' }}>▼</span>
                <span style={{ fontSize:13, fontWeight:800, color:C.txt, flex:1 }}>📍 {bolge}</span>
                <span style={{ background:C.tealS, color:C.teal, fontSize:11, fontWeight:700,
                  padding:'2px 8px', borderRadius:8 }}>{items.length} firma</span>
                {lateC > 0 && <span style={{ background:C.redS, color:C.red, fontSize:10, fontWeight:700,
                  padding:'2px 7px', borderRadius:7 }}>⏰ {lateC} geciken</span>}
              </div>
              {/* Firma kartları */}
              {isOpen && items.map((m, i) => {
                const done   = visited(m);
                const lv     = lateLevel(m);
                const ds     = daysSince(m.son_ziyaret);
                const isBusy = busy === m.id;
                return (
                  <div key={m.id||i}
                    style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 18px',
                      borderBottom: i < items.length-1 ? `1px solid ${C.border}` : 'none',
                      transition:'background .15s', opacity:isBusy?0.5:1,
                      background: lv==='red'?'rgba(153,27,27,.04)':lv==='amber'?'rgba(180,83,9,.04)':'transparent' }}
                    onMouseEnter={e=>e.currentTarget.style.background=C.tealS}
                    onMouseLeave={e=>e.currentTarget.style.background=lv==='red'?'rgba(153,27,27,.04)':lv==='amber'?'rgba(180,83,9,.04)':'transparent'}>
                    <div style={{ width:34, height:34, borderRadius:9, background:done?C.greenS:C.tealS,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      color:done?C.green:C.teal, fontSize:13, fontWeight:800, flexShrink:0 }}>
                      {(m.firma_adi||'?')[0]}
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontWeight:700, fontSize:13, color:C.txt,
                        overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                        {m.firma_adi}
                      </div>
                      <div style={{ display:'flex', gap:10, marginTop:3, flexWrap:'wrap', alignItems:'center' }}>
                        {ds !== null && (
                          <span style={{ fontSize:11, fontWeight:700,
                            color:lv==='red'?C.red:lv==='amber'?C.amber:C.green, fontFamily:'monospace' }}>
                            {lv==='red'?'🔴':lv==='amber'?'🟡':'✅'} {ds} gün önce
                          </span>
                        )}
                        {m.notlar && <span style={{ fontSize:11, color:C.txt2, fontStyle:'italic',
                          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:160 }}>
                          📝 {m.notlar}
                        </span>}
                      </div>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
                      {!done && (
                        <button onClick={()=>visitToday(m)} disabled={isBusy}
                          style={{ background:C.greenS, border:`1px solid rgba(21,128,61,.2)`, color:C.green,
                            borderRadius:7, padding:'5px 9px', cursor:'pointer', fontSize:11, fontWeight:700, whiteSpace:'nowrap' }}>
                          ✓ Bugün
                        </button>
                      )}
                      <button onClick={()=>openEdit(m)} disabled={isBusy}
                        style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:5,borderRadius:7 }}
                        onMouseEnter={e=>e.currentTarget.style.color=C.teal}
                        onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoEdit size={14}/></button>
                      <button onClick={()=>delItem(m)} disabled={isBusy}
                        style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:5,borderRadius:7 }}
                        onMouseEnter={e=>e.currentTarget.style.color=C.red}
                        onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoTrash size={14}/></button>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })
      }
    </div>
  );
}

// ── NUMUNELER (TAM FONKSİYONEL) ──────────────────────────────────────────
function SamplesView({ data, tbl, onRefresh }) {
  const [q, setQ]       = React.useState('');
  const [sf, setSf]     = React.useState('all');
  const [sort, setSort] = React.useState('new');
  const [busy, setBusy] = React.useState(null);
  const [showAdd, setShowAdd] = React.useState(false);
  const [form, setForm] = React.useState({ musteri:'', cinsi:'', miktar:'', fiyat:'', not:'', durum:'Beklemede' });
  const [saving, setSaving] = React.useState(false);
  const [selIds, setSelIds] = React.useState(new Set());
  const [bulkBusy, setBulkBusy] = React.useState(false);

  const relDate = (d) => {
    if (!d) return '';
    const diff = Math.floor((Date.now() - new Date(d)) / 86400000);
    if (diff === 0) return 'bugün';
    if (diff === 1) return 'dün';
    if (diff < 7)  return diff + 'g';
    if (diff < 30) return Math.floor(diff/7) + 'h';
    if (diff < 365) return Math.floor(diff/30) + 'ay';
    return Math.floor(diff/365) + 'y';
  };

  const toggleSel = (id) => setSelIds(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  });
  const toggleAll = () => setSelIds(prev =>
    prev.size === filtered.length ? new Set() : new Set(filtered.map(s => s.id))
  );
  const clearSel = () => setSelIds(new Set());

  const bulkStatus = async (ns) => {
    if (!selIds.size) return;
    setBulkBusy(true);
    const ids = [...selIds];
    if (ns === 'Arşiv') {
      await db.from(tbl).update({ arsiv: true }).in('id', ids);
    } else {
      await db.from(tbl).update({ durum: ns, arsiv: false }).in('id', ids);
    }
    setBulkBusy(false); clearSel(); await onRefresh();
  };

  const bulkDelete = async () => {
    if (!selIds.size || !window.confirm(selIds.size + ' numune silinsin mi?')) return;
    setBulkBusy(true);
    await db.from(tbl).delete().in('id', [...selIds]);
    setBulkBusy(false); clearSel(); await onRefresh();
  };

  // DB'deki gerçek değerler
  const STATUSES    = ['Beklemede','Takip Et','Gönderildi','Onaylandı','Reddedildi','Arşiv'];
  const LABELS = { Beklemede:'⏳ Bekle', 'Takip Et':'👀 Takip', Gönderildi:'🚀 Gitti', Onaylandı:'✅ Onay', Reddedildi:'❌ Red', Arşiv:'🗂️ Arşiv' };
  const SHORT  = { Beklemede:'Bekle', 'Takip Et':'Takip', Gönderildi:'Gitti', Onaylandı:'Onay', Reddedildi:'Red', Arşiv:'Arşiv' };
  const EMO    = { Beklemede:'⏳', 'Takip Et':'👀', Gönderildi:'🚀', Onaylandı:'✅', Reddedildi:'❌', Arşiv:'🗂️' };
  // Chip renkleri (filtre çubukları için — alpha arka plan)
  const CLRS = {
    Beklemede:  ['rgba(217,119,6,.12)','#B45309'],  'Takip Et': ['rgba(8,145,178,.12)','#0891B2'],
    Gönderildi: ['rgba(29,78,216,.12)','#1D4ED8'],  Onaylandı:  ['rgba(21,128,61,.12)','#15803D'],
    Reddedildi: ['rgba(153,27,27,.12)','#991B1B'],  Arşiv:      ['rgba(71,85,105,.12)','#475569'],
  };
  // Dropdown renkleri (solid — iOS'ta alpha yok sayılıyor)
  const DCLR = {
    Beklemede: '#B45309', 'Takip Et': '#0891B2',
    Gönderildi:'#1D4ED8', Onaylandı: '#15803D',
    Reddedildi:'#991B1B', Arşiv:     '#475569',
  };

  const isArsiv = (s) => s.arsiv === true;
  const getDur  = (s) => isArsiv(s) ? 'Arşiv' : (getVal(s,['durum','status'],'') || 'Beklemede');

  const filtered = data
    .filter(s => {
      if (sf === 'Arşiv') return isArsiv(s);
      if (sf !== 'all') { if (isArsiv(s) || getDur(s) !== sf) return false; }
      else { if (isArsiv(s)) return false; }
      if (q) {
        const Q = q.toLowerCase();
        const f1 = String(getVal(s,['firma','musteri','müşteri','firmaadi','firmaadı'],'') || '').toLowerCase();
        const f2 = String(getVal(s,['numune','cinsi','cins','urun','ürün'],'') || '').toLowerCase();
        const f3 = String(getVal(s,['aciklama','not','açıklama','note'],'') || '').toLowerCase();
        if (!f1.includes(Q) && !f2.includes(Q) && !f3.includes(Q)) return false;
      }
      return true;
    })
    .sort((a,b) => {
      if (sort==='new') return new Date(b.created_at||0)-new Date(a.created_at||0);
      if (sort==='old') return new Date(a.created_at||0)-new Date(b.created_at||0);
      const fa=String(getVal(a,['firma','musteri'],'') || '');
      const fb=String(getVal(b,['firma','musteri'],'') || '');
      return fa.localeCompare(fb,'tr');
    });

  const counts = {};
  STATUSES.forEach(st => {
    if (st === 'Arşiv') counts[st] = data.filter(i => isArsiv(i)).length;
    else counts[st] = data.filter(i => !isArsiv(i) && getDur(i) === st).length;
  });

  const setStatus = async (item, ns) => {
    if (!item.id || !tbl) return;
    setBusy(item.id);
    if (ns === 'Arşiv') {
      await db.from(tbl).update({ arsiv: true }).eq('id', item.id);
    } else {
      await db.from(tbl).update({ durum: ns, arsiv: false }).eq('id', item.id);
    }
    await onRefresh(); setBusy(null);
  };

  const delItem = async (item) => {
    if (!item.id || !tbl) return;
    const firma = getVal(item,['musteri','müşteri','firma'],'?');
    if (!window.confirm(`"${firma}" silinsin mi?`)) return;
    setBusy(item.id);
    await db.from(tbl).delete().eq('id', item.id);
    await onRefresh(); setBusy(null);
  };

  const addSample = async () => {
    if (!tbl || !form.musteri.trim()) return;
    setSaving(true);
    const fiyatVal = form.fiyat ? (form.fiyat.startsWith('$') ? form.fiyat : '$'+form.fiyat) : '';
    await db.from(tbl).insert({ firma:form.musteri.toUpperCase(), numune:form.cinsi, fiyat:fiyatVal, aciklama:form.not, durum:form.durum, arsiv:false });
    setSaving(false); setShowAdd(false);
    setForm({ musteri:'', cinsi:'', miktar:'', fiyat:'', not:'', durum:'Beklemede' });
    await onRefresh();
  };

  const exportXL = async () => {
    if (!filtered.length) return;
    const dt = new Date().toLocaleDateString('tr-TR');
    const wb = new ExcelJS.Workbook(); wb.creator = 'Yanteks Pro';
    const sh = wb.addWorksheet('Numuneler', { pageSetup:{ paperSize:9, orientation:'landscape' } });
    sh.mergeCells('A1:F1');
    const tc = sh.getCell('A1');
    tc.value = 'YANTEKS NUMUNE TAKİBİ · ' + dt;
    tc.font = { bold:true, size:14, color:{ argb:'FFFFFFFF' } };
    tc.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFC2410C' } };
    tc.alignment = { horizontal:'center', vertical:'middle' };
    sh.getRow(1).height = 30;
    const hr = sh.addRow(['FİRMA','NUMUNE','FİYAT','DURUM','NOTLAR','TARİH']);
    hr.eachCell(c => {
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFEA580C' } };
      c.font = { color:{ argb:'FFFFFFFF' }, bold:true };
      c.alignment = { horizontal:'center', vertical:'middle' };
    });
    hr.height = 22;
    sh.columns = [{width:28},{width:30},{width:12},{width:14},{width:36},{width:14}];
    filtered.forEach(s => {
      const firma  = getVal(s,['firma','musteri','müşteri'],'') || '';
      const numune = getVal(s,['numune','cinsi','cins','urun'],'') || '';
      const rawF   = String(getVal(s,['fiyat','birimfiyat'],'') || '').replace(/^\$/,'');
      const dur    = getDur(s);
      const label  = SHORT[dur] || dur;
      const acik   = getVal(s,['aciklama','not','çözüm'],'') || '';
      const tarih  = fmtDate(s.updated_at || s.created_at || '');
      const row = sh.addRow([firma, numune, rawF ? '$'+rawF : '', label, acik, tarih]);
      row.getCell(1).font = { bold:true };
      if (rawF) { row.getCell(3).font = { color:{ argb:'FF15803D' }, bold:true }; row.getCell(3).alignment = { horizontal:'right' }; }
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Yanteks_Numune_' + dt.replace(/\./g,'-') + '.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>

      {/* ── Modal: Yeni Numune ── */}
      {showAdd && (
        <div onClick={e=>e.target===e.currentTarget&&setShowAdd(false)}
          style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:50,
            display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
          <div style={{ background:'#fff', borderRadius:20, padding:24, width:'100%', maxWidth:420,
            boxShadow:'0 20px 60px rgba(0,0,0,.3)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18 }}>
              <h3 style={{ fontSize:17, fontWeight:800, color:C.txt }}>Yeni Numune</h3>
              <button onClick={()=>setShowAdd(false)} style={{ background:'none', border:'none', cursor:'pointer', color:C.txt2, display:'flex' }}><IcoX size={20}/></button>
            </div>
            {[['Müşteri / Firma *','musteri'],['Cinsi / Kalite','cinsi'],['Miktar','miktar'],['Fiyat ($)','fiyat'],['Not','not']].map(([lbl,key])=>(
              <div key={key} style={{ marginBottom:12 }}>
                <label style={{ fontSize:10, fontWeight:700, color:C.txt2, display:'block', marginBottom:5, textTransform:'uppercase', letterSpacing:'.08em' }}>{lbl}</label>
                <input value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                  style={{ width:'100%', padding:'9px 12px', border:`1px solid ${C.border2}`, borderRadius:9, fontSize:13, fontFamily:'Inter,sans-serif', outline:'none', color:C.txt }} />
              </div>
            ))}
            <div style={{ marginBottom:18 }}>
              <label style={{ fontSize:10, fontWeight:700, color:C.txt2, display:'block', marginBottom:5, textTransform:'uppercase', letterSpacing:'.08em' }}>Durum</label>
              <select value={form.durum} onChange={e=>setForm(f=>({...f,durum:e.target.value}))}
                style={{ width:'100%', padding:'9px 12px', border:`1px solid ${C.border2}`, borderRadius:9, fontSize:13, fontFamily:'Inter,sans-serif', outline:'none', color:C.txt, background:'#fff', cursor:'pointer' }}>
                {STATUSES.map(s=><option key={s} value={s}>{EMO[s]} {LABELS[s]||s}</option>)}
              </select>
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={()=>setShowAdd(false)} style={{ flex:1, padding:10, border:`1px solid ${C.border2}`, borderRadius:10, cursor:'pointer', background:'none', fontSize:13, fontWeight:600, color:C.txt2 }}>İptal</button>
              <button onClick={addSample} disabled={saving||!form.musteri.trim()}
                style={{ flex:2, padding:10, border:'none', borderRadius:10, cursor:'pointer',
                  background:'linear-gradient(135deg,#0672A0,#0891B2)', color:'#fff', fontSize:13, fontWeight:700,
                  opacity:saving||!form.musteri.trim()?0.5:1 }}>
                {saving ? 'Kaydediliyor…' : '💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Başlık ── */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:900, color:C.txt, letterSpacing:'-.02em' }}>Numune Takibi</h2>
          <p style={{ fontSize:12, color:C.txt2, marginTop:2 }}>{filtered.length} / {data.filter(i=>!isArsiv(i)).length} kayıt</p>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={exportXL} style={{ background:'none', border:`1px solid ${C.border2}`, borderRadius:10,
            padding:'8px 14px', fontSize:12, fontWeight:700, color:C.txt2, cursor:'pointer',
            display:'flex', alignItems:'center', gap:5 }}>📊 Excel</button>
          <button onClick={()=>setShowAdd(true)} style={{ background:'linear-gradient(135deg,#C2410C,#EA580C)',
            color:'#fff', border:'none', borderRadius:10, padding:'8px 16px', fontSize:13,
            fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:5,
            boxShadow:'0 4px 12px rgba(234,88,12,.3)' }}><IcoPlus size={16}/> Yeni</button>
        </div>
      </div>

      {/* ── Arama + Sıralama ── */}
      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2, display:'flex' }}><IcoSearch size={14}/></span>
          <input placeholder="Firma, cinsi veya not ara…" value={q} onChange={e=>setQ(e.target.value)}
            style={{ width:'100%', paddingLeft:34, paddingRight:12, paddingTop:9, paddingBottom:9,
              border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13, fontFamily:'Inter,sans-serif',
              outline:'none', color:C.txt, background:C.surface }} />
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{ padding:'9px 12px', border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13,
            fontFamily:'Inter,sans-serif', outline:'none', color:C.txt, background:C.surface, cursor:'pointer' }}>
          <option value="new">⏱ En Yeni</option>
          <option value="old">📅 En Eski</option>
          <option value="az">🔤 A-Z</option>
        </select>
      </div>

      {/* ── Durum Filtreleri ── */}
      <div style={{ display:'flex', gap:7, flexWrap:'wrap' }}>
        {[['all','Tümü',data.filter(i=>!isArsiv(i)).length,'#0891B2','rgba(8,145,178,.1)'],...STATUSES.map(s=>[s,LABELS[s]||s,counts[s]||0,...(CLRS[s]||[C.border2,C.txt2]).reverse()])].map(([val,lbl,cnt,col,bg])=>{
          const active = sf === val;
          return (
            <button key={val} onClick={()=>setSf(active&&val!=='all'?'all':val)}
              style={{ padding:'6px 13px', borderRadius:18, border:`2px solid ${active?col:C.border}`,
                background:active?bg:'transparent', color:active?col:C.txt2, fontSize:12,
                fontWeight:700, cursor:'pointer', transition:'all .15s', whiteSpace:'nowrap' }}>
              {lbl} <span style={{ opacity:.7 }}>{cnt}</span>
            </button>
          );
        })}
      </div>

      {/* ── Toplu Seçim Araç Çubuğu ── */}
      {selIds.size > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 14px',
          background:'#1E293B', borderRadius:12, flexWrap:'wrap' }}>
          <span style={{ fontSize:13, fontWeight:700, color:'#fff', flex:1 }}>
            ✅ {selIds.size} seçili
          </span>
          {['Beklemede','Takip Et','Gönderildi','Onaylandı','Reddedildi','Arşiv'].map(st => (
            <button key={st} onClick={()=>bulkStatus(st)} disabled={bulkBusy}
              style={{ padding:'5px 10px', borderRadius:7, border:'none',
                background:DCLR[st]||'#475569', color:'#fff', fontSize:11, fontWeight:700, cursor:'pointer' }}>
              {SHORT[st]}
            </button>
          ))}
          <button onClick={bulkDelete} disabled={bulkBusy}
            style={{ padding:'5px 10px', borderRadius:7, border:'1px solid #DC2626',
              background:'transparent', color:'#DC2626', fontSize:11, fontWeight:700, cursor:'pointer' }}>
            🗑 Sil
          </button>
          <button onClick={clearSel}
            style={{ padding:'5px 10px', borderRadius:7, border:'1px solid #475569',
              background:'transparent', color:'#94A3B8', fontSize:11, cursor:'pointer' }}>
            İptal
          </button>
        </div>
      )}

      {/* ── Tümünü Seç ── */}
      {filtered.length > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:8, paddingLeft:4 }}>
          <input type="checkbox"
            checked={selIds.size > 0 && selIds.size === filtered.length}
            onChange={toggleAll}
            style={{ width:15, height:15, cursor:'pointer', accentColor:C.teal }} />
          <span style={{ fontSize:12, color:C.txt2 }} onClick={toggleAll}>
            {selIds.size > 0 ? selIds.size + ' / ' + filtered.length + ' seçili' : 'Tümünü seç'}
          </span>
        </div>
      )}

      {/* ── Kartlar ── */}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {filtered.length === 0
          ? <div style={{ padding:32, textAlign:'center', color:C.txt2, background:C.surface, borderRadius:16, border:`1px solid ${C.border}` }}>
              {q || sf !== 'all' ? 'Filtreye uyan kayıt yok.' : 'Henüz numune kaydı yok.'}
            </div>
          : filtered.map(s => {
            const dur = getDur(s);
            const isBusy = busy === s.id;
            const isSel = selIds.has(s.id);
            const rawFiyat = getVal(s,['fiyat','birimfiyat','price'],'');
            const fiyatStr = rawFiyat ? String(rawFiyat).replace(/^\$/,'') : '';
            const dateStr = relDate(s.updated_at || s.created_at || getVal(s,['tarih','date'],''));
            return (
              <div key={s.id||Math.random()}
                style={{ background: isSel ? 'rgba(8,145,178,.07)' : C.surface,
                  border:`1.5px solid ${isSel ? C.teal : C.border}`, borderRadius:13,
                  padding:'12px 16px', display:'flex', alignItems:'flex-start', gap:10,
                  opacity:isBusy?0.55:1, transition:'all .15s' }}>
                {/* Checkbox */}
                <input type="checkbox" checked={isSel} onChange={()=>toggleSel(s.id)}
                  style={{ width:15, height:15, cursor:'pointer', accentColor:C.teal, flexShrink:0, marginTop:3 }} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:8 }}>
                    <h4 style={{ fontWeight:800, fontSize:14, color:C.txt, margin:0, flex:1, minWidth:0,
                      overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                      {getVal(s,['firma','musteri','müşteri','firmaadi','firmaadı','customer','isim','kime']) || '—'}
                    </h4>
                    <select value={dur} disabled={isBusy} onChange={e=>setStatus(s,e.target.value)}
                      style={{ flexShrink:0, padding:'5px 8px', borderRadius:7, border:'none',
                        background:DCLR[dur]||'#475569', color:'#fff', fontSize:12, fontWeight:700,
                        cursor:'pointer', fontFamily:'Inter,sans-serif', outline:'none', minWidth:72 }}>
                      {STATUSES.map(st=><option key={st} value={st}>{SHORT[st]||st}</option>)}
                    </select>
                  </div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:'3px 14px', marginTop:5, fontSize:12, color:C.txt2 }}>
                    {getVal(s,['numune','cinsi','cins','urun','ürün','kalite']) &&
                      <span><strong style={{color:C.txt}}>{getVal(s,['numune','cinsi','cins','urun','ürün','kalite'])}</strong></span>}
                    {getVal(s,['miktar','adet','kg','quantity']) &&
                      <span style={{color:C.teal,fontWeight:700}}>{getVal(s,['miktar','adet','kg','quantity'])}</span>}
                    {fiyatStr &&
                      <span style={{color:C.green,fontWeight:700,fontFamily:'monospace'}}>${fiyatStr}</span>}
                    {dateStr && <span style={{fontFamily:'monospace',fontSize:11,color:C.txt2,
                      background:C.page,padding:'1px 5px',borderRadius:4}}>{dateStr}</span>}
                  </div>
                  {getVal(s,['aciklama','not','açıklama','note']) &&
                    <p style={{ margin:'5px 0 0', fontSize:11, color:C.txt2, fontStyle:'italic', lineHeight:1.4 }}>
                      💬 {getVal(s,['aciklama','not','açıklama','note'])}
                    </p>}
                </div>
                <button onClick={()=>delItem(s)} disabled={isBusy}
                  style={{ background:'none', border:'none', cursor:'pointer', color:C.border2, padding:4, borderRadius:7, flexShrink:0 }}
                  onMouseEnter={e=>e.currentTarget.style.color='#DC2626'}
                  onMouseLeave={e=>e.currentTarget.style.color=C.border2}>
                  <IcoTrash size={14}/>
                </button>
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

// ── FİYATLAR ────────────────────────────────────────────────────────────
// ── FİYATLAR (TAM FONKSİYONEL) ──────────────────────────────────────────
// ── FİYATLAR (TAM FONKSİYONEL) ──────────────────────────────────────────
function PricesView({ data, onRefresh }) {
  const [q, setQ]         = React.useState('');
  const [priceF, setPriceF] = React.useState('all'); // all | priced | unpriced
  const [busy, setBusy]   = React.useState(null);
  const [modal, setModal] = React.useState(null);
  const [editPrice, setEditPrice] = React.useState(null);
  const [saving, setSaving] = React.useState(false);
  const [openCats, setOpenCats] = React.useState(new Set());
  const [selIds, setSelIds] = React.useState(new Set());
  const [bulkModal, setBulkModal] = React.useState(false);
  const [bulkType, setBulkType] = React.useState('pct_up');
  const [bulkVal, setBulkVal] = React.useState('');
  const [bulkBusy, setBulkBusy] = React.useState(false);
  const emptyForm = { urun_kodu:'', denye:'', pesin_fiyat:'', bolum_adi:'' };
  const [form, setForm] = React.useState(emptyForm);

  // Orijinal sayfayla aynı: header = denye yok VE bolum_adi yok
  const isHdr = (p) => !p.denye && !p.bolum_adi;

  // Grupları oluştur (orijinal sırayla)
  const buildGroups = () => {
    const G = {}; let cur = null;
    const sorted = [...data].sort((a,b) => (a.id||0)-(b.id||0));
    sorted.forEach(p => {
      if (isHdr(p)) { cur = p.urun_kodu; if (!G[cur]) G[cur] = { hdr:p, items:[] }; }
      else if (cur) G[cur].items.push(p);
    });
    return G;
  };

  const G = buildGroups();
  const cats = Object.keys(G);

  // Arama filtresi
  const getFilteredItems = (items, catName) => {
    let fi = items;
    if (priceF === 'priced')   fi = fi.filter(p => p.pesin_fiyat > 0);
    if (priceF === 'unpriced') fi = fi.filter(p => !p.pesin_fiyat);
    if (!q) return fi;
    const Q = q.toLowerCase();
    const catMatch = catName.toLowerCase().includes(Q);
    const searched = fi.filter(p =>
      (p.urun_kodu||'').toLowerCase().includes(Q) ||
      (p.denye||'').toString().toLowerCase().includes(Q)
    );
    return catMatch ? fi : searched;
  };

  const allItems = cats.flatMap(c => G[c].items);
  const totalPriced   = allItems.filter(p => p.pesin_fiyat > 0).length;
  const totalUnpriced = allItems.filter(p => !p.pesin_fiyat).length;

  const toggleSel = (id) => setSelIds(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  });
  const toggleCatSel = (items) => {
    const ids = items.map(p => p.id);
    const allSelected = ids.every(id => selIds.has(id));
    setSelIds(prev => {
      const n = new Set(prev);
      allSelected ? ids.forEach(id => n.delete(id)) : ids.forEach(id => n.add(id));
      return n;
    });
  };
  const clearSel = () => setSelIds(new Set());

  const exportXL = async (withPrices) => {
    const items = selIds.size > 0
      ? allItems.filter(p => selIds.has(p.id))
      : allItems.filter(p => withPrices ? true : !p.pesin_fiyat);
    if (!items.length) return;
    const dt = new Date().toLocaleDateString('tr-TR');
    const wb = new ExcelJS.Workbook(); wb.creator = 'Yanteks Pro';
    const sh = wb.addWorksheet('Yanteks', { pageSetup:{ paperSize:9, orientation:'landscape' } });
    const cc = withPrices ? 5 : 2;
    sh.mergeCells(1,1,1,cc);
    const tc = sh.getCell('A1');
    tc.value = (withPrices ? 'YANTEKS FİYAT LİSTESİ' : 'EKSİK FİYATLAR') + ' (' + dt + ')';
    tc.font = { bold:true, size:14, color:{ argb:'FFFFFFFF' } };
    tc.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: withPrices ? 'FF14532D' : 'FFB45309' } };
    tc.alignment = { horizontal:'center', vertical:'middle' };
    sh.getRow(1).height = 30;
    const hdrs = withPrices ? ['ÜRÜN ADI','DENYE','PEŞİN ($)','90 GÜN ($)','180 GÜN ($)'] : ['ÜRÜN ADI','DENYE','BÖLÜM'];
    const hr = sh.addRow(hdrs);
    hr.eachCell(c => { c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF166534'}}; c.font={color:{argb:'FFFFFFFF'},bold:true}; c.alignment={horizontal:'center',vertical:'middle'}; });
    hr.height = 24;
    sh.columns = withPrices ? [{width:35},{width:15},{width:15},{width:15},{width:15}] : [{width:35},{width:15},{width:25}];
    let curBolum = '';
    items.forEach(p => {
      if (p.bolum_adi && p.bolum_adi !== curBolum) {
        curBolum = p.bolum_adi;
        const r = sh.addRow(['📂 ' + curBolum]);
        sh.mergeCells(r.number,1,r.number,cc);
        r.getCell(1).fill = { type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F7F2'} };
        r.getCell(1).font = { bold:true, color:{argb:'FF14532D'}, size:11 };
        r.height = 22;
      }
      const c = p.pesin_fiyat || 0;
      const row = sh.addRow(withPrices
        ? [p.urun_kodu||'', p.denye||'-', c.toFixed(2)+' $', (c+.10).toFixed(2)+' $', (c+.20).toFixed(2)+' $']
        : [p.urun_kodu||'', p.denye||'-', p.bolum_adi||'-']);
      row.getCell(1).font = { bold:true };
      if (withPrices && c > 0) { row.getCell(3).font={color:{argb:'FF15803D'},bold:true}; row.getCell(3).alignment={horizontal:'right'}; }
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Yanteks_' + (withPrices ? 'Fiyat' : 'Eksik') + '_' + dt.replace(/\./g,'-') + '.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  };

  const toggleCat = (name) => setOpenCats(prev => {
    const n = new Set(prev); n.has(name) ? n.delete(name) : n.add(name); return n;
  });

  const openAdd = (bolum = '') => { setForm({ ...emptyForm, bolum_adi: bolum }); setModal('new'); };
  const openEdit = (p) => {
    setForm({ urun_kodu:p.urun_kodu||'', denye:String(p.denye||''),
      pesin_fiyat:String(p.pesin_fiyat||''), bolum_adi:p.bolum_adi||'' });
    setModal(p);
  };

  const save = async () => {
    if (!form.urun_kodu.trim()) return;
    setSaving(true);
    const pf = parseFloat(form.pesin_fiyat)||0;
    const pay = { urun_kodu: form.urun_kodu.trim().toUpperCase(),
      denye: form.denye.trim()||null,
      pesin_fiyat: pf, vadeli_fiyat: pf > 0 ? parseFloat((pf+0.10).toFixed(2)) : 0,
      bolum_adi: form.bolum_adi.trim().toUpperCase()||null,
      updated_at: new Date().toISOString() };
    if (modal === 'new') await db.from('fiyatlar').insert([pay]);
    else await db.from('fiyatlar').update(pay).eq('id', modal.id);
    setSaving(false); setModal(null); await onRefresh();
  };

  const delItem = async (p) => {
    if (!window.confirm(`"${p.urun_kodu}" silinsin mi?`)) return;
    setBusy(p.id); await db.from('fiyatlar').delete().eq('id', p.id);
    await onRefresh(); setBusy(null);
  };

  const startEdit = (p) => setEditPrice({ id:p.id, val:String(p.pesin_fiyat||'') });
  const commitEdit = async (p) => {
    const nv = parseFloat(editPrice.val);
    if (isNaN(nv)) { setEditPrice(null); return; }
    setBusy(p.id);
    await db.from('fiyatlar').update({ pesin_fiyat:nv, vadeli_fiyat:parseFloat((nv+0.10).toFixed(2)), updated_at:new Date().toISOString() }).eq('id', p.id);
    setEditPrice(null); await onRefresh(); setBusy(null);
  };

  const doBulkUpdate = async () => {
    const v = parseFloat(bulkVal);
    if (isNaN(v) || v <= 0) return;
    const targets = selIds.size > 0
      ? allItems.filter(p => selIds.has(p.id) && p.pesin_fiyat > 0)
      : allItems.filter(p => p.pesin_fiyat > 0);
    if (!targets.length) return;
    setBulkBusy(true);
    for (const p of targets) {
      let nv = p.pesin_fiyat;
      if (bulkType === 'pct_up')   nv = parseFloat((p.pesin_fiyat * (1 + v/100)).toFixed(4));
      if (bulkType === 'pct_dn')   nv = parseFloat((p.pesin_fiyat * (1 - v/100)).toFixed(4));
      if (bulkType === 'fixed_up') nv = parseFloat((p.pesin_fiyat + v).toFixed(4));
      if (bulkType === 'fixed_dn') nv = parseFloat(Math.max(0, p.pesin_fiyat - v).toFixed(4));
      await db.from('fiyatlar').update({
        pesin_fiyat: nv,
        vadeli_fiyat: parseFloat((nv + 0.10).toFixed(4)),
        updated_at: new Date().toISOString()
      }).eq('id', p.id);
    }
    setBulkBusy(false); setBulkModal(false); setBulkVal('');
    await onRefresh();
  };

  const bulkPreview = () => {
    const v = parseFloat(bulkVal);
    if (isNaN(v) || v <= 0) return null;
    const sample = allItems.find(p => (selIds.size > 0 ? selIds.has(p.id) : true) && p.pesin_fiyat > 0);
    if (!sample) return null;
    let nv = sample.pesin_fiyat;
    if (bulkType === 'pct_up')   nv = sample.pesin_fiyat * (1 + v/100);
    if (bulkType === 'pct_dn')   nv = sample.pesin_fiyat * (1 - v/100);
    if (bulkType === 'fixed_up') nv = sample.pesin_fiyat + v;
    if (bulkType === 'fixed_dn') nv = Math.max(0, sample.pesin_fiyat - v);
    return { urun: sample.urun_kodu, eski: sample.pesin_fiyat.toFixed(2), yeni: nv.toFixed(2) };
  };

  const totalItems = cats.reduce((s,c) => s + G[c].items.length, 0);

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>

      {/* Toplu Fiyat Güncelleme Modal */}
      {bulkModal && (
        <div onClick={e=>e.target===e.currentTarget&&setBulkModal(false)}
          style={{ position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:50,
            display:'flex',alignItems:'center',justifyContent:'center',padding:16 }}>
          <div style={{ background:'#fff',borderRadius:20,padding:24,width:'100%',maxWidth:380,
            boxShadow:'0 20px 60px rgba(0,0,0,.3)' }}>
            <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16 }}>
              <h3 style={{ fontSize:17,fontWeight:800,color:C.txt }}>📈 Toplu Fiyat Güncelle</h3>
              <button onClick={()=>setBulkModal(false)} style={{ background:'none',border:'none',cursor:'pointer',color:C.txt2,display:'flex' }}><IcoX size={20}/></button>
            </div>
            <p style={{ fontSize:12,color:C.txt2,marginBottom:16 }}>
              {selIds.size > 0 ? `${selIds.size} seçili ürüne` : 'Tüm fiyatlı ürünlere'} uygulanacak.
            </p>
            <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16 }}>
              {[
                { k:'pct_up',  lbl:'% Artış',   icon:'📈' },
                { k:'pct_dn',  lbl:'% Azalış',  icon:'📉' },
                { k:'fixed_up',lbl:'$ Artış',   icon:'➕' },
                { k:'fixed_dn',lbl:'$ Azalış',  icon:'➖' },
              ].map(o=>(
                <button key={o.k} onClick={()=>setBulkType(o.k)}
                  style={{ padding:'10px 8px',borderRadius:10,border:`2px solid ${bulkType===o.k?C.green:C.border2}`,
                    background:bulkType===o.k?C.greenS:'none',color:bulkType===o.k?C.green:C.txt,
                    fontWeight:bulkType===o.k?800:500,fontSize:13,cursor:'pointer',transition:'all .15s' }}>
                  {o.icon} {o.lbl}
                </button>
              ))}
            </div>
            <div style={{ marginBottom:14 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>
                {bulkType.startsWith('pct') ? 'Yüzde (%)' : 'Miktar ($)'}
              </label>
              <input type="number" step="0.01" min="0" value={bulkVal}
                onChange={e=>setBulkVal(e.target.value)} placeholder="0.00"
                style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,
                  fontSize:15,fontFamily:'monospace',outline:'none',color:C.txt,textAlign:'right' }} />
            </div>
            {(() => { const pr = bulkPreview(); return pr && (
              <div style={{ padding:'10px 14px',background:C.greenS,borderRadius:10,marginBottom:14,
                border:`1px solid rgba(21,128,61,.2)`,fontSize:12 }}>
                <span style={{ color:C.txt2 }}>Örnek: </span>
                <span style={{ fontWeight:700,color:C.txt,fontFamily:'monospace' }}>{pr.urun}</span>
                <span style={{ color:C.txt2 }}> → </span>
                <span style={{ color:C.txt2,fontFamily:'monospace',textDecoration:'line-through' }}>${pr.eski}</span>
                <span style={{ color:C.txt2 }}> → </span>
                <span style={{ color:C.green,fontFamily:'monospace',fontWeight:800 }}>${pr.yeni}</span>
              </div>
            ); })()}
            <div style={{ display:'flex',gap:10 }}>
              <button onClick={()=>setBulkModal(false)} style={{ flex:1,padding:10,border:`1px solid ${C.border2}`,borderRadius:10,cursor:'pointer',background:'none',fontSize:13,fontWeight:600,color:C.txt2 }}>İptal</button>
              <button onClick={doBulkUpdate} disabled={bulkBusy||!bulkVal||parseFloat(bulkVal)<=0}
                style={{ flex:2,padding:10,border:'none',borderRadius:10,cursor:'pointer',
                  background:'linear-gradient(135deg,#15803D,#16A34A)',color:'#fff',fontSize:13,fontWeight:700,
                  opacity:bulkBusy||!bulkVal||parseFloat(bulkVal)<=0?0.5:1 }}>
                {bulkBusy ? 'Güncelleniyor…' : '✅ Güncelle'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Modal */}
      {modal !== null && (
        <div onClick={e=>e.target===e.currentTarget&&setModal(null)}
          style={{ position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:50,
            display:'flex',alignItems:'center',justifyContent:'center',padding:16 }}>
          <div style={{ background:'#fff',borderRadius:20,padding:24,width:'100%',maxWidth:400,
            boxShadow:'0 20px 60px rgba(0,0,0,.3)' }}>
            <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18 }}>
              <h3 style={{ fontSize:17,fontWeight:800,color:C.txt }}>{modal==='new'?'➕ Yeni Ürün':'✏️ Ürünü Düzenle'}</h3>
              <button onClick={()=>setModal(null)} style={{ background:'none',border:'none',cursor:'pointer',color:C.txt2,display:'flex' }}><IcoX size={20}/></button>
            </div>
            {[['Ürün Kodu *','urun_kodu'],['Denye','denye'],['Bölüm','bolum_adi']].map(([lbl,key])=>(
              <div key={key} style={{ marginBottom:12 }}>
                <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>{lbl}</label>
                <input value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                  style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt }} />
              </div>
            ))}
            <div style={{ marginBottom:18 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Peşin Fiyat ($)</label>
              <input type="number" step="0.01" min="0" value={form.pesin_fiyat}
                onChange={e=>setForm(f=>({...f,pesin_fiyat:e.target.value}))}
                style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'monospace',outline:'none',color:C.txt }} />
              {form.pesin_fiyat && <p style={{ fontSize:11,color:C.txt2,marginTop:4 }}>
                90 gün vadeli: ${((parseFloat(form.pesin_fiyat)||0)+0.10).toFixed(2)} · 180 gün: ${((parseFloat(form.pesin_fiyat)||0)+0.20).toFixed(2)}
              </p>}
            </div>
            <div style={{ display:'flex',gap:10 }}>
              <button onClick={()=>setModal(null)} style={{ flex:1,padding:10,border:`1px solid ${C.border2}`,borderRadius:10,cursor:'pointer',background:'none',fontSize:13,fontWeight:600,color:C.txt2 }}>İptal</button>
              <button onClick={save} disabled={saving||!form.urun_kodu.trim()}
                style={{ flex:2,padding:10,border:'none',borderRadius:10,cursor:'pointer',
                  background:'linear-gradient(135deg,#15803D,#16A34A)',color:'#fff',fontSize:13,fontWeight:700,
                  opacity:saving||!form.urun_kodu.trim()?0.5:1 }}>
                {saving?'Kaydediliyor…':'💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Başlık */}
      <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10 }}>
        <div>
          <h2 style={{ fontSize:22,fontWeight:900,color:C.txt,letterSpacing:'-.02em' }}>İplik Fiyatları</h2>
          <p style={{ fontSize:12,color:C.txt2,marginTop:2 }}>{cats.length} bölüm · {totalItems} ürün</p>
        </div>
        <div style={{ display:'flex',gap:8 }}>
          <button onClick={()=>setBulkModal(true)}
            style={{ background:'linear-gradient(135deg,#0672A0,#0891B2)',color:'#fff',border:'none',
              borderRadius:10,padding:'8px 14px',fontSize:13,fontWeight:700,cursor:'pointer',
              display:'flex',alignItems:'center',gap:5 }}>📈 Toplu Güncelle</button>
          <button onClick={()=>openAdd()} style={{ background:'linear-gradient(135deg,#15803D,#16A34A)',
            color:'#fff',border:'none',borderRadius:10,padding:'8px 16px',fontSize:13,
            fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:5,
            boxShadow:'0 4px 12px rgba(22,163,74,.3)' }}><IcoPlus size={16}/> Yeni Ürün</button>
        </div>
      </div>

      {/* Arama */}
      <div style={{ position:'relative' }}>
        <span style={{ position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:C.txt2,display:'flex' }}><IcoSearch size={14}/></span>
        <input placeholder="Ürün kodu veya denye ara…" value={q} onChange={e=>setQ(e.target.value)}
          style={{ width:'100%',paddingLeft:34,paddingRight:12,paddingTop:9,paddingBottom:9,
            border:`1px solid ${C.border2}`,borderRadius:10,fontSize:13,fontFamily:'Inter,sans-serif',
            outline:'none',color:C.txt,background:C.surface }} />
      </div>

      {/* Fiyat filtresi */}
      <div style={{ display:'flex',alignItems:'center',gap:8,flexWrap:'wrap' }}>
        {[
          { key:'all',     label:'Tümü',      count: allItems.length },
          { key:'priced',  label:'🟢 Fiyatlı', count: totalPriced },
          { key:'unpriced',label:'⚠️ Fiyatsız',count: totalUnpriced },
        ].map(chip => (
          <button key={chip.key} onClick={()=>setPriceF(chip.key)}
            style={{ padding:'5px 13px',borderRadius:20,border:`1px solid ${priceF===chip.key?C.green:C.border2}`,
              background:priceF===chip.key?C.greenS:'none',
              color:priceF===chip.key?C.green:C.txt2,
              fontWeight:priceF===chip.key?700:500,fontSize:12,cursor:'pointer',transition:'all .15s' }}>
            {chip.label} <span style={{ fontSize:11,opacity:.7 }}>({chip.count})</span>
          </button>
        ))}
        <div style={{ flex:1 }}/>
        <button onClick={()=>exportXL(true)}
          style={{ padding:'6px 13px',borderRadius:8,border:`1px solid ${C.green}`,background:C.greenS,
            color:C.green,fontWeight:700,fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',gap:4 }}>
          📊 Fiyatlı Excel
        </button>
        <button onClick={()=>exportXL(false)}
          style={{ padding:'6px 13px',borderRadius:8,border:`1px solid ${C.amber}`,background:C.amberS,
            color:C.amber,fontWeight:700,fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',gap:4 }}>
          ⚠️ Fiyatsız Excel
        </button>
      </div>

      {/* Seçim araç çubuğu */}
      {selIds.size > 0 && (
        <div style={{ display:'flex',alignItems:'center',gap:10,padding:'10px 16px',
          background:C.greenS,borderRadius:12,border:`1px solid rgba(21,128,61,.2)` }}>
          <span style={{ fontSize:13,fontWeight:700,color:C.green,flex:1 }}>✅ {selIds.size} ürün seçili</span>
          <button onClick={()=>setBulkModal(true)}
            style={{ padding:'6px 13px',borderRadius:8,border:`1px solid #0891B2`,background:'#fff',
              color:'#0891B2',fontWeight:700,fontSize:11,cursor:'pointer' }}>
            📈 Toplu Güncelle
          </button>
          <button onClick={()=>exportXL(true)}
            style={{ padding:'6px 13px',borderRadius:8,border:`1px solid ${C.green}`,background:'#fff',
              color:C.green,fontWeight:700,fontSize:11,cursor:'pointer' }}>
            📊 Excel
          </button>
          <button onClick={clearSel}
            style={{ padding:'6px 13px',borderRadius:8,border:`1px solid ${C.border2}`,background:'none',
              color:C.txt2,fontWeight:600,fontSize:11,cursor:'pointer' }}>
            Temizle
          </button>
        </div>
      )}

      {/* Kategori akordeonları */}
      {cats.length === 0
        ? <div style={{ padding:32,textAlign:'center',color:C.txt2,background:C.surface,borderRadius:16,border:`1px solid ${C.border}` }}>
            Henüz fiyat kaydı yok.
          </div>
        : cats.map(catName => {
          const { hdr, items } = G[catName];
          const fi = getFilteredItems(items, catName);
          if (q && fi.length === 0 && !catName.toLowerCase().includes(q.toLowerCase())) return null;
          const isOpen = openCats.has(catName) || q.length > 0;
          const missingPrice = fi.filter(p => !p.pesin_fiyat).length;

          return (
            <div key={catName} style={{ background:C.surface,borderRadius:16,border:`1px solid ${C.border}`,overflow:'hidden' }}>

              {/* Bölüm başlığı */}
              <div onClick={()=>toggleCat(catName)}
                style={{ display:'flex',alignItems:'center',gap:12,padding:'13px 20px',
                  cursor:'pointer',background:isOpen?C.page:C.surface,
                  borderBottom:isOpen?`1px solid ${C.border2}`:'none',
                  transition:'background .15s' }}>
                <input type="checkbox" onClick={e=>e.stopPropagation()}
                  checked={fi.length > 0 && fi.every(p => selIds.has(p.id))}
                  onChange={e=>{e.stopPropagation();toggleCatSel(fi);}}
                  style={{ width:15,height:15,cursor:'pointer',accentColor:C.green }} />
                <span style={{ fontSize:16,transition:'transform .2s',
                  transform:isOpen?'rotate(0deg)':'rotate(-90deg)', color:C.txt2 }}>▼</span>
                <span style={{ fontSize:13,fontWeight:800,color:C.txt,flex:1 }}>📂 {catName}</span>
                <span style={{ background:C.tealS,color:C.teal,fontSize:11,fontWeight:700,
                  padding:'3px 9px',borderRadius:10 }}>{fi.length}</span>
                {missingPrice > 0 && (
                  <span style={{ background:C.amberS,color:C.amber,fontSize:10,fontWeight:700,
                    padding:'3px 8px',borderRadius:8 }}>⚠️ {missingPrice} fiyatsız</span>
                )}
                <button onClick={e=>{e.stopPropagation();openAdd(catName);}}
                  style={{ background:C.greenS,border:`1px solid rgba(21,128,61,.2)`,color:C.green,
                    borderRadius:8,padding:'5px 9px',cursor:'pointer',fontSize:11,fontWeight:700,
                    display:'flex',alignItems:'center',gap:3 }}><IcoPlus size={11}/> Ekle</button>
                <button onClick={e=>{e.stopPropagation();openEdit(hdr);}}
                  style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:4,borderRadius:6 }}
                  onMouseEnter={e=>e.currentTarget.style.color=C.teal}
                  onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoEdit size={14}/></button>
              </div>

              {/* Ürün tablosu */}
              {isOpen && (
                <div style={{ overflowX:'auto' }}>
                  <table style={{ width:'100%',borderCollapse:'collapse',fontSize:13 }}>
                    <thead>
                      <tr style={{ background:'#F8FAFB',fontSize:10,fontWeight:700,color:C.txt2,
                        textTransform:'uppercase',letterSpacing:'.08em' }}>
                        <th style={{ padding:'8px 12px',borderBottom:`1px solid ${C.border}`,width:36,textAlign:'center' }}>
                          <input type="checkbox"
                            checked={fi.length > 0 && fi.every(p => selIds.has(p.id))}
                            onChange={()=>toggleCatSel(fi)}
                            style={{ width:14,height:14,cursor:'pointer',accentColor:C.green }} />
                        </th>
                        <th style={{ padding:'8px 18px',textAlign:'left',borderBottom:`1px solid ${C.border}` }}>Ürün Kodu</th>
                        <th style={{ padding:'8px 14px',textAlign:'left',borderBottom:`1px solid ${C.border}` }}>Denye</th>
                        <th style={{ padding:'8px 14px',textAlign:'right',borderBottom:`1px solid ${C.border}` }}>Peşin</th>
                        <th style={{ padding:'8px 14px',textAlign:'right',borderBottom:`1px solid ${C.border}` }}>90 Gün</th>
                        <th style={{ padding:'8px 14px',textAlign:'right',borderBottom:`1px solid ${C.border}` }}>180 Gün</th>
                        <th style={{ padding:'8px 14px',textAlign:'center',borderBottom:`1px solid ${C.border}` }}>Tarih</th>
                        <th style={{ padding:'8px 14px',textAlign:'center',borderBottom:`1px solid ${C.border}` }}>İşlem</th>
                      </tr>
                    </thead>
                    <tbody>
                      {fi.length === 0
                        ? <tr><td colSpan="8" style={{ padding:20,textAlign:'center',color:C.txt2,fontSize:12 }}>Ürün yok.</td></tr>
                        : fi.map((p,pi) => {
                          const isBusy = busy === p.id;
                          const isEP = editPrice && editPrice.id === p.id;
                          const pf = p.pesin_fiyat;
                          const hasPrice = pf > 0;
                          const tm = p.updated_at
                            ? new Date(p.updated_at).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit'})
                            : '';
                          return (
                            <tr key={p.id||pi}
                              style={{ borderBottom:`1px solid ${C.border}`,transition:'background .15s',opacity:isBusy?0.5:1,
                                background:selIds.has(p.id)?'rgba(22,163,74,.06)':'transparent' }}
                              onMouseEnter={e=>{if(!selIds.has(p.id))e.currentTarget.style.background=C.greenS;}}
                              onMouseLeave={e=>{e.currentTarget.style.background=selIds.has(p.id)?'rgba(22,163,74,.06)':'transparent';}}>
                              <td style={{ padding:'11px 12px',textAlign:'center' }}>
                                <input type="checkbox" checked={selIds.has(p.id)} onChange={()=>toggleSel(p.id)}
                                  style={{ width:14,height:14,cursor:'pointer',accentColor:C.green }} />
                              </td>
                              <td style={{ padding:'11px 18px',fontWeight:700,color:C.txt,fontFamily:'monospace' }}>
                                {p.urun_kodu||'—'}
                              </td>
                              <td style={{ padding:'11px 14px' }}>
                                {p.denye
                                  ? <span style={{ background:C.tealS,color:C.teal,padding:'3px 8px',borderRadius:6,fontSize:11,fontWeight:700,fontFamily:'monospace' }}>{p.denye}</span>
                                  : <span style={{ color:C.border2 }}>—</span>}
                              </td>
                              <td style={{ padding:'11px 14px',textAlign:'right' }}>
                                {isEP ? (
                                  <input autoFocus type="number" step="0.01" value={editPrice.val}
                                    onChange={e=>setEditPrice(v=>({...v,val:e.target.value}))}
                                    onBlur={()=>commitEdit(p)}
                                    onKeyDown={e=>{ if(e.key==='Enter')commitEdit(p); if(e.key==='Escape')setEditPrice(null); }}
                                    style={{ width:72,padding:'3px 7px',border:`2px solid ${C.green}`,borderRadius:6,
                                      fontSize:13,fontFamily:'monospace',fontWeight:700,color:C.green,outline:'none',textAlign:'right' }} />
                                ) : (
                                  <span onClick={()=>startEdit(p)} title="Tıkla düzenle"
                                    style={{ cursor:'text',fontFamily:'monospace',fontWeight:900,fontSize:14,
                                      color:hasPrice?C.green:'#CBD5E1',
                                      borderBottom:`1px dashed ${hasPrice?C.green:'#CBD5E1'}` }}>
                                    {hasPrice ? `${pf.toFixed(2)} $` : '—'}
                                  </span>
                                )}
                              </td>
                              <td style={{ padding:'11px 14px',textAlign:'right',fontFamily:'monospace',fontSize:13,
                                color:hasPrice?C.txt2:'#CBD5E1',fontWeight:hasPrice?600:400 }}>
                                {hasPrice ? `${(pf+0.10).toFixed(2)} $` : '—'}
                              </td>
                              <td style={{ padding:'11px 14px',textAlign:'right',fontFamily:'monospace',fontSize:13,
                                color:hasPrice?C.txt2:'#CBD5E1',fontWeight:hasPrice?600:400 }}>
                                {hasPrice ? `${(pf+0.20).toFixed(2)} $` : '—'}
                              </td>
                              <td style={{ padding:'11px 14px',textAlign:'center',fontSize:11,
                                color:C.txt2,fontFamily:'monospace' }}>
                                {tm || '—'}
                              </td>
                              <td style={{ padding:'11px 14px',textAlign:'center' }}>
                                <div style={{ display:'flex',justifyContent:'center',gap:4 }}>
                                  <button onClick={()=>openEdit(p)} disabled={isBusy}
                                    style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:4,borderRadius:6 }}
                                    onMouseEnter={e=>e.currentTarget.style.color=C.teal}
                                    onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoEdit size={13}/></button>
                                  <button onClick={()=>delItem(p)} disabled={isBusy}
                                    style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:4,borderRadius:6 }}
                                    onMouseEnter={e=>e.currentTarget.style.color=C.red}
                                    onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoTrash size={13}/></button>
                                </div>
                              </td>
                            </tr>
                          );
                        })
                      }
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

// ── MALİYET (TAM FONKSİYONEL) ────────────────────────────────────────────
function CostView({ data, onRefresh }) {
  const DEF = { iplik:'', denye:75, hiz:25, ig:256, hmd:0.964, fire:3,
    person:10, maas:25000, makine:4, kw:180, kwtuk:2.8,
    amort:0.005, bobin:0.01, paket:0.005, kar:20 };

  const [inp, setInp]   = React.useState(DEF);
  const [res, setRes]   = React.useState(null);
  const [saving, setSaving] = React.useState(false);
  const [q, setQ]       = React.useState('');
  const [sort, setSort] = React.useState('new');
  const [busy, setBusy] = React.useState(null);
  const [tab, setTab]   = React.useState('calc'); // 'calc' | 'hist' | 'hamm'

  // Hammadde (localStorage)
  const loadHamm = () => { try { return JSON.parse(localStorage.getItem('yanteks_hamm')||'[]'); } catch { return []; } };
  const [hammadde, setHammadde] = React.useState(loadHamm);
  const [hammModal, setHammModal] = React.useState(null); // null | 'new' | item
  const emptyHamm = { ad:'', tedarikci:'', birim_fiyat:'', stok:'', birim:'kg' };
  const [hammForm, setHammForm] = React.useState(emptyHamm);
  const saveHamm = (list) => { localStorage.setItem('yanteks_hamm', JSON.stringify(list)); setHammadde(list); };
  const openHammNew = () => { setHammForm(emptyHamm); setHammModal('new'); };
  const openHammEdit = (h) => { setHammForm({ ad:h.ad||'', tedarikci:h.tedarikci||'', birim_fiyat:String(h.birim_fiyat||''), stok:String(h.stok||''), birim:h.birim||'kg' }); setHammModal(h); };
  const doHammSave = () => {
    if (!hammForm.ad.trim()) return;
    const item = { ...hammForm, birim_fiyat: parseFloat(hammForm.birim_fiyat)||0, stok: parseFloat(hammForm.stok)||0, id: hammModal==='new' ? Date.now() : hammModal.id };
    if (hammModal === 'new') saveHamm([...hammadde, item]);
    else saveHamm(hammadde.map(h => h.id === item.id ? item : h));
    setHammModal(null);
  };
  const delHamm = (h) => { if (!window.confirm(`"${h.ad}" silinsin mi?`)) return; saveHamm(hammadde.filter(x => x.id !== h.id)); };
  const exportHammXL = async () => {
    if (!hammadde.length) return;
    const wb = new ExcelJS.Workbook(); wb.creator = 'Yanteks Pro';
    const sh = wb.addWorksheet('Hammadde');
    const hr = sh.addRow(['Hammadde Adı','Tedarikçi','Birim Fiyat ($)','Stok','Birim']);
    hr.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0891B2'}}; c.font={color:{argb:'FFFFFFFF'},bold:true}; });
    sh.columns = [{width:28},{width:22},{width:16},{width:14},{width:10}];
    hammadde.forEach(h => sh.addRow([h.ad,h.tedarikci||'',h.birim_fiyat,h.stok,h.birim||'kg']));
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'Hammadde_' + new Date().toLocaleDateString('tr-TR').replace(/\./g,'-') + '.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  };

  const f4 = (v) => parseFloat(v.toFixed(4));

  const hesapla = React.useCallback((vals) => {
    const { denye, hiz, ig, hmd, fire, person, maas, makine, kw, kwtuk, amort, bobin, paket, kar } = vals;
    const gunluk   = hiz * 60 * 24 * (denye / 9000) * ig / 1000;
    const aylik    = gunluk * 28;
    const hammadde = hmd * (1 + fire / 100);
    const iscilik  = aylik > 0 ? (person * maas * 1.1 / makine) / aylik : 0;
    const enerji   = gunluk > 0 ? (kwtuk * 24 / gunluk) * kw : 0;
    const diger    = amort + bobin + paket;
    const net      = hammadde + iscilik + enerji + diger;
    const satis    = net * (1 + kar / 100);
    return { gunluk: f4(gunluk), aylik: f4(aylik), hammadde: f4(hammadde),
      iscilik: f4(iscilik), enerji: f4(enerji), diger: f4(diger), net: f4(net), satis: f4(satis) };
  }, []);

  React.useEffect(() => { setRes(hesapla(inp)); }, [inp]);

  const setV = (key, val) => setInp(prev => ({ ...prev, [key]: parseFloat(val)||0 }));

  const saveToHistory = async () => {
    if (!res) return;
    setSaving(true);
    await db.from('erp_gecmis').insert([{
      tarih: new Date().toISOString(), iplik: inp.iplik||'—',
      denye: inp.denye, hiz: inp.hiz, gunluk: res.gunluk,
      iscilik: res.iscilik, enerji: res.enerji,
      net: res.net, satis: res.satis, hammadde: res.hammadde, kar: inp.kar
    }]);
    setSaving(false);
    await onRefresh();
    setTab('hist');
  };

  const delRow = async (row) => {
    if (!window.confirm(`"${row.iplik||'Kayıt'}" silinsin mi?`)) return;
    setBusy(row.id);
    await db.from('erp_gecmis').delete().eq('id', row.id);
    await onRefresh(); setBusy(null);
  };

  const filtered = (data||[])
    .filter(r => !q || (r.iplik||'').toLowerCase().includes(q.toLowerCase()))
    .sort((a,b) => sort === 'new'
      ? new Date(b.tarih||0) - new Date(a.tarih||0)
      : new Date(a.tarih||0) - new Date(b.tarih||0));

  const pctBar = (val, total) => total > 0 ? Math.round(val / total * 100) : 0;

  const NumInput = ({ label, k, unit, step=0.001, min=0 }) => (
    <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
      <label style={{ fontSize:10, fontWeight:700, color:C.txt2, textTransform:'uppercase', letterSpacing:'.07em' }}>{label}</label>
      <div style={{ display:'flex', alignItems:'center', gap:4 }}>
        <input type="number" step={step} min={min} value={inp[k]}
          onChange={e=>setV(k, e.target.value)}
          style={{ width:'100%', padding:'8px 10px', border:`1px solid ${C.border2}`, borderRadius:8,
            fontSize:13, fontFamily:'monospace', fontWeight:700, color:C.txt, outline:'none',
            background:C.surface }} />
        {unit && <span style={{ fontSize:11, color:C.txt2, whiteSpace:'nowrap', flexShrink:0 }}>{unit}</span>}
      </div>
    </div>
  );

  const Section = ({ title, children }) => (
    <div style={{ background:C.page, borderRadius:12, padding:14 }}>
      <p style={{ fontSize:10, fontWeight:800, color:C.txt2, textTransform:'uppercase', letterSpacing:'.1em', marginBottom:10 }}>{title}</p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))', gap:10 }}>
        {children}
      </div>
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>

      {/* Başlık + Sekme */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:900, color:C.txt, letterSpacing:'-.02em' }}>İplik Maliyet Hesaplama</h2>
          <p style={{ fontSize:12, color:C.txt2, marginTop:2 }}>Hammadde, fire ve işletme giderleri dahil üretim maliyeti.</p>
        </div>
        <div style={{ display:'flex', gap:6 }}>
          {[['calc','🧮 Hesap'],['hist','📋 Geçmiş'],['hamm','🏭 Hammadde']].map(([id,lbl])=>(
            <button key={id} onClick={()=>setTab(id)}
              style={{ padding:'8px 16px', borderRadius:10, border:`2px solid ${tab===id?C.teal:C.border}`,
                background:tab===id?C.tealS:'transparent', color:tab===id?C.teal:C.txt2,
                fontSize:13, fontWeight:700, cursor:'pointer' }}>{lbl}</button>
          ))}
        </div>
      </div>

      {tab === 'calc' && res && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>

          {/* İplik adı */}
          <div>
            <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>İplik Adı / Kodu</label>
            <input value={inp.iplik} onChange={e=>setInp(p=>({...p,iplik:e.target.value}))}
              placeholder="Örn: Ring 75/1 Polyester"
              style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,
                fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt,background:C.surface }} />
          </div>

          {/* Giriş grupları */}
          <Section title="🏭 Üretim Parametreleri">
            <NumInput label="Denye" k="denye" step={1} />
            <NumInput label="Hız (m/dk)" k="hiz" step={0.1} />
            <NumInput label="İğ Sayısı" k="ig" step={1} />
          </Section>

          <Section title="🧵 Hammadde">
            <NumInput label="HMD Fiyatı ($/kg)" k="hmd" step={0.001} />
            <NumInput label="Fire (%)" k="fire" step={0.1} />
          </Section>

          <Section title="👷 İşletme Giderleri">
            <NumInput label="Çalışan" k="person" step={1} />
            <NumInput label="Maaş (₺)" k="maas" step={100} />
