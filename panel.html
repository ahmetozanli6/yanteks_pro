            <NumInput label="Makine Sayısı" k="makine" step={1} />
            <NumInput label="kW" k="kw" step={1} />
            <NumInput label="kWh Fiyatı (₺)" k="kwtuk" step={0.1} />
            <NumInput label="Amortisman ($/kg)" k="amort" step={0.001} />
            <NumInput label="Bobin ($/kg)" k="bobin" step={0.001} />
            <NumInput label="Paketleme ($/kg)" k="paket" step={0.001} />
          </Section>

          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <label style={{ fontSize:10,fontWeight:700,color:C.txt2,textTransform:'uppercase',letterSpacing:'.08em',whiteSpace:'nowrap' }}>Kâr Marjı (%)</label>
            <input type="number" step={0.5} min={0} value={inp.kar} onChange={e=>setV('kar',e.target.value)}
              style={{ width:90,padding:'8px 10px',border:`1px solid ${C.border2}`,borderRadius:8,
                fontSize:13,fontFamily:'monospace',fontWeight:700,color:C.txt,outline:'none',background:C.surface }} />
          </div>

          {/* Sonuçlar */}
          <div style={{ background:'linear-gradient(135deg,#0F172A,#1E2D3D)', borderRadius:18, padding:24, color:'#fff' }}>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:20 }}>
              <div style={{ textAlign:'center' }}>
                <p style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,.5)', textTransform:'uppercase', letterSpacing:'.1em', marginBottom:6 }}>Net Maliyet</p>
                <p style={{ fontSize:42, fontWeight:900, color:'#38BDF8', letterSpacing:'-.03em', fontFamily:'monospace' }}>${res.net.toFixed(4)}</p>
                <p style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginTop:4 }}>per kg</p>
              </div>
              <div style={{ textAlign:'center' }}>
                <p style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,.5)', textTransform:'uppercase', letterSpacing:'.1em', marginBottom:6 }}>Satış Fiyatı</p>
                <p style={{ fontSize:42, fontWeight:900, color:'#4ADE80', letterSpacing:'-.03em', fontFamily:'monospace' }}>${res.satis.toFixed(4)}</p>
                <p style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginTop:4 }}>%{inp.kar} kâr dahil</p>
              </div>
            </div>

            {/* Maliyet dağılımı */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10, marginBottom:16 }}>
              {[
                ['🧵 Hammadde', res.hammadde, '#38BDF8'],
                ['👷 İşçilik',  res.iscilik,  '#A78BFA'],
                ['⚡ Enerji',   res.enerji,   '#FCD34D'],
                ['📦 Diğer',   res.diger,    '#6EE7B7'],
              ].map(([lbl, val, clr]) => (
                <div key={lbl} style={{ background:'rgba(255,255,255,.06)', borderRadius:10, padding:'10px 14px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                    <span style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,.7)' }}>{lbl}</span>
                    <span style={{ fontSize:12, fontWeight:900, color:clr, fontFamily:'monospace' }}>${val.toFixed(4)}</span>
                  </div>
                  <div style={{ height:4, background:'rgba(255,255,255,.1)', borderRadius:2 }}>
                    <div style={{ height:'100%', borderRadius:2, background:clr, width:`${pctBar(val,res.net)}%`, transition:'width .4s' }} />
                  </div>
                  <span style={{ fontSize:10, color:'rgba(255,255,255,.4)', marginTop:3, display:'block' }}>%{pctBar(val,res.net)}</span>
                </div>
              ))}
            </div>

            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, paddingTop:14, borderTop:'1px solid rgba(255,255,255,.1)' }}>
              <div style={{ display:'flex', gap:16 }}>
                <div><span style={{ fontSize:10, color:'rgba(255,255,255,.45)', display:'block' }}>Günlük Üretim</span>
                  <span style={{ fontFamily:'monospace', fontWeight:800, color:'#fff' }}>{res.gunluk.toFixed(2)} kg</span></div>
                <div><span style={{ fontSize:10, color:'rgba(255,255,255,.45)', display:'block' }}>Aylık Üretim</span>
                  <span style={{ fontFamily:'monospace', fontWeight:800, color:'#fff' }}>{Math.round(res.aylik).toLocaleString('tr-TR')} kg</span></div>
              </div>
              <button onClick={saveToHistory} disabled={saving}
                style={{ background:'linear-gradient(135deg,#0672A0,#0891B2)', color:'#fff', border:'none',
                  borderRadius:10, padding:'10px 20px', fontSize:13, fontWeight:700, cursor:'pointer',
                  boxShadow:'0 4px 12px rgba(8,145,178,.4)', opacity:saving?0.6:1 }}>
                {saving ? '⏳ Kaydediliyor…' : '💾 Geçmişe Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {tab === 'hist' && (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>

          {/* Arama + sıralama */}
          <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
            <div style={{ position:'relative', flex:1, minWidth:180 }}>
              <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2, display:'flex' }}><IcoSearch size={14}/></span>
              <input placeholder="İplik adı ara…" value={q} onChange={e=>setQ(e.target.value)}
                style={{ width:'100%', paddingLeft:34, paddingRight:12, paddingTop:9, paddingBottom:9,
                  border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13, fontFamily:'Inter,sans-serif',
                  outline:'none', color:C.txt, background:C.surface }} />
            </div>
            <select value={sort} onChange={e=>setSort(e.target.value)}
              style={{ padding:'9px 12px', border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13,
                fontFamily:'Inter,sans-serif', outline:'none', color:C.txt, background:C.surface, cursor:'pointer' }}>
              <option value="new">⏱ En Yeni</option>
              <option value="old">📅 En Eski</option>
            </select>
          </div>

          {/* Geçmiş tablosu */}
          <div style={{ background:C.surface, borderRadius:16, border:`1px solid ${C.border}`, overflow:'hidden' }}>
            <div style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12, whiteSpace:'nowrap' }}>
                <thead>
                  <tr style={{ background:C.page, fontSize:10, fontWeight:700, color:C.txt2,
                    textTransform:'uppercase', letterSpacing:'.08em' }}>
                    {['İplik','Denye','Hız','Günlük (kg)','Hammadde','İşçilik','Enerji','Net ($)','Satış ($)','Kâr %','Tarih','Sil'].map((h,i)=>(
                      <th key={i} style={{ padding:'10px 14px', textAlign:i===11?'center':'left', borderBottom:`1px solid ${C.border2}` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0
                    ? <tr><td colSpan="12" style={{ padding:28, textAlign:'center', color:C.txt2 }}>
                        {q ? 'Arama sonucu yok.' : 'Henüz kayıt yok.'}
                      </td></tr>
                    : filtered.map((r,i) => {
                      const isBusy = busy === r.id;
                      return (
                        <tr key={r.id||i} style={{ borderBottom:`1px solid ${C.border}`, transition:'background .15s', opacity:isBusy?0.5:1 }}
                          onMouseEnter={e=>e.currentTarget.style.background=C.page}
                          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                          <td style={{ padding:'10px 14px', fontWeight:700, color:C.txt }}>{r.iplik||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2 }}>{r.denye||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2 }}>{r.hiz||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2 }}>{r.gunluk?.toFixed(2)||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2 }}>${r.hammadde?.toFixed(4)||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2 }}>${r.iscilik?.toFixed(4)||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2 }}>${r.enerji?.toFixed(4)||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', fontWeight:900, color:C.teal }}>${r.net?.toFixed(4)||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', fontWeight:900, color:C.green }}>${r.satis?.toFixed(4)||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.amber }}>%{r.kar||'—'}</td>
                          <td style={{ padding:'10px 14px', fontFamily:'monospace', color:C.txt2, fontSize:11 }}>{fmtDate(r.tarih)}</td>
                          <td style={{ padding:'10px 14px', textAlign:'center' }}>
                            <button onClick={()=>delRow(r)} disabled={isBusy}
                              style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:4,borderRadius:6 }}
                              onMouseEnter={e=>e.currentTarget.style.color=C.red}
                              onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoTrash size={13}/></button>
                          </td>
                        </tr>
                      );
                    })
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {tab === 'hamm' && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>

          {/* Hammadde Modal */}
          {hammModal !== null && (
            <div onClick={e=>e.target===e.currentTarget&&setHammModal(null)}
              style={{ position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:50,
                display:'flex',alignItems:'center',justifyContent:'center',padding:16 }}>
              <div style={{ background:'#fff',borderRadius:20,padding:24,width:'100%',maxWidth:380,
                boxShadow:'0 20px 60px rgba(0,0,0,.3)' }}>
                <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16 }}>
                  <h3 style={{ fontSize:17,fontWeight:800,color:C.txt }}>{hammModal==='new'?'➕ Yeni Hammadde':'✏️ Düzenle'}</h3>
                  <button onClick={()=>setHammModal(null)} style={{ background:'none',border:'none',cursor:'pointer',color:C.txt2,display:'flex' }}><IcoX size={20}/></button>
                </div>
                {[['Hammadde Adı *','ad','text'],['Tedarikçi','tedarikci','text'],['Birim Fiyat ($)','birim_fiyat','number'],['Stok Miktarı','stok','number']].map(([lbl,key,type])=>(
                  <div key={key} style={{ marginBottom:12 }}>
                    <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>{lbl}</label>
                    <input type={type} step="0.01" value={hammForm[key]} onChange={e=>setHammForm(f=>({...f,[key]:e.target.value}))}
                      style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:type==='number'?'monospace':'Inter,sans-serif',outline:'none',color:C.txt }} />
                  </div>
                ))}
                <div style={{ marginBottom:18 }}>
                  <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Birim</label>
                  <select value={hammForm.birim} onChange={e=>setHammForm(f=>({...f,birim:e.target.value}))}
                    style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,color:C.txt,background:'#fff',cursor:'pointer',outline:'none' }}>
                    {['kg','ton','adet','balya'].map(b=><option key={b}>{b}</option>)}
                  </select>
                </div>
                <div style={{ display:'flex',gap:10 }}>
                  <button onClick={()=>setHammModal(null)} style={{ flex:1,padding:10,border:`1px solid ${C.border2}`,borderRadius:10,cursor:'pointer',background:'none',fontSize:13,fontWeight:600,color:C.txt2 }}>İptal</button>
                  <button onClick={doHammSave} disabled={!hammForm.ad.trim()}
                    style={{ flex:2,padding:10,border:'none',borderRadius:10,cursor:'pointer',
                      background:'linear-gradient(135deg,#0672A0,#0891B2)',color:'#fff',fontSize:13,fontWeight:700,
                      opacity:!hammForm.ad.trim()?0.5:1 }}>
                    💾 Kaydet
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Hammadde başlık */}
          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10 }}>
            <div>
              <p style={{ fontSize:13,color:C.txt2 }}>{hammadde.length} hammadde · Veriler bu cihazda saklanır.</p>
            </div>
            <div style={{ display:'flex',gap:8 }}>
              <button onClick={exportHammXL} disabled={!hammadde.length}
                style={{ background:'none',border:`1px solid ${C.green}`,borderRadius:10,padding:'8px 14px',
                  fontSize:12,fontWeight:700,color:C.green,cursor:'pointer' }}>📊 Excel</button>
              <button onClick={openHammNew}
                style={{ background:'linear-gradient(135deg,#0672A0,#0891B2)',color:'#fff',border:'none',
                  borderRadius:10,padding:'8px 16px',fontSize:13,fontWeight:700,cursor:'pointer',
                  display:'flex',alignItems:'center',gap:5 }}><IcoPlus size={16}/> Hammadde Ekle</button>
            </div>
          </div>

          {/* Hammadde tablosu */}
          <div style={{ background:C.surface,borderRadius:16,border:`1px solid ${C.border}`,overflow:'hidden' }}>
            {hammadde.length === 0
              ? <div style={{ padding:40,textAlign:'center',color:C.txt2 }}>Henüz hammadde eklenmemiş.</div>
              : <div style={{ overflowX:'auto' }}>
                <table style={{ width:'100%',borderCollapse:'collapse',fontSize:13 }}>
                  <thead>
                    <tr style={{ background:C.page,fontSize:10,fontWeight:700,color:C.txt2,textTransform:'uppercase',letterSpacing:'.08em' }}>
                      {['Hammadde','Tedarikçi','Birim Fiyat','Stok','Birim','İşlem'].map((h,i)=>(
                        <th key={i} style={{ padding:'10px 14px',textAlign:i===5?'center':'left',borderBottom:`1px solid ${C.border2}` }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {hammadde.map((h,i)=>(
                      <tr key={h.id||i} style={{ borderBottom:`1px solid ${C.border}`,transition:'background .15s' }}
                        onMouseEnter={e=>e.currentTarget.style.background=C.page}
                        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <td style={{ padding:'11px 14px',fontWeight:700,color:C.txt }}>{h.ad}</td>
                        <td style={{ padding:'11px 14px',color:C.txt2 }}>{h.tedarikci||'—'}</td>
                        <td style={{ padding:'11px 14px',fontFamily:'monospace',fontWeight:700,color:C.green }}>
                          {h.birim_fiyat > 0 ? `$${parseFloat(h.birim_fiyat).toFixed(2)}` : '—'}
                        </td>
                        <td style={{ padding:'11px 14px',fontFamily:'monospace',color:C.txt2 }}>
                          {h.stok > 0 ? parseFloat(h.stok).toLocaleString('tr-TR') : '—'}
                        </td>
                        <td style={{ padding:'11px 14px',color:C.txt2 }}>{h.birim||'kg'}</td>
                        <td style={{ padding:'11px 14px',textAlign:'center' }}>
                          <div style={{ display:'flex',justifyContent:'center',gap:4 }}>
                            <button onClick={()=>openHammEdit(h)}
                              style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:4,borderRadius:6 }}
                              onMouseEnter={e=>e.currentTarget.style.color=C.teal}
                              onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoEdit size={13}/></button>
                            <button onClick={()=>delHamm(h)}
                              style={{ background:'none',border:'none',cursor:'pointer',color:C.border2,padding:4,borderRadius:6 }}
                              onMouseEnter={e=>e.currentTarget.style.color=C.red}
                              onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoTrash size={13}/></button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            }
          </div>

          {/* Hammadde özet */}
          {hammadde.filter(h=>h.birim_fiyat>0).length > 0 && (
            <div style={{ display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10 }}>
              {[
                ['📦 Toplam Kalem', hammadde.length, C.teal, C.tealS],
                ['💰 Ort. Fiyat', '$'+(hammadde.filter(h=>h.birim_fiyat>0).reduce((s,h)=>s+parseFloat(h.birim_fiyat),0)/Math.max(1,hammadde.filter(h=>h.birim_fiyat>0).length)).toFixed(2), C.green, C.greenS],
                ['📊 Stok Var', hammadde.filter(h=>h.stok>0).length, C.amber, C.amberS],
              ].map(([lbl,val,col,bg])=>(
                <div key={lbl} style={{ background:bg,borderRadius:12,padding:'12px 16px',border:`1px solid ${col}30` }}>
                  <p style={{ fontSize:11,fontWeight:700,color:col,marginBottom:4 }}>{lbl}</p>
                  <p style={{ fontSize:22,fontWeight:900,color:col,fontFamily:'monospace' }}>{val}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── TEKLİFLER (TAM FONKSİYONEL) ─────────────────────────────────────────
function OffersView({ data, customers, onRefresh }) {
  const [q, setQ]       = React.useState('');
  const [sf, setSf]     = React.useState('all');
  const [busy, setBusy] = React.useState(null);
  const [modal, setModal]   = React.useState(null); // null | 'new' | item
  const [saving, setSaving] = React.useState(false);
  const [openFirms, setOpenFirms] = React.useState(new Set());

  const [impModal, setImpModal] = React.useState(false);
  const [impFirma, setImpFirma] = React.useState('');
  const [impDate, setImpDate]   = React.useState(new Date().toISOString().slice(0,10));
  const [impDurum, setImpDurum] = React.useState('Teklif Verildi');
  const [impRows, setImpRows]   = React.useState([]);
  const [impSaving, setImpSaving] = React.useState(false);

  const previewImport = async (file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(buf);
      const sh = wb.worksheets[0];
      const rows = [];
      sh.eachRow((row, rn) => {
        if (rn < 3) return;
        const urun  = String(row.getCell(1).value||'').trim();
        const fiyat = parseFloat(row.getCell(2).value)||null;
        if (urun) rows.push({ urun, fiyat });
      });
      setImpRows(rows);
    } catch(e) { alert('Excel okunamadı: ' + e.message); }
  };

  const doImport = async () => {
    if (!impFirma.trim() || !impRows.length) return;
    setImpSaving(true);
    const now = new Date().toISOString();
    const payload = impRows.map(r => ({
      firma_adi: impFirma.trim().toUpperCase(),
      urun: r.urun, fiyat: r.fiyat,
      durum: impDurum, teklif_tarihi: impDate||null,
      updated_at: now, created_at: now
    }));
    await db.from('fiyat_teklifleri').insert(payload);
    setImpSaving(false); setImpModal(false);
    setImpFirma(''); setImpRows([]);
    await onRefresh();
  };

  const emptyForm = { firma_adi:'', urun:'', fiyat:'', durum:'Teklif Verildi',
    teklif_tarihi: new Date().toISOString().slice(0,10), gecerlilik_tarihi:'', notlar:'' };
  const [form, setForm] = React.useState(emptyForm);
  const [multiRows, setMultiRows] = React.useState([{ urun:'', fiyat:'' }]);

  const addMultiRow = () => setMultiRows(r => [...r, { urun:'', fiyat:'' }]);
  const removeMultiRow = (i) => setMultiRows(r => r.filter((_,j) => j !== i));
  const updateMultiRow = (i, field, val) => setMultiRows(r => r.map((row,j) => j===i ? {...row,[field]:val} : row));

  const DURUMLAR = ['Teklif Verildi', 'Onaylandı', 'Onaylanmadı'];
  const DCLR = {
    'Teklif Verildi': [C.tealS, C.teal, 'rgba(8,145,178,.2)'],
    'Onaylandı':      [C.greenS, C.green, 'rgba(21,128,61,.2)'],
    'Onaylanmadı':    [C.redS, C.red, 'rgba(153,27,27,.2)'],
  };

  const daysDiff = (d) => {
    if (!d) return null;
    return Math.floor((new Date(d) - Date.now()) / 86400000);
  };

  const filtered = data.filter(t => {
    if (sf !== 'all' && t.durum !== sf) return false;
    if (q) {
      const Q = q.toLowerCase();
      if (!(t.firma_adi||'').toLowerCase().includes(Q) &&
          !(t.urun||'').toLowerCase().includes(Q) &&
          !(t.notlar||'').toLowerCase().includes(Q)) return false;
    }
    return true;
  });

  // Firmaya göre grupla
  const firmaMap = new Map();
  filtered.forEach(t => {
    if (!firmaMap.has(t.firma_adi)) firmaMap.set(t.firma_adi, []);
    firmaMap.get(t.firma_adi).push(t);
  });
  const sortedFirms = [...firmaMap.entries()].sort((a,b) => {
    const da = a[1][0]?.teklif_tarihi || a[1][0]?.created_at || '';
    const db2 = b[1][0]?.teklif_tarihi || b[1][0]?.created_at || '';
    return db2.localeCompare(da);
  });

  const toggleFirm = (name) => {
    setOpenFirms(prev => {
      const n = new Set(prev);
      n.has(name) ? n.delete(name) : n.add(name);
      return n;
    });
  };

  const setDurum = async (t, durum) => {
    setBusy(t.id);
    await db.from('fiyat_teklifleri').update({ durum, updated_at: new Date().toISOString() }).eq('id', t.id);
    await onRefresh(); setBusy(null);
  };

  const delItem = async (t) => {
    if (!window.confirm(`"${t.urun||'Teklif'}" silinsin mi?`)) return;
    setBusy(t.id);
    await db.from('fiyat_teklifleri').delete().eq('id', t.id);
    await onRefresh(); setBusy(null);
  };

  const openAdd = (firmaAdi = '') => {
    setForm({ ...emptyForm, firma_adi: firmaAdi });
    setMultiRows([{ urun:'', fiyat:'' }]);
    setModal('new');
  };
  const openEdit = (t) => {
    setForm({ firma_adi:t.firma_adi||'', urun:t.urun||'', fiyat:String(t.fiyat||''),
      durum:t.durum||'Teklif Verildi', teklif_tarihi:t.teklif_tarihi||'',
      gecerlilik_tarihi:t.gecerlilik_tarihi||'', notlar:t.notlar||'' });
    setModal(t);
  };

  const save = async () => {
    if (!form.firma_adi.trim()) return;
    setSaving(true);
    const now = new Date().toISOString();
    const base = { firma_adi: form.firma_adi.trim().toUpperCase(), durum: form.durum,
      teklif_tarihi: form.teklif_tarihi||null, gecerlilik_tarihi: form.gecerlilik_tarihi||null,
      notlar: form.notlar.trim()||null, updated_at: now };
    if (modal === 'new') {
      const validRows = multiRows.filter(r => r.urun.trim());
      if (!validRows.length) { setSaving(false); return; }
      const payload = validRows.map(r => ({ ...base, urun: r.urun.trim(),
        fiyat: parseFloat(r.fiyat)||null, created_at: now }));
      await db.from('fiyat_teklifleri').insert(payload);
    } else {
      if (!form.urun.trim()) { setSaving(false); return; }
      await db.from('fiyat_teklifleri').update({ ...base, urun: form.urun.trim(),
        fiyat: parseFloat(form.fiyat)||null }).eq('id', modal.id);
    }
    setSaving(false); setModal(null);
    await onRefresh();
  };

  const exportFirmaXL = async (firmaAdi, teklifler) => {
    const dt = new Date().toLocaleDateString('tr-TR');
    const wb = new ExcelJS.Workbook(); wb.creator = 'Yanteks Pro';
    const sh = wb.addWorksheet('Teklif');
    sh.mergeCells(1,1,1,5);
    const tc = sh.getCell('A1');
    tc.value = (firmaAdi || 'TÜM FİRMALAR') + ' — FİYAT TEKLİFLERİ (' + dt + ')';
    tc.font = { bold:true, size:13, color:{ argb:'FFFFFFFF' } };
    tc.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0672A0' } };
    tc.alignment = { horizontal:'center', vertical:'middle' };
    sh.getRow(1).height = 28;
    const hr = sh.addRow(['Firma','Ürün / Kalite','Fiyat ($)','Durum','Teklif Tarihi']);
    hr.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0891B2'}}; c.font={color:{argb:'FFFFFFFF'},bold:true}; c.alignment={horizontal:'center'}; });
    sh.columns = [{width:30},{width:35},{width:14},{width:18},{width:16}];
    const rows = teklifler || filtered;
    rows.forEach(t => {
      const r = sh.addRow([t.firma_adi||'',t.urun||'',t.fiyat||'',t.durum||'',t.teklif_tarihi||'']);
      if (t.durum === 'Onaylandi') r.getCell(4).font = { color:{argb:'FF15803D'},bold:true };
      if (t.durum === 'Onaylanmadi') r.getCell(4).font = { color:{argb:'FF991B1B'},bold:true };
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Teklif_' + (firmaAdi||'Tum').replace(/\s+/g,'_') + '_' + dt.replace(/\./g,'-') + '.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  };

  // KPI'lar
  const total  = data.length;
  const onay   = data.filter(t => t.durum === 'Onaylandı').length;
  const teklif = data.filter(t => t.durum === 'Teklif Verildi').length;
  const ret    = data.filter(t => t.durum === 'Onaylanmadı').length;
  const onayTutar = data.filter(t => t.durum === 'Onaylandı' && t.fiyat)
    .reduce((s,t) => s + parseFloat(t.fiyat||0), 0);

  const firmalar = [...new Set(customers.map(c => c.firma_adi).filter(Boolean))].sort();

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>

      {/* Modal */}
      {modal !== null && (
        <div onClick={e=>e.target===e.currentTarget&&setModal(null)}
          style={{ position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:50,
            display:'flex',alignItems:'center',justifyContent:'center',padding:16 }}>
          <div style={{ background:'#fff',borderRadius:20,padding:24,width:'100%',maxWidth:440,
            boxShadow:'0 20px 60px rgba(0,0,0,.3)', maxHeight:'90vh', overflowY:'auto' }}>
            <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18 }}>
              <h3 style={{ fontSize:17,fontWeight:800,color:C.txt }}>{modal==='new'?'➕ Yeni Teklif':'✏️ Teklifi Düzenle'}</h3>
              <button onClick={()=>setModal(null)} style={{ background:'none',border:'none',cursor:'pointer',color:C.txt2,display:'flex' }}><IcoX size={20}/></button>
            </div>

            {/* Firma */}
            <div style={{ marginBottom:12 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Firma Adı *</label>
              <FirmaInput value={form.firma_adi} onChange={v=>setForm(f=>({...f,firma_adi:v}))}
                firmalar={firmalar}
                style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt }} />
            </div>

            {/* Ürün + Fiyat — multi-row when new, single when edit */}
            {modal === 'new' ? (
              <div style={{ marginBottom:12 }}>
                <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6 }}>
                  <label style={{ fontSize:10,fontWeight:700,color:C.txt2,textTransform:'uppercase',letterSpacing:'.08em' }}>Ürün / Kalite & Fiyat</label>
                  <button onClick={addMultiRow}
                    style={{ fontSize:11,fontWeight:700,color:C.teal,background:C.tealS,border:`1px solid rgba(8,145,178,.2)`,
                      borderRadius:7,padding:'3px 9px',cursor:'pointer',display:'flex',alignItems:'center',gap:3 }}>
                    <IcoPlus size={11}/> Satır Ekle
                  </button>
                </div>
                {multiRows.map((row, i) => (
                  <div key={i} style={{ display:'grid',gridTemplateColumns:'1fr 90px 28px',gap:6,marginBottom:6 }}>
                    <input value={row.urun} onChange={e=>updateMultiRow(i,'urun',e.target.value)}
                      placeholder={`Ürün ${i+1}…`}
                      style={{ padding:'8px 10px',border:`1px solid ${C.border2}`,borderRadius:8,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt }} />
                    <input type="number" step="0.01" value={row.fiyat} onChange={e=>updateMultiRow(i,'fiyat',e.target.value)}
                      placeholder="$ —"
                      style={{ padding:'8px 10px',border:`1px solid ${C.border2}`,borderRadius:8,fontSize:13,fontFamily:'monospace',outline:'none',color:C.txt,textAlign:'right' }} />
                    {multiRows.length > 1
                      ? <button onClick={()=>removeMultiRow(i)}
                          style={{ background:'none',border:`1px solid ${C.border2}`,borderRadius:8,cursor:'pointer',color:C.red,display:'flex',alignItems:'center',justifyContent:'center' }}>
                          <IcoX size={14}/>
                        </button>
                      : <div/>}
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ marginBottom:12 }}>
                <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Ürün / Kalite *</label>
                <input value={form.urun} onChange={e=>setForm(f=>({...f,urun:e.target.value}))}
                  style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt }} />
              </div>
            )}

            {/* Fiyat (edit only) + Durum */}
            <div style={{ display:'grid', gridTemplateColumns: modal!=='new'?'1fr 1fr':'1fr', gap:10, marginBottom:12 }}>
              {modal !== 'new' && (
                <div>
                  <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Fiyat ($)</label>
                  <input type="number" step="0.01" value={form.fiyat} onChange={e=>setForm(f=>({...f,fiyat:e.target.value}))}
                    style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'monospace',outline:'none',color:C.txt }} />
                </div>
              )}
              <div>
                <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Durum</label>
                <select value={form.durum} onChange={e=>setForm(f=>({...f,durum:e.target.value}))}
                  style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt,background:'#fff',cursor:'pointer' }}>
                  {DURUMLAR.map(d=><option key={d}>{d}</option>)}
                </select>
              </div>
            </div>

            {/* Tarihler */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
              {[['Teklif Tarihi','teklif_tarihi'],['Geçerlilik','gecerlilik_tarihi']].map(([lbl,key])=>(
                <div key={key}>
                  <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>{lbl}</label>
                  <input type="date" value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                    style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt }} />
                </div>
              ))}
            </div>

            {/* Notlar */}
            <div style={{ marginBottom:18 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em' }}>Notlar</label>
              <textarea value={form.notlar} onChange={e=>setForm(f=>({...f,notlar:e.target.value}))} rows={2}
                style={{ width:'100%',padding:'9px 12px',border:`1px solid ${C.border2}`,borderRadius:9,fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',color:C.txt,resize:'vertical' }} />
            </div>

            <div style={{ display:'flex',gap:10 }}>
              <button onClick={()=>setModal(null)} style={{ flex:1,padding:10,border:`1px solid ${C.border2}`,borderRadius:10,cursor:'pointer',background:'none',fontSize:13,fontWeight:600,color:C.txt2 }}>İptal</button>
              <button onClick={save} disabled={saving||!form.firma_adi.trim()||!form.urun.trim()}
                style={{ flex:2,padding:10,border:'none',borderRadius:10,cursor:'pointer',
                  background:'linear-gradient(135deg,#0672A0,#0891B2)',color:'#fff',fontSize:13,fontWeight:700,
                  opacity:saving||!form.firma_adi.trim()||!form.urun.trim()?0.5:1 }}>
                {saving?'Kaydediliyor…':'💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Başlık + Yeni buton */}
      <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10 }}>
        <div>
          <h2 style={{ fontSize:22,fontWeight:900,color:C.txt,letterSpacing:'-.02em' }}>Fiyat Teklifleri</h2>
          <p style={{ fontSize:12,color:C.txt2,marginTop:2 }}>{filtered.length} / {data.length} teklif · {sortedFirms.length} firma</p>
        </div>
        <div style={{ display:'flex',gap:8 }}>
          <button onClick={()=>exportFirmaXL('', filtered)} style={{ background:'none',border:`1px solid ${C.green}`,borderRadius:10,
            padding:'8px 14px',fontSize:12,fontWeight:700,color:C.green,cursor:'pointer',
            display:'flex',alignItems:'center',gap:5 }}>📊 Excel</button>
          <button onClick={()=>setImpModal(true)} style={{ background:'none',border:`1px solid ${C.border2}`,borderRadius:10,
            padding:'8px 14px',fontSize:12,fontWeight:700,color:C.txt2,cursor:'pointer',
            display:'flex',alignItems:'center',gap:5 }}>📥 İçe Aktar</button>
          <button onClick={()=>openAdd()} style={{ background:'linear-gradient(135deg,#0672A0,#0891B2)',
            color:'#fff',border:'none',borderRadius:10,padding:'8px 16px',fontSize:13,
            fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:5,
            boxShadow:'0 4px 12px rgba(8,145,178,.3)' }}><IcoPlus size={16}/> Yeni Teklif</button>
        </div>
      </div>

      {/* KPI satırı */}
      <div style={{ display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10 }}>
        {[
          ['📋 Toplam', total, C.teal, C.tealS],
          ['⏳ Teklif Verildi', teklif, C.amber, C.amberS],
          ['✅ Onaylanan', onay, C.green, C.greenS],
          ['❌ Onaylanmadı', ret, C.red, C.redS],
        ].map(([lbl,val,col,bg])=>(
          <div key={lbl} style={{ background:bg,borderRadius:12,padding:'12px 16px',border:`1px solid ${col}30` }}>
            <p style={{ fontSize:11,fontWeight:700,color:col,marginBottom:4 }}>{lbl}</p>
            <p style={{ fontSize:26,fontWeight:900,color:col,fontFamily:'monospace',letterSpacing:'-.02em' }}>{val}</p>
          </div>
        ))}
      </div>
      {onayTutar > 0 && (
        <div style={{ background:C.greenS,borderRadius:10,padding:'10px 16px',border:`1px solid rgba(21,128,61,.2)`,
          fontSize:13,fontWeight:700,color:C.green }}>
          💰 Onaylanan toplam tutar: <span style={{ fontFamily:'monospace',fontSize:15 }}>${onayTutar.toFixed(2)}</span>
        </div>
      )}

      {/* Arama + Filtre */}
      <div style={{ display:'flex',gap:10,flexWrap:'wrap' }}>
        <div style={{ position:'relative',flex:1,minWidth:200 }}>
          <span style={{ position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:C.txt2,display:'flex' }}><IcoSearch size={14}/></span>
          <input placeholder="Firma, ürün veya not ara…" value={q} onChange={e=>setQ(e.target.value)}
            style={{ width:'100%',paddingLeft:34,paddingRight:12,paddingTop:9,paddingBottom:9,
              border:`1px solid ${C.border2}`,borderRadius:10,fontSize:13,fontFamily:'Inter,sans-serif',
              outline:'none',color:C.txt,background:C.surface }} />
        </div>
      </div>

      {/* Durum filtre çipleri */}
      <div style={{ display:'flex',gap:7,flexWrap:'wrap' }}>
        {[['all','Tümü',total],['Teklif Verildi','⏳ Bekleyen',teklif],['Onaylandı','✅ Onaylanan',onay],['Onaylanmadı','❌ Reddedilen',ret]].map(([val,lbl,cnt])=>{
          const active = sf === val;

                      </div>
                    </div>

                    <select value={t.durum} disabled={isBusy} onChange={e=>setDurum(t,e.target.value)}

                    <div style={{ display:'flex',gap:4,flexShrink:0 }}>
                      <button onClick={()=>openEdit(t)} disabled={isBusy}

                        onMouseEnter={e=>e.currentTarget.style.color=C.red}
                        onMouseLeave={e=>e.currentTarget.style.color=C.border2}><IcoTrash size={14}/></button>
                    </div>
                  </div>

              })}

        })
      }
    </div>
  );
}

// ── Firma Autocomplete Input ──────────────────────────────────────────────
function FirmaInput({ value, onChange, firmalar, placeholder, style }) {
  const [open, setOpen] = React.useState(false);
  const [touched, setTouched] = React.useState(false);
  const ref = React.useRef(null);

  const matches = React.useMemo(() => {
    if (!touched || !value) return firmalar.slice(0, 8);
    const q = value.toLowerCase();
    return firmalar.filter(f => f.toLowerCase().includes(q)).slice(0, 10);
  }, [value, firmalar, touched]);

  // Close on outside click
  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  return (
    <div ref={ref} style={{ position:'relative' }}>
      <input value={value}
        onChange={e => { onChange(e.target.value); setOpen(true); setTouched(true); }}
        onFocus={() => { setOpen(true); setTouched(true); }}
        placeholder={placeholder || "Firma ara veya yaz…"}
        style={style} />
      {open && matches.length > 0 && (
        <div style={{ position:'absolute', top:'100%', left:0, right:0, zIndex:200,
          background:'#fff', border:`1px solid ${C.border2}`, borderRadius:10,
          boxShadow:'0 8px 24px rgba(0,0,0,.15)', maxHeight:220, overflowY:'auto', marginTop:4 }}>
          {matches.map(f => (
            <div key={f}
              onMouseDown={e => { e.preventDefault(); onChange(f); setOpen(false); }}
              onTouchEnd={e => { e.preventDefault(); onChange(f); setOpen(false); }}
              style={{ padding:'10px 14px', fontSize:13, fontWeight:600, color:C.txt,
                cursor:'pointer', borderBottom:`1px solid ${C.border}` }}
              onMouseEnter={e => e.currentTarget.style.background = C.greenS}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              🏢 {f}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const NOTE_TAGS = ['Önemli','Takip','Toplantı','Teklif','Numune','Fikir','Acil'];
const TAG_COLORS = { 'Önemli':'#DC2626','Takip':'#0891B2','Toplantı':'#7C3AED','Teklif':'#15803D','Numune':'#B45309','Fikir':'#6366F1','Acil':'#DC2626' };

function parseTags(icerik) {
  if (!icerik) return { tags:[], body:icerik||'' };
  const lines = icerik.split('\n');
  if (lines[0] && lines[0].startsWith('#')) {
    const tags = lines[0].match(/#(\S+)/g)||[];
    return { tags: tags.map(t=>t.slice(1)), body: lines.slice(1).join('\n') };
  }
  return { tags:[], body:icerik };
}

function buildIcerik(tags, body) {
  if (tags.length === 0) return body;
  return tags.map(t=>'#'+t).join(' ') + '\n' + body;
}

function NotesView({ data, customers, onRefresh }) {

  const [tf, setTf]     = React.useState('all'); // tag filter
  const [sort, setSort] = React.useState('new');
  const [busy, setBusy] = React.useState(null);
  const [modal, setModal]   = React.useState(null); // null | { note } | 'new'
  const [form, setForm]     = React.useState({ icerik:'', renk:'default', musteri:'', tags:[] });
  const [saving, setSaving] = React.useState(false);

  const RENKLER = {
    default: { bg:'#FFFFFF', border:'#E2E8F0', txt:'#1E293B', label:'⬜ Varsayılan' },
    sari:    { bg:'#FEFCE8', border:'#FEF08A', txt:'#78350F', label:'🟡 Sarı'       },
    yesil:   { bg:'#DCFCE7', border:'#BBF7D0', txt:'#14532D', label:'🟢 Yeşil'      },
    mavi:    { bg:'#E0F2FE', border:'#BAE6FD', txt:'#0C4A6E', label:'🔵 Mavi'       },
    pembe:   { bg:'#FDF2F8', border:'#FBCFE8', txt:'#701A75', label:'🩷 Pembe'      },
    turuncu: { bg:'#FFF7ED', border:'#FED7AA', txt:'#7C2D12', label:'🟠 Turuncu'    },
    mor:     { bg:'#F5F3FF', border:'#DDD6FE', txt:'#4C1D95', label:'🟣 Mor'        },
  };

  const firmalar = [...new Set((customers||[]).map(c=>c.firma_adi).filter(Boolean))].sort();

  const handleNoteKey = (e) => {
    if (e.key !== 'Enter') return;
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd, val = ta.value;
    const lineStart = val.lastIndexOf('\n', s-1) + 1;
    const curLine = val.substring(lineStart, s);
    const hasBullet = /^\s*- /.test(curLine);
    const isEmpty = curLine.trim() === '-' || curLine.trim() === '- ' || curLine.trim() === '';
    if (hasBullet && isEmpty) return; // normal enter to break out
    if (hasBullet) {
      e.preventDefault();
      const ins = '\n- ';
      const nv = val.substring(0,s) + ins + val.substring(en);
      setForm(f=>({...f, icerik:nv}));
      setTimeout(()=>{ ta.selectionStart = ta.selectionEnd = s + ins.length; }, 0);
    }
  };

  const renderBody = (icerik, renk) => {
    if (!icerik) return null;
    const lines = icerik.split('\n');
    return lines.map((line, i) => {
      if (line.trim() === '---' || line.trim() === '—') return (
        <hr key={i} style={{ border:'none', borderTop:`1px solid ${renk.border}`, margin:'6px 0', opacity:.6 }} />
      );
      if (/^\s*- (.+)/.test(line)) return (
        <div key={i} style={{ display:'flex', gap:6, alignItems:'flex-start', fontSize:12, color:renk.txt, lineHeight:1.6 }}>
          <span style={{ marginTop:2, opacity:.5, flexShrink:0 }}>•</span>
          <span style={{ opacity:.8 }}>{line.replace(/^\s*- /,'')}</span>
        </div>
      );
      if (line.trim() === '') return <div key={i} style={{ height:6 }} />;
      return <div key={i} style={{ fontSize:12, color:renk.txt, opacity:.8, lineHeight:1.6 }}>{line}</div>;
    });
  };

  const getTitle = (icerik) => {
    if (!icerik) return 'Başlıksız Not';
    const { body } = parseTags(icerik);
    const lines = body.split('\n').filter(l => l.trim());
    return lines[0]?.substring(0, 60) || 'Başlıksız Not';
  };

  const filtered = data
    .filter(n => {
      if (rf !== 'all' && (n.renk||'default') !== rf) return false;
      if (tf !== 'all') {
        const { tags } = parseTags(n.icerik||'');
        if (!tags.includes(tf)) return false;
      }
      if (q) {
        const Q = q.toLowerCase();
        if (!(n.icerik||'').toLowerCase().includes(Q) &&
            !(n.musteri||'').toLowerCase().includes(Q)) return false;
      }
      return true;
    })
    .sort((a,b) => {
      if (sort === 'new') return new Date(b.updated_at||0) - new Date(a.updated_at||0);
      if (sort === 'old') return new Date(a.updated_at||0) - new Date(b.updated_at||0);
      return getTitle(a.icerik).localeCompare(getTitle(b.icerik), 'tr');
    });

  const openNew  = () => { setForm({ icerik:'', renk:'default', musteri:'', tags:[] }); setModal('new'); };
  const openEdit = (n) => {
    const { tags, body } = parseTags(n.icerik||'');
    setForm({ icerik:body, renk:n.renk||'default', musteri:n.musteri||'', tags });
    setModal(n);
  };
  const toggleTag = (tag) => setForm(f => ({
    ...f, tags: f.tags.includes(tag) ? f.tags.filter(t=>t!==tag) : [...f.tags, tag]
  }));

  const save = async () => {
    if (!form.icerik.trim()) return;
    setSaving(true);
    const now = new Date().toISOString();
    const fullIcerik = buildIcerik(form.tags, form.icerik.trim());
    const pay = { icerik: fullIcerik, renk: form.renk, musteri: form.musteri.trim()||null, updated_at: now };
    if (modal === 'new') {
      await db.from('genel_notlar').insert([{ ...pay, created_at: now }]);

      await db.from(modal._tbl||'genel_notlar').update(pay).eq('id', modal.id);
    }
    setSaving(false); setModal(null);
    await onRefresh();

    setBusy(n.id);
    await db.from(n._tbl||'genel_notlar').delete().eq('id', n.id);
    await onRefresh(); setBusy(null);
  };

  const cntByRenk = {};
  Object.keys(RENKLER).forEach(r => { cntByRenk[r] = data.filter(n => (n.renk||'default') === r).length; });
  const cntByTag = {};
  NOTE_TAGS.forEach(tag => { cntByTag[tag] = data.filter(n => parseTags(n.icerik||'').tags.includes(tag)).length; });

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>

      {/* Modal: Yeni / Düzenle */}

        <div onClick={e=>e.target===e.currentTarget&&setModal(null)}
          style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:50,
            display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
          <div style={{ background: RENKLER[form.renk]?.bg||'#fff', borderRadius:20, padding:24,
            width:'100%', maxWidth:480, boxShadow:'0 20px 60px rgba(0,0,0,.3)',
            border:`2px solid ${RENKLER[form.renk]?.border||'#E2E8F0'}` }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
              <h3 style={{ fontSize:17, fontWeight:800, color:RENKLER[form.renk]?.txt||C.txt }}>
                {modal === 'new' ? '📝 Yeni Not' : '✏️ Notu Düzenle'}
              </h3>
              <button onClick={()=>setModal(null)} style={{ background:'none',border:'none',cursor:'pointer',color:C.txt2,display:'flex' }}><IcoX size={20}/></button>
            </div>

            {/* Etiketler */}
            <div style={{ marginBottom:12 }}>

                    <button key={tag} onClick={()=>toggleTag(tag)}

                        background:active?col+'20':'transparent',color:active?col:C.txt2,
                        fontSize:11,fontWeight:700,cursor:'pointer',transition:'all .15s' }}>
                      #{tag}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Renk seç */}
            <div style={{ marginBottom:14 }}>
              <label style={{ fontSize:10,fontWeight:700,color:C.txt2,display:'block',marginBottom:7,textTransform:'uppercase',letterSpacing:'.08em' }}>Renk</label>

      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2, display:'flex' }}><IcoSearch size={14}/></span>
          <input placeholder="Not veya firma ara…" value={q} onChange={e=>setQ(e.target.value)}
            style={{ width:'100%', paddingLeft:34, paddingRight:12, paddingTop:9, paddingBottom:9,
              border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13, fontFamily:'Inter,sans-serif',
              outline:'none', color:C.txt, background:C.surface }} />
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{ padding:'9px 12px', border:`1px solid ${C.border2}`, borderRadius:10, fontSize:13,
            fontFamily:'Inter,sans-serif', outline:'none', color:C.txt, background:C.surface, cursor:'pointer' }}>
          <option value="new">⏱ En Yeni</option>
          <option value="old">📅 En Eski</option>
          <option value="az">🔤 A-Z</option>
        </select>
      </div>

      {/* Renk filtreleri */}
      <div style={{ display:'flex', gap:7, flexWrap:'wrap', alignItems:'center' }}>
        {[['all','Tümü',data.length], ...Object.entries(RENKLER).map(([k,r])=>[k,r.label,cntByRenk[k]||0])].map(([val,lbl,cnt]) => {
          const active = rf === val;
          const rObj = RENKLER[val];
          return (
            <button key={val} onClick={()=>setRf(val)}
              style={{ padding:'5px 12px', borderRadius:18,
                border:`2px solid ${active ? (rObj?rObj.border:'#0891B2') : C.border}`,
                background: active ? (rObj?rObj.bg:C.tealS) : 'transparent',
                color: active ? (rObj?rObj.txt:C.teal) : C.txt2,
                fontSize:12, fontWeight:700, cursor:'pointer', transition:'all .15s', whiteSpace:'nowrap' }}>
              {lbl} <span style={{ opacity:.65 }}>{cnt}</span>
            </button>
          );
        })}
      </div>

      {/* Etiket filtreleri */}
      <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' }}>
        <span style={{ fontSize:10,fontWeight:700,color:C.txt2,textTransform:'uppercase',letterSpacing:'.08em' }}>Etiket:</span>
        <button onClick={()=>setTf('all')}
          style={{ padding:'4px 10px',borderRadius:14,border:`1.5px solid ${tf==='all'?C.teal:C.border}`,
            background:tf==='all'?C.tealS:'transparent',color:tf==='all'?C.teal:C.txt2,
            fontSize:11,fontWeight:700,cursor:'pointer' }}>
          Tümü
        </button>
        {NOTE_TAGS.filter(tag => cntByTag[tag] > 0).map(tag => {
          const col = TAG_COLORS[tag]||C.txt2;
          return (
            <button key={tag} onClick={()=>setTf(tf===tag?'all':tag)}
              style={{ padding:'4px 10px',borderRadius:14,border:`1.5px solid ${tf===tag?col:C.border}`,
                background:tf===tag?col+'18':'transparent',color:tf===tag?col:C.txt2,
                fontSize:11,fontWeight:700,cursor:'pointer' }}>
              #{tag} <span style={{ opacity:.7 }}>{cntByTag[tag]}</span>
            </button>
          );
        })}
      </div>

      {/* Notlar grid */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:14 }}>
        {filtered.length === 0
          ? <div style={{ gridColumn:'1/-1', padding:32, textAlign:'center', color:C.txt2,
              background:C.surface, borderRadius:16, border:`1px solid ${C.border}` }}>
              {q||rf!=='all' ? 'Filtreye uyan not yok.' : 'Henüz not eklenmemiş.'}
            </div>
          : filtered.map((n, i) => {
            const renk = RENKLER[n.renk||'default'] || RENKLER.default;
            const { tags: noteTags, body: noteBody } = parseTags(n.icerik||'');
            const title = getTitle(n.icerik);
            const body  = noteBody.split('\n').slice(1).join('\n').trim();
            const isBusy = busy === n.id;
            return (
              <div key={n.id||i}
                style={{ background:renk.bg, border:`1.5px solid ${renk.border}`, borderRadius:16,
                  padding:18, position:'relative', cursor:'pointer', opacity:isBusy?0.4:1,
                  transition:'box-shadow .18s, transform .18s' }}
                onClick={() => openEdit(n)}
                onMouseEnter={e=>{ e.currentTarget.style.boxShadow=`0 8px 24px rgba(0,0,0,.1)`; e.currentTarget.style.transform='translateY(-2px)'; }}
                onMouseLeave={e=>{ e.currentTarget.style.boxShadow='none'; e.currentTarget.style.transform='none'; }}>

                {/* Etiketler + Firma */}
                {(noteTags.length > 0 || n.musteri) && (
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4, marginBottom:6, alignItems:'center' }}>
                    {noteTags.map(tag => (
                      <span key={tag} style={{ fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10,
                        background:(TAG_COLORS[tag]||C.txt2)+'20', color:TAG_COLORS[tag]||C.txt2 }}>
                        #{tag}
                      </span>
                    ))}
                    {n.musteri && (
                      <span style={{ fontSize:10,fontWeight:700,color:renk.txt,opacity:.6,
                        textTransform:'uppercase',letterSpacing:'.06em' }}>🏢 {n.musteri}</span>
                    )}
                  </div>
                )}

                {/* Başlık */}
                <h4 style={{ fontWeight:800, fontSize:14, color:renk.txt, marginBottom:8,
                  paddingRight:28, lineHeight:1.3, wordBreak:'break-word' }}>
                  {title}
                </h4>

                {/* Gövde */}
                {body && (
                  <div style={{ marginBottom:28, overflow:'hidden', maxHeight:90 }}>
                    {renderBody(body, renk)}
                  </div>
                )}

                {/* Alt: tarih */}
                <div style={{ position:'absolute', bottom:12, left:16, display:'flex',
                  alignItems:'center', gap:4, fontSize:10, color:renk.txt, opacity:.55,
                  fontWeight:600, letterSpacing:'.05em', fontFamily:'monospace' }}>
                  <IcoClock size={10}/> {fmtDate(n.updated_at||n.created_at)}
                </div>

                {/* Sil butonu */}
                <button onClick={e=>{e.stopPropagation();delNote(n);}} disabled={isBusy}
                  style={{ position:'absolute', top:12, right:12, background:'none',
                    border:'none', cursor:'pointer', color:renk.txt, opacity:.4, padding:4, borderRadius:6,
                    display:'flex', alignItems:'center', justifyContent:'center' }}
                  onMouseEnter={e=>{ e.currentTarget.style.opacity='1'; e.currentTarget.style.color='#DC2626'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.opacity='.4'; e.currentTarget.style.color=renk.txt; }}>
                  <IcoTrash size={13}/>
                </button>
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

// ── ANA UYGULAMA ─────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState('dashboard');
  const [sideOpen, setSideOpen] = useState(false);
  const [loading, setLoading]   = useState(true);
  const [dbErr, setDbErr]       = useState(null);

  const [customers, setCustomers] = useState([]);
  const [samples,   setSamples]   = useState([]);
  const [prices,    setPrices]    = useState([]);
  const [costs,     setCosts]     = useState([]);
  const [notes,     setNotes]     = useState([]);
  const [offers,    setOffers]    = useState([]);
  const [samplesTbl, setSamplesTbl] = useState('numuneler');

  const nav = [
    { id:'dashboard', label:'Özet Panel',  Icon:IcoGrid },
    { id:'samples',   label:'Numuneler',   Icon:IcoPkg  },
    { id:'customers', label:'Müşteriler',  Icon:IcoUsers },
    { id:'prices',    label:'Fiyatlar',    Icon:IcoDollar },
    { id:'cost',      label:'Maliyet',     Icon:IcoCalc  },
    { id:'offers',    label:'Teklifler',   Icon:IcoSend  },
    { id:'notes',     label:'Notlarım',    Icon:IcoFile  },
  ];

  const loadData = async () => {
    setLoading(true); setDbErr(null);
    try {
      const errs = [];
      const { data:cu, error:ce } = await db.from('musteriler').select('*');
      if (ce) errs.push(`Müşteriler: ${ce.message}`); else setCustomers(cu||[]);

      let stbl = 'numuneler';
      let { data:sa, error:saErr } = await db.from('numuneler').select('*');
      if (saErr || !sa || sa.length === 0) { const { data:sa2 } = await db.from('Numune takip').select('*'); if (sa2 && sa2.length > 0) { sa = sa2; stbl = 'Numune takip'; } }
      if (sa) setSamples(sa);
      setSamplesTbl(stbl);

      const { data:pr, error:pe } = await db.from('fiyatlar').select('*');
      if (pe) errs.push(`Fiyatlar: ${pe.message}`); else setPrices(pr||[]);

      const { data:co } = await db.from('erp_gecmis').select('*').order('tarih', { ascending: false }).limit(200);
      if (co) setCosts(co);

      const [genelRes, notlarRes] = await Promise.all([
        db.from('genel_notlar').select('*').order('updated_at', { ascending: false }),
        db.from('notlar').select('*').order('updated_at', { ascending: false }),
      ]);
      const genel = (genelRes.data||[]).map(n => ({ ...n, _tbl:'genel_notlar', musteri: n.musteri||null }));
      const firma = (notlarRes.data||[]).map(n => ({ ...n, _tbl:'notlar', musteri: n.firma||null }));
      setNotes([...genel, ...firma]);

      const { data:of } = await db.from('fiyat_teklifleri').select('*').order('created_at', { ascending: false });
      if (of) setOffers(of);

      if (errs.length) setDbErr(errs.join(' | '));
    } catch (e) {
      setDbErr(`Sistemsel Hata: ${e.message}`);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadData(); }, []);

  const goTo = (id) => { setTab(id); setSideOpen(false); };

  const current = nav.find(n => n.id === tab);

  return (
    <div style={{ display:'flex', height:'100vh', background:C.page, color:C.txt,
      fontFamily:'Inter,sans-serif', overflow:'hidden' }}>

      {/* Global stiller */}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { margin:0; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .ypSpin { animation:spin .9s linear infinite; display:inline-flex; }
        @media (max-width:1023px) {
          .ypDesk { display:none !important; }
          .ypSidebarWrap { position:fixed !important; top:0; left:0; bottom:0;
            transform:translateX(-100%); transition:transform .28s cubic-bezier(.32,.72,0,1); z-index:30; }
          .ypSidebarWrap.open { transform:translateX(0) !important; }
        }
        @media (min-width:1024px) {
          .ypMobile { display:none !important; }
          .ypSidebarWrap { position:relative !important; transform:none !important; flex-shrink:0; }
        }
      `}</style>

      {/* Mobil overlay */}
      {sideOpen && (
        <div onClick={() => setSideOpen(false)}
          style={{ position:'fixed', inset:0, background:'rgba(10,21,32,.65)',
            zIndex:20, backdropFilter:'blur(3px)' }} />
      )}

      {/* ══════ SIDEBAR ══════ */}
      <aside className={`ypSidebarWrap${sideOpen?' open':''}`}
        style={{ width:252, background:C.sidebar,
          borderRight:`1px solid ${C.sBorder}`,
          boxShadow:'4px 0 24px rgba(0,0,0,.4)',
          display:'flex', flexDirection:'column' }}>

        {/* Logo */}
        <div style={{ height:72, padding:'0 20px', flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'space-between',
          background:C.sHead, borderBottom:`1px solid ${C.sBorder}` }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:9,
              background:'linear-gradient(135deg,#0672A0,#0891B2)',
              display:'flex', alignItems:'center', justifyContent:'center',
              color:'#fff', boxShadow:'0 2px 10px rgba(8,145,178,.4)' }}>
              <IcoZap size={18} />
            </div>
            <span style={{ fontSize:18, fontWeight:800, color:'#fff', letterSpacing:'-.01em' }}>
              Yanteks<span style={{ color:C.tealL }}>Pro</span>
            </span>
          </div>
          <button className="ypMobile" onClick={() => setSideOpen(false)}
            style={{ background:'none', border:'none', color:'rgba(255,255,255,.45)',
              cursor:'pointer', padding:6, borderRadius:8, display:'flex' }}>
            <IcoX size={18} />
          </button>
        </div>

        {/* Nav linkleri */}
        <nav style={{ flex:1, overflowY:'auto', padding:'10px 0',
          scrollbarWidth:'thin', scrollbarColor:'rgba(255,255,255,.12) transparent' }}>
          <p style={{ padding:'8px 20px 6px', fontSize:9, fontWeight:700,
            color:'rgba(255,255,255,.25)', letterSpacing:'.13em', textTransform:'uppercase' }}>
            ANA MENÜ
          </p>
          {nav.map(({ id, label, Icon }) => {
            const active = tab === id;
            return (
              <button key={id} onClick={() => goTo(id)}
                style={{
                  width:'calc(100% - 16px)', margin:'2px 8px',
                  display:'flex', alignItems:'center', gap:12,
                  padding:'12px 14px', borderRadius:12, border:'none',
                  cursor:'pointer', fontFamily:'Inter,sans-serif', fontSize:13, fontWeight:600,
                  background: active ? C.navActive : 'transparent',
                  boxShadow: active ? C.navGlow : 'none',
                  color: active ? '#fff' : C.navTxt,
                  transition:'background .15s, color .15s',
                }}
                onMouseEnter={e => { if (!active) { e.currentTarget.style.background=C.navHover; e.currentTarget.style.color='rgba(255,255,255,.9)'; } }}
                onMouseLeave={e => { if (!active) { e.currentTarget.style.background='transparent'; e.currentTarget.style.color=C.navTxt; } }}>
                <span style={{ width:22, textAlign:'center', flexShrink:0, opacity:active?1:.75 }}>
                  <Icon size={18} />
                </span>
                <span>{label}</span>
                {active && <span style={{ marginLeft:'auto', width:6, height:6,
                  borderRadius:'50%', background:'rgba(255,255,255,.7)' }} />}
              </button>
            );
          })}
        </nav>

        <div style={{ padding:'14px 20px', borderTop:`1px solid ${C.sBorder}`,
          fontSize:10, fontWeight:600, color:'rgba(255,255,255,.2)', letterSpacing:'.06em' }}>
          YANTEKS PRO v2.0
        </div>
      </aside>

      {/* ══════ İÇERİK ══════ */}
      <main style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, overflow:'hidden' }}>

        {/* Topbar */}
        <header style={{ height:72, background:C.surface,
          borderBottom:`1.5px solid ${C.border2}`,
          boxShadow:'0 1px 0 rgba(0,0,0,.04)',
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'0 24px', flexShrink:0, zIndex:10 }}>
          <div style={{ display:'flex', alignItems:'center', gap:14 }}>
            <button className="ypMobile" onClick={() => setSideOpen(true)}
              style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:10,
                padding:8, cursor:'pointer', color:C.txt2, display:'flex', alignItems:'center' }}>
              <IcoMenu size={20} />
            </button>
            <div>
              <h2 style={{ fontSize:18, fontWeight:800, color:C.txt, letterSpacing:'-.02em' }}>
                {current?.label}
              </h2>
              <p style={{ fontSize:11, color:C.txt2, fontWeight:500, marginTop:1 }}>
                Sisteme hoş geldiniz, iyi çalışmalar.
              </p>
            </div>
          </div>

          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            {/* Arama (masaüstü) */}
            <div className="ypDesk" style={{ position:'relative' }}>
              <span style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)',
                color:C.txt2, display:'flex' }}><IcoSearch size={15} /></span>
              <input type="text" placeholder="Müşteri veya ürün ara..."
                style={{ paddingLeft:36, paddingRight:16, paddingTop:9, paddingBottom:9,
                  width:250, background:C.page, border:`1px solid ${C.border2}`,
                  borderRadius:22, fontSize:12, fontWeight:500, color:C.txt,
                  fontFamily:'Inter,sans-serif', outline:'none' }}
                onFocus={e=>{e.target.style.borderColor=C.teal;e.target.style.boxShadow=`0 0 0 3px ${C.tealG}`;}}
                onBlur={e=>{e.target.style.borderColor=C.border2;e.target.style.boxShadow='none';}} />
            </div>

            {/* Yenile */}
            <button onClick={loadData} title="Verileri Yenile"
              style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:10,
                padding:8, cursor:'pointer', color:C.txt2, display:'flex' }}>
              <span className={loading?'ypSpin':''}><IcoRefresh size={18} /></span>
            </button>

            {/* Bildirim */}
            <button style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:10,
              padding:8, cursor:'pointer', color:C.txt2, display:'flex', position:'relative' }}>
              <IcoBell size={18} />
              <span style={{ position:'absolute', top:7, right:7, width:8, height:8,
                background:'#DC2626', borderRadius:'50%', border:'2px solid #fff' }} />
            </button>

            {/* Avatar */}
            <div style={{ width:38, height:38, borderRadius:'50%',
              background:'linear-gradient(135deg,#0672A0,#0891B2)',
              display:'flex', alignItems:'center', justifyContent:'center',
              color:'#fff', fontWeight:800, fontSize:13, cursor:'pointer',
              boxShadow:'0 2px 8px rgba(8,145,178,.35)', border:'3px solid #fff' }}>
              YP
            </div>
          </div>
        </header>

        {/* Sayfa içeriği */}
        <div style={{ flex:1, overflowY:'auto', padding:24 }}>
          <div style={{ maxWidth:1300, margin:'0 auto' }}>

            {/* Hata */}
            {dbErr && (
              <div style={{ background:'#FEF2F2', borderLeft:'4px solid #DC2626',
                padding:'14px 20px', marginBottom:24, borderRadius:'0 12px 12px 0' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8,
                  color:'#991B1B', fontWeight:700, marginBottom:4 }}>
                  <IcoAlert size={16} /> Veritabanı Uyarısı
                </div>
                <p style={{ fontSize:12, color:'#B91C1C', fontWeight:500 }}>{dbErr}</p>
              </div>
            )}

            {/* Yükleniyor */}
            {loading ? (
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center',
                justifyContent:'center', height:280, gap:14 }}>
                <span className="ypSpin" style={{ color:C.teal, display:'flex' }}>
                  <IcoRefresh size={40} />
                </span>
                <p style={{ color:C.txt2, fontWeight:500 }}>Supabase verileri yükleniyor…</p>
              </div>
            ) : (
              <>
                {tab === 'dashboard'  && <DashboardView customers={customers} samples={samples} prices={prices} notes={notes} offers={offers} onNav={goTo} />}
                {tab === 'customers'  && <CustomersView data={customers} onRefresh={loadData} />}
                {tab === 'samples'    && <SamplesView   data={samples} tbl={samplesTbl} onRefresh={loadData} />}
                {tab === 'prices'     && <PricesView    data={prices}    onRefresh={loadData} />}
                {tab === 'cost'       && <CostView      data={costs}     onRefresh={loadData} />}
                {tab === 'notes'      && <NotesView     data={notes} customers={customers} onRefresh={loadData} />}
                {tab === 'offers'     && <OffersView data={offers} customers={customers} onRefresh={loadData} />}
              </>
            )}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
