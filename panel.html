function parseNoteTags(icerik) {
  if (!icerik) return { tags: [], body: '' };
  const lines = icerik.split('\n');
  if (lines[0] && lines[0].startsWith('#')) {
    const tags = lines[0].match(/#(\S+)/g) || [];
    return { tags: tags.map(t => t.slice(1)), body: lines.slice(1).join('\n') };
  }
  return { tags: [], body: icerik };
}

function buildNoteContent(tags, body) {
  if (!tags || tags.length === 0) return body;
  return tags.map(t => '#' + t).join(' ') + '\n' + body;
}

const isV = n => (n || '').toString().startsWith('↳');
const dN = n => (n || '').replace(/^↳\s*/, '').trim();

const parseAc = i => {
  const a = i.aciklama || '';
  if (isV(i.numune) && a.includes('|')) {
    const x = a.indexOf('|');
    return { pc: a.substring(0, x), note: a.substring(x + 1) };
  }
  return { pc: '', note: a };
};

const buildAc = (i, n) => isV(i.numune) ? ((parseAc(i).pc || '') + '|' + (n || '')) : n || '';

function FirmaInput({ value, onChange, firmalar, placeholder }) {
  const [op, setOp] = useState(false);
  const [tch, setTch] = useState(false);
  const r = useRef(null);
  
  const m = useMemo(() => (!tch || !value) ? firmalar.slice(0, 8) : firmalar.filter(f => trl(f).includes(trl(value))).slice(0, 10), [value, firmalar, tch]);
  
  useEffect(() => {
    const h = e => { if (r.current && !r.current.contains(e.target)) setOp(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  
  return (
    <div ref={r} style={{ position: 'relative' }}>
      <input value={value} onChange={e => { onChange(e.target.value); setOp(true); setTch(true) }} onFocus={() => { setOp(true); setTch(true) }} placeholder={placeholder || "Firma ara…"} style={S.inp} />
      {op && m.length > 0 && (
        <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 200, background: '#fff', border: `1px solid ${C.border2}`, borderRadius: 10, boxShadow: '0 8px 24px rgba(0,0,0,.15)', maxHeight: 220, overflowY: 'auto', marginTop: 4 }}>

              🏢 {f}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

    if (ds === null) return null;
    if (ds >= 60) return 'red';
    if (ds >= 30) return 'amber';
    return null;
  };

  const visited = (m) => m.ziyaret_durumu === 'ziyaret edildi';

  const filtered = data.filter(m => {
    if (sf === 'visited' && !visited(m)) return false;
    if (sf === 'pending' && visited(m)) return false;
    if (sf === 'late' && lateLevel(m) !== 'red' && lateLevel(m) !== 'amber') return false;
    if (sf === 'notlu' && !m.notlar) return false;
    if (q) {
      const Q = q.toLowerCase();
      const f1 = (m.firma_adi || '').toLowerCase();
      const f2 = (m.bolge || '').toLowerCase();
      const f3 = (m.notlar || '').toLowerCase();
      if (!f1.includes(Q) && !f2.includes(Q) && !f3.includes(Q)) return false;
    }
    return true;
  }).sort((a, b) => {
    if (sort === 'az') return (a.firma_adi || '').localeCompare(b.firma_adi || '', 'tr');
    if (sort === 'late') return (daysSince(b.son_ziyaret) || 0) - (daysSince(a.son_ziyaret) || 0);
    if (sort === 'bolge') return (a.bolge || '').localeCompare(b.bolge || '', 'tr');
    return 0;
  });

  const toggleVisitStatus = async (e, m) => {
    e.preventDefault();
    e.stopPropagation();
    setBusy(m.id);
    const isDone = m.ziyaret_durumu === 'ziyaret edildi';
    const newStatus = isDone ? 'ziyaret edilecek' : 'ziyaret edildi';
    const payload = { ziyaret_durumu: newStatus };
    if (newStatus === 'ziyaret edildi') payload.son_ziyaret = tdy();
    
    await db.from('musteriler').update(payload).eq('id', m.id);
    await onRefresh();
    setBusy(null);
  };

  const delItem = async (e, m) => {
    e.preventDefault();
    e.stopPropagation();
    if (!window.confirm(`"${m.firma_adi}" silinsin mi?`)) return;
    setBusy(m.id);
    await db.from('musteriler').delete().eq('id', m.id);
    await onRefresh();
    setBusy(null);
  };

  const openAdd = () => { setForm(emptyForm); setEditItem(null); setShowAdd(true); };
  
  const openEdit = (e, m) => {
    e.preventDefault();
    e.stopPropagation();
    setForm({
      firma_adi: m.firma_adi || '',
      bolge: m.bolge || '',
      son_ziyaret: m.son_ziyaret || '',
      ziyaret_durumu: m.ziyaret_durumu || 'ziyaret edilecek',
      notlar: m.notlar || ''
    });
    setEditItem(m);
    setShowAdd(true);
  };

  const save = async (e) => {
    if (e) e.preventDefault();
    if (!form.firma_adi.trim()) return;
    setSaving(true);
    const pay = {
      firma_adi: form.firma_adi.trim().toUpperCase(),
      bolge: form.bolge.trim().toUpperCase(),
      son_ziyaret: form.son_ziyaret || null,
      ziyaret_durumu: form.ziyaret_durumu,
      notlar: form.notlar.trim() || null
    };
    
    if (editItem) await db.from('musteriler').update(pay).eq('id', editItem.id);
    else await db.from('musteriler').insert([pay]);
    
    setSaving(false); setShowAdd(false); setEditItem(null);
    await onRefresh();
  };

  const cntV = data.filter(visited).length;
  const cntP = data.length - cntV;
  const cntL = data.filter(m => lateLevel(m) !== null).length;
  const cntN = data.filter(m => m.notlar).length;
  
  const totalCustomers = data.length;
  const visitedPct = totalCustomers === 0 ? 0 : Math.round((cntV / totalCustomers) * 100);

  const FILTERS = [
    ['all', 'Tümü', data.length, C.teal, C.tealS],
    ['visited', '✅ Gidilen', cntV, C.green, C.greenS],
    ['pending', '⏳ Bekleyen', cntP, C.amber, C.amberS],
    ['late', '🔴 Geciken', cntL, C.red, C.redS],
    ['notlu', '📝 Notlu', cntN, '#7C3AED', 'rgba(124,58,237,.1)'],
  ];

  const [openBolge, setOpenBolge] = useState(new Set());
  const toggleBolge = (b) => setOpenBolge(prev => {
    const n = new Set(prev); n.has(b) ? n.delete(b) : n.add(b); return n;
  });

  const bolgeMap = {};
  filtered.forEach(m => {
    const b = m.bolge || '—';
    if (!bolgeMap[b]) bolgeMap[b] = [];
    bolgeMap[b].push(m);
  });
  
  // Bölge yoğunluğuna (sayısına) göre çoktan aza sırala
  const bolgeList = Object.keys(bolgeMap).sort((a, b) => {
    const diff = bolgeMap[b].length - bolgeMap[a].length;
    return diff !== 0 ? diff : a.localeCompare(b, 'tr');
  });

  const exportXL = async () => {
    const dt = safeFileDate();
    const wb = new ExcelJS.Workbook();
    const sh = wb.addWorksheet('Müşteriler');
    
    sh.mergeCells('A1:F1');
    const tc = sh.getCell('A1');
    tc.value = 'YANTEKS MÜŞTERİ LİSTESİ · ' + dt;
    tc.font = { bold: true, size: 13, color: { argb: 'FFFFFFFF' } };
    tc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0672A0' } };
    tc.alignment = { horizontal: 'center', vertical: 'middle' };
    sh.getRow(1).height = 28;
    
    const hr = sh.addRow(['FİRMA ADI', 'BÖLGE', 'SON ZİYARET', 'SÜRE (GÜN)', 'DURUM', 'NOTLAR']);
    hr.eachCell(c => {
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0891B2' } };
      c.font = { color: { argb: 'FFFFFFFF' }, bold: true };
      c.alignment = { horizontal: 'center' };
    });
    hr.height = 20;
    sh.columns = [{ width: 32 }, { width: 16 }, { width: 14 }, { width: 14 }, { width: 18 }, { width: 40 }];
    
    filtered.forEach(m => {
      const ds = daysSince(m.son_ziyaret);
      const row = sh.addRow([m.firma_adi || '', m.bolge || '', m.son_ziyaret || '', ds !== null ? ds : '', visited(m) ? 'Ziyaret Edildi' : 'Bekliyor', m.notlar || '']);
      row.getCell(1).font = { bold: true };
      if (lateLevel(m) === 'red') row.getCell(4).font = { color: { argb: 'FF991B1B' }, bold: true };
      else if (lateLevel(m) === 'amber') row.getCell(4).font = { color: { argb: 'FFB45309' }, bold: true };
    });
    
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Yanteks_Musteriler_' + dt + '.xlsx';
    a.click(); URL.revokeObjectURL(a.href);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {showAdd && (
        <div onClick={e => e.target === e.currentTarget && setShowAdd(false)} style={S.mOv}>
          <div style={{ ...S.mBx, maxWidth: 420 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 18 }}>
              <h3 style={{ fontSize: 17, fontWeight: 800, color: C.txt }}>{editItem ? '✏️ Düzenle' : '➕ Yeni Müşteri'}</h3>
              <button type="button" onClick={() => setShowAdd(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.txt2, display: 'flex' }}><IcoX size={20} /></button>
            </div>
            
            <div style={{ marginBottom: 12 }}>
              <label style={S.lbl}>Firma Adı *</label>
              <input type="text" value={form.firma_adi} onChange={e => setForm(f => ({ ...f, firma_adi: e.target.value }))} style={S.inp} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <label style={S.lbl}>Bölge</label>
              <input type="text" value={form.bolge} onChange={e => setForm(f => ({ ...f, bolge: e.target.value }))} style={S.inp} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <label style={S.lbl}>Son Ziyaret</label>
              <input type="date" value={form.son_ziyaret} onChange={e => setForm(f => ({ ...f, son_ziyaret: e.target.value }))} style={S.inp} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <label style={S.lbl}>Durum</label>
              <select value={form.ziyaret_durumu} onChange={e => setForm(f => ({ ...f, ziyaret_durumu: e.target.value }))} style={{ ...S.inp, cursor: 'pointer' }}>
                <option value="ziyaret edilecek">⏳ Ziyaret Edilecek</option>
                <option value="ziyaret edildi">✅ Ziyaret Edildi</option>
              </select>
            </div>
            <div style={{ marginBottom: 18 }}>
              <label style={S.lbl}>Notlar</label>
              <textarea value={form.notlar} onChange={e => setForm(f => ({ ...f, notlar: e.target.value }))} rows={2} style={{ ...S.inp, resize: 'vertical' }} />
            </div>
            
            <div style={{ display: 'flex', gap: 10 }}>
              <button type="button" onClick={() => setShowAdd(false)} style={S.bCan}>İptal</button>
              <button type="button" onClick={save} disabled={saving || !form.firma_adi.trim()} style={{ ...S.bSav, background: C.navActive, opacity: (saving || !form.firma_adi.trim()) ? 0.5 : 1 }}>
                {saving ? 'Kaydediliyor…' : '💾 Kaydet'}
              </button>
            </div>
          </div>
        </div>
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
        <div>
          <h2 style={{ fontSize: 22, fontWeight: 900, color: C.txt }}>Müşteri Portföyü</h2>
          <p style={{ fontSize: 12, color: C.txt2, marginTop: 2 }}>{filtered.length} / {data.length} firma</p>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button type="button" onClick={exportXL} style={{ ...S.bCan, padding: '8px 14px', width: 'auto', display: 'flex', alignItems: 'center', gap: 5 }}>📊 Excel</button>
          <button type="button" onClick={openAdd} style={{ ...S.bSav, background: C.navActive, padding: '8px 16px', width: 'auto', display: 'flex', alignItems: 'center', gap: 5 }}>
            <IcoPlus size={16} /> Yeni Müşteri
          </button>
        </div>
      </div>

      {/* İlerleme Çubuğu */}
      <div style={{ background: C.surface, padding: '16px 20px', borderRadius: 16, border: `1px solid ${C.border}`, display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, fontWeight: 700, color: C.txt2 }}>
          <span>Genel Ziyaret İlerlemesi</span>
          <span style={{ color: C.green }}>% {visitedPct} Tamamlandı ({cntV}/{totalCustomers})</span>
        </div>
        <div style={{ height: 8, background: C.page, borderRadius: 4, overflow: 'hidden' }}>
          <div style={{ height: '100%', background: C.green, width: `${visitedPct}%`, transition: 'width 0.5s ease' }} />
        </div>
      </div>

      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <div style={{ position: 'relative', flex: 1, minWidth: 200 }}>
          <span style={{ position: 'absolute', left: 11, top: '50%', transform: 'translateY(-50%)', color: C.txt2, display: 'flex' }}><IcoSearch size={14} /></span>
          <input placeholder="Firma adı, bölge veya not ara…" value={q} onChange={e => setQ(e.target.value)} style={{ ...S.inp, paddingLeft: 34 }} />
        </div>
        <select value={sort} onChange={e => setSort(e.target.value)} style={{ ...S.inp, width: 'auto', cursor: 'pointer' }}>
          <option value="az">🔤 A-Z</option>
          <option value="late">📅 Son Ziyarete Göre</option>
          <option value="bolge">📍 Bölgeye Göre</option>
        </select>
      </div>

      <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
        {FILTERS.map(([val, lbl, cnt, col, bg]) => {
          const active = sf === val;
          return (
            <button key={val} type="button" onClick={() => setSf(val)}
              style={{
                padding: '6px 13px', borderRadius: 18, border: `2px solid ${active ? col : C.border}`,
                background: active ? bg : 'transparent', color: active ? col : C.txt2,
                fontSize: 12, fontWeight: 700, cursor: 'pointer', transition: 'all .15s', whiteSpace: 'nowrap'
              }}>
              {lbl} <span style={{ opacity: .7 }}>({cnt})</span>
            </button>
          );
        })}
      </div>

      {filtered.length === 0 ? (
        <div style={{ padding: 32, textAlign: 'center', color: C.txt2, background: C.surface, borderRadius: 16, border: `1px solid ${C.border}` }}>
          {q || sf !== 'all' ? 'Filtreye uyan kayıt yok.' : 'Henüz müşteri kaydı yok.'}
        </div>
      ) : (
        bolgeList.map(bolge => {
          const items = bolgeMap[bolge];
          const isOpen = openBolge.has(bolge) || q.length > 0 || sf !== 'all';
          const lateC = items.filter(m => lateLevel(m) !== null).length;
          
          return (
            <div key={bolge} style={S.card}>
              <div onClick={() => toggleBolge(bolge)}
                style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 18px', cursor: 'pointer', background: isOpen ? C.page : C.surface, borderBottom: isOpen ? `1px solid ${C.border2}` : 'none' }}>
                <span style={{ fontSize: 14, color: C.txt2, transition: 'transform .2s', transform: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)' }}>▼</span>
                <span style={{ fontSize: 13, fontWeight: 800, color: C.txt, flex: 1 }}>📍 {bolge}</span>
                <span style={{ background: C.tealS, color: C.teal, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 8 }}>{items.length} firma</span>
                {lateC > 0 && <span style={{ background: C.redS, color: C.red, fontSize: 10, fontWeight: 700, padding: '2px 7px', borderRadius: 7 }}>⏰ {lateC} geciken</span>}
              </div>
              
              {isOpen && items.map((m, i) => {
                const done = visited(m);
                const lv = lateLevel(m);
                const ds = daysSince(m.son_ziyaret);
                const isBusy = busy === m.id;
                
                return (
                  <div key={m.id || i}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 12, padding: '12px 18px',
                      borderBottom: i < items.length - 1 ? `1px solid ${C.border}` : 'none',
                      transition: 'background .15s', opacity: isBusy ? 0.5 : 1,
                      background: lv === 'red' ? 'rgba(153,27,27,.04)' : lv === 'amber' ? 'rgba(180,83,9,.04)' : 'transparent'
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = C.tealS}
                    onMouseLeave={e => e.currentTarget.style.background = lv === 'red' ? 'rgba(153,27,27,.04)' : lv === 'amber' ? 'rgba(180,83,9,.04)' : 'transparent'}>
                    
                    <div style={{ width: 34, height: 34, borderRadius: 9, background: done ? C.greenS : C.tealS, display: 'flex', alignItems: 'center', justifyContent: 'center', color: done ? C.green : C.teal, fontSize: 13, fontWeight: 800, flexShrink: 0 }}>
                      {(m.firma_adi || '?')[0]}
                    </div>
                    
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 13, color: C.txt, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {m.firma_adi}
                      </div>
                      <div style={{ display: 'flex', gap: 10, marginTop: 3, flexWrap: 'wrap', alignItems: 'center' }}>
                        {ds !== null && (
                          <span style={{ fontSize: 11, fontWeight: 700, color: lv === 'red' ? C.red : lv === 'amber' ? C.amber : C.green, fontFamily: 'monospace' }}>
                            {lv === 'red' ? '🔴' : lv === 'amber' ? '🟡' : '✅'} {ds} gün önce
                          </span>
                        )}
                        {m.notlar && <span style={{ fontSize: 11, color: C.txt2, fontStyle: 'italic', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 160 }}>📝 {m.notlar}</span>}
                      </div>
                    </div>
                    
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                      <button type="button" onClick={(e) => toggleVisitStatus(e, m)} disabled={isBusy} 
                        style={{ 
                          background: done ? C.greenS : (lv==='red'?C.redS:C.amberS), 
                          border: `1px solid ${done ? C.green : (lv==='red'?C.red:C.amber)}40`, 
                          color: done ? C.green : (lv==='red'?C.red:C.amber), 
                          borderRadius: 8, padding: '5px 10px', cursor: 'pointer', fontSize: 11, 
                          fontWeight: 700, whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: 4, transition: 'all 0.2s' 
                        }}
                      >
                        {done ? '✅ Ziyaret Edildi' : (lv === 'red' ? '🔴 Gecikti' : '⏳ Bekliyor')}
                      </button>
                      
                      <button type="button" onClick={(e) => openEdit(e, m)} disabled={isBusy} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.border2, padding: 5, borderRadius: 7 }} onMouseEnter={e => e.currentTarget.style.color = C.teal} onMouseLeave={e => e.currentTarget.style.color = C.border2}><IcoEdit size={14} /></button>
                      <button type="button" onClick={(e) => delItem(e, m)} disabled={isBusy} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.border2, padding: 5, borderRadius: 7 }} onMouseEnter={e => e.currentTarget.style.color = C.red} onMouseLeave={e => e.currentTarget.style.color = C.border2}><IcoTrash size={14} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })
      )}
    </div>
  );
}

// ── 3. NUMUNELER ─────────────────────────────────────────────────────
function SampleItem({ s, isVar, isSel, toggleSel, tbl, onRefresh, busy, setBusy, openEditModal, openPV, openPhotoInput, photoCache }) {
  const { note } = parseNoteTags(s.aciklama || '');
  const [localNote, setLocalNote] = useState(note);
  const [localStatus, setLocalStatus] = useState(s.durum || 'Beklemede');
  const isBusy = busy === s.id;

  useEffect(() => {
    setLocalStatus(s.durum || 'Beklemede');
  }, [s.durum]);

  const STATUSES = ['Beklemede', 'Takip Et', 'Gönderildi', 'Onaylandı', 'Reddedildi'];
  const SHORT = { Beklemede:'Bekle', 'Takip Et':'Takip', Gönderildi:'Gitti', Onaylandı:'Onay', Reddedildi:'Red' };
  const DCLR = {
    Beklemede:  [C.amberS, C.amber],
    'Takip Et': [C.tealS,  C.teal],
    Gönderildi: [C.blueS,  C.blue],
    Onaylandı:  [C.greenS, C.green],
    Reddedildi: [C.redS,   C.red],
  };

  const handleNoteBlur = async () => {
    if (localNote === note) return;
    setBusy(s.id);
    await db.from(tbl).update({ aciklama: localNote }).eq('id', s.id);
    await onRefresh();
    setBusy(null);
  };

  const handleNoteKeyDown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  };

  const handleStatusChange = async (e) => {
    const st = e.target.value;
    setLocalStatus(st);
    setBusy(s.id);
    await db.from(tbl).update({ durum: st, arsiv: false }).eq('id', s.id);
    await onRefresh();
    setBusy(null);
  };

  const toggleArchive = async () => {
    setBusy(s.id);
    await db.from(tbl).update({ arsiv: !s.arsiv }).eq('id', s.id);
    await onRefresh();
    setBusy(null);
  };

  const delItem = async () => {
    if (!window.confirm(`"${dN(s.numune)}" silinsin mi?`)) return;
    setBusy(s.id);
    await db.from(tbl).delete().eq('id', s.id);
    await onRefresh();
    setBusy(null);
  };

  const rawFiyat = getVal(s, ['fiyat', 'birimfiyat', 'price'], '');
  const fiyatStr = rawFiyat ? String(rawFiyat).replace(/^\$/, '') : '';
  const dateStr = fmtDate(s.updated_at || s.created_at || getVal(s, ['tarih', 'date'], ''));
  
  const photos = photoCache[s.id] || [];
  const hasPhoto = photos.length > 0;
  
  const [bg, col] = DCLR[localStatus] || [C.grayS, C.gray];

  return (
    <div style={{ 
      background: isSel ? 'rgba(8,145,178,.04)' : (isVar ? 'rgba(255,255,255,.5)' : C.surface),
      border: `1px solid ${isSel ? C.teal : (isVar ? 'transparent' : C.border)}`,
      borderLeft: isVar ? `3px solid ${C.border2}` : `3px solid ${col}`,
      borderRadius: 12, padding: '12px 16px', marginLeft: isVar ? 20 : 0,
      opacity: isBusy ? 0.6 : 1, transition: 'all .15s',
      display: 'flex', flexDirection: 'column', gap: 10
    }}>
      <div style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
        <input type="checkbox" checked={isSel} onChange={() => toggleSel(s.id)}
          style={{ width:16, height:16, cursor:'pointer', accentColor:C.teal, marginTop:2, flexShrink:0 }} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:6 }}>
            <h4 style={{ fontWeight:700, fontSize:14, color:C.txt, margin:0, display:'flex', alignItems:'center', gap:6 }}>
              {isVar && <span style={{color:C.txt2, opacity:0.6}}>↳</span>}
              {dN(s.numune) || 'İsimsiz'}
              {fiyatStr && <span style={{ color:C.green, fontWeight:800, fontFamily:'monospace', fontSize:12 }}>${fiyatStr}</span>}
            </h4>
            <span style={{ fontSize:11, color:C.txt2, fontFamily:'monospace', flexShrink:0 }}>{dateStr}</span>
          </div>
        </div>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', paddingLeft:26 }}>
        <input type="text" value={localNote} onChange={e => setLocalNote(e.target.value)} onBlur={handleNoteBlur} onKeyDown={handleNoteKeyDown} placeholder="Not ekle..."
          style={{ flex:1, minWidth:120, padding:'6px 10px', fontSize:12, borderRadius:8, border:`1px solid ${C.border2}`, outline:'none', color:C.txt, fontFamily:'Inter,sans-serif' }} />

        <select value={localStatus} disabled={isBusy} onChange={handleStatusChange}
          style={{ padding:'6px 10px', borderRadius:8, border:`1px solid ${col}`, background:bg, color:col, fontSize:12, fontWeight:700, cursor:'pointer', outline:'none' }}>
          {STATUSES.map(st => <option key={st} value={st}>{SHORT[st] || st}</option>)}
        </select>

        <div style={{ display:'flex', gap:4, flexShrink:0 }}>
          <button onClick={() => hasPhoto ? openPV(s.id, 0) : openPhotoInput(s.id)} title="Fotoğraflar"
            style={{ background:hasPhoto?bg:'none', border:hasPhoto?`1px solid ${col}`:'none', cursor:'pointer', color:hasPhoto?col:C.txt2, padding:6, borderRadius:8, display:'flex', alignItems:'center', gap:4 }}>
            <IcoCamera size={15}/> {hasPhoto && <span style={{fontSize:10,fontWeight:800}}>{photos.length}</span>}
          </button>
          <button onClick={() => openEditModal(s)} style={{ background:'none', border:'none', cursor:'pointer', color:C.txt2, padding:6, borderRadius:8 }} title="Düzenle"><IcoEdit size={15}/></button>
          <button onClick={toggleArchive} style={{ background:s.arsiv?C.grayS:'none', border:'none', cursor:'pointer', color:C.txt2, padding:6, borderRadius:8 }} title={s.arsiv?"Arşivden Çıkar":"Arşivle"}><IcoArchive size={15}/></button>
          <button onClick={delItem} style={{ background:'none', border:'none', cursor:'pointer', color:C.red, opacity:0.7, padding:6, borderRadius:8 }} title="Sil"><IcoTrash size={15}/></button>
        </div>
      </div>

      {hasPhoto && (
        <div style={{ display:'flex', gap:8, overflowX:'auto', paddingLeft:26, paddingBottom:4 }}>
          {photos.map((p, i) => (
            <img key={i} src={p.url} alt="Numune" loading="lazy" onClick={() => openPV(s.id, i)}
              style={{ width:40, height:40, objectFit:'cover', borderRadius:8, cursor:'pointer', border:`1px solid ${C.border}` }} />
          ))}
          <button onClick={() => openPhotoInput(s.id)} style={{ width:40, height:40, borderRadius:8, border:`1px dashed ${C.border2}`, background:C.page, color:C.txt2, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
        </div>
      )}
    </div>
  );
}

function SamplesView({ data, tbl, onRefresh }) {
  const [q, setQ] = useState('');
  const [sf, setSf] = useState('all');
  const [sort, setSort] = useState('date');
  const [busy, setBusy] = useState(null);
  
  const [showAdd, setShowAdd] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [firmaChangeModal, setFirmaChangeModal] = useState(null);
  const [bulkBusy, setBulkBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [selIds, setSelIds] = useState(new Set());
  
  const [photoCache, setPhotoCache] = useState({});
  const [pv, setPv] = useState({ open:false, photos:[], idx:0, numuneId:null });
  const [uploadProgress, setUploadProgress] = useState(null);
  const fileInputRef = useRef(null);
  const [activeUploadId, setActiveUploadId] = useState(null);

  const [form, setForm] = useState({ firma: '' });
  const [multiRows, setMultiRows] = useState([{ numune: '', fiyat: '', varyantlar: '', aciklama: '' }]);

  const firmalarList = useMemo(() => {
    return [...new Set(data.map(i => (i.firma||'').trim().toUpperCase()).filter(Boolean))].sort();
  }, [data]);

  const STATUSES = ['Beklemede','Takip Et','Gönderildi','Onaylandı','Reddedildi','Arşiv'];
  const SHORT = { Beklemede:'Bekle', 'Takip Et':'Takip', Gönderildi:'Gitti', Onaylandı:'Onay', Reddedildi:'Red', Arşiv:'Arşiv' };

  const isArsiv = (s) => s.arsiv === true;
  const getDur  = (s) => isArsiv(s) ? 'Arşiv' : (s.durum || 'Beklemede');

  const toggleSel = (id) => setSelIds(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const clearSel = () => setSelIds(new Set());

  const filtered = useMemo(() => {
    return data.filter(s => {
      if (sf === 'Arşiv') return isArsiv(s);
      if (sf !== 'all') { if (isArsiv(s) || getDur(s) !== sf) return false; } else { if (isArsiv(s)) return false; }
      if (q) {
        const Q = trl(q);
        if (!trl(s.firma||'').includes(Q) && !trl(s.numune||'').includes(Q) && !trl(s.aciklama||'').includes(Q)) return false;
      }
      return true;
    });
  }, [data, sf, q]);

  const groupedFirms = useMemo(() => {
    const G = new Map();
    filtered.forEach(s => {
      const fName = (s.firma || 'BELİRSİZ').toUpperCase();
      if (!G.has(fName)) G.set(fName, []);
      G.get(fName).push(s);
    });

    const sortedKeys = [...G.keys()].sort((a,b) => {
      if (sort === 'alpha') return a.localeCompare(b, 'tr');
      const maxA = Math.max(...G.get(a).map(i => new Date(i.updated_at || i.created_at || 0).getTime()));
      const maxB = Math.max(...G.get(b).map(i => new Date(i.updated_at || i.created_at || 0).getTime()));
      return maxB - maxA; 
    });

    const result = [];
    sortedKeys.forEach(firmaName => {
      let items = G.get(firmaName);
      if (sort === 'alpha') {
        items.sort((a,b) => (a.numune||'').localeCompare((b.numune||''), 'tr'));
      } else if (sort === 'status') {
        const ord = ['Beklemede','Takip Et','Gönderildi','Onaylandı','Reddedildi'];
        items.sort((a,b) => ord.indexOf(a.durum||'Beklemede') - ord.indexOf(b.durum||'Beklemede'));
      }
      
      const anaItems = items.filter(i => !isV(i.numune));
      const varItems = items.filter(i => isV(i.numune));
      const finalItems = [];
      const usedVarIds = new Set();

      anaItems.forEach(ana => {
        finalItems.push(ana);
        const anaKod = trl(dN(ana.numune));
        const altlar = varItems.filter(v => {
          if (usedVarIds.has(v.id)) return false;
          const { pc } = parseAc(v);
          if (pc && trl(pc) === anaKod) return true;
          const ac = trl(v.aciklama || '');
          return ac.startsWith(anaKod + '|') || ac === anaKod;
        });
        altlar.forEach(v => { usedVarIds.add(v.id); finalItems.push(v); });
      });
      varItems.filter(v => !usedVarIds.has(v.id)).forEach(v => finalItems.push(v));
      result.push({ firma: firmaName, items: finalItems });
    });
    return result;
  }, [filtered, sort]);

  const fetchPhotos = async (id) => {
    try {
      const { data: list, error } = await db.storage.from(BUCKET).list('numune_' + id, { sortBy: { column: 'created_at', order: 'asc' } });
      if (error) { console.error('Foto yükleme hatası:', error); return []; }
      if (!list) return [];
      return list.filter(f => f.name && !f.name.endsWith('/')).map(f => {
        const { data: ud } = db.storage.from(BUCKET).getPublicUrl('numune_' + id + '/' + f.name);
        return { name: f.name, url: ud.publicUrl, path: 'numune_' + id + '/' + f.name };
      });
    } catch(e) { console.error(e); return []; }
  };

  useEffect(() => {
    const loadPhotos = async () => {
      const ids = filtered.map(s => s.id);
      const needed = ids.filter(id => !(id in photoCache));
      if (needed.length > 0) {
        const newCache = { ...photoCache };
        for (const id of needed) {
          newCache[id] = await fetchPhotos(id);
        }
        setPhotoCache(newCache);
      }
    };
    loadPhotos();
  }, [filtered]);

  const handlePhotoSelect = async (e) => {
    const files = Array.from(e.target.files || []);
    const id = activeUploadId;
    if (!files.length || !id) return;
    
    for (let i = 0; i < files.length; i++) {
      setUploadProgress(`Yükleniyor (${i + 1}/${files.length})`);
      const file = files[i];
      const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
      const fname = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
      const { error } = await db.storage.from(BUCKET).upload('numune_' + id + '/' + fname, file);
      if (error) { alert('Fotoğraf yüklenemedi: ' + error.message); }
    }
    
    const newPhotos = await fetchPhotos(id);
    setPhotoCache(p => ({ ...p, [id]: newPhotos }));
    setUploadProgress(null); setActiveUploadId(null);
    if(fileInputRef.current) fileInputRef.current.value = '';
  };

  const deletePhoto = async (numuneId, path) => {
    setUploadProgress('Siliniyor...');
    await db.storage.from(BUCKET).remove([path]);
    const newP = await fetchPhotos(numuneId);
    setPhotoCache(p => ({ ...p, [numuneId]: newP }));
    if (pv.open) {
      if (newP.length === 0) setPv(p => ({...p, open:false}));
      else setPv(p => ({...p, photos: newP, idx: Math.min(p.idx, newP.length-1)}));
    }
    setUploadProgress(null);
  };

  const bulkStatus = async (ns) => {
    if (!selIds.size) return;
    setBulkBusy(true);
    const ids = [...selIds];
    if (ns === 'Arşiv') await db.from(tbl).update({ arsiv: true }).in('id', ids);
    else await db.from(tbl).update({ durum: ns, arsiv: false }).in('id', ids);
    setBulkBusy(false); clearSel(); await onRefresh();
  };

  const bulkDelete = async () => {
    if (!selIds.size || !window.confirm(selIds.size + ' numune silinsin mi?')) return;
    setBulkBusy(true);
    await db.from(tbl).delete().in('id', [...selIds]);
    setBulkBusy(false); clearSel(); await onRefresh();
  };

  const openAdd = () => {
    setForm({ firma: '' });
    setMultiRows([{ numune: '', fiyat: '', varyantlar: '', aciklama: '' }]);
    setEditItem(null); setShowAdd(true);
  };

  const openEdit = (s) => {
    setForm({ firma: s.firma || '' });
    setMultiRows([{ numune: dN(s.numune), fiyat: (s.fiyat||'').replace(/^\$/,''), varyantlar: '', aciklama: parseAc(s).note }]);
    setEditItem(s); setShowAdd(true);
  };

  const saveForm = async () => {
    if (!form.firma.trim()) return;
    setSaving(true);
    
    if (editItem) {
      const r = multiRows[0];
      const pr = r.fiyat.trim() ? (r.fiyat.startsWith('$') ? r.fiyat : '$' + r.fiyat) : '';
      await db.from(tbl).update({
        firma: form.firma.toUpperCase(),
        numune: isV(editItem.numune) ? '↳ ' + r.numune : r.numune,
        fiyat: pr, aciklama: buildAc(editItem, r.aciklama.trim())
      }).eq('id', editItem.id);
    } else {
      const pkg = [];
      multiRows.forEach(r => {
        if(!r.numune.trim()) return;
        const pr = r.fiyat.trim() ? (r.fiyat.startsWith('$') ? r.fiyat : '$' + r.fiyat) : '';
        pkg.push({ firma: form.firma.toUpperCase(), numune: r.numune.trim(), fiyat: pr, aciklama: r.aciklama.trim(), durum: 'Beklemede', arsiv: false });
        if (r.varyantlar.trim()) {
          r.varyantlar.split(',').forEach(v => {
            if(v.trim()) pkg.push({ firma: form.firma.toUpperCase(), numune: '↳ ' + v.trim(), fiyat: pr, aciklama: r.numune.trim() + '|' + r.aciklama.trim(), durum: 'Beklemede', arsiv: false });
          });
        }
      });
      if(pkg.length > 0) await db.from(tbl).insert(pkg);
    }
    
    setSaving(false); setShowAdd(false); await onRefresh();
  };

  const [mfOld, setMfOld] = useState(''); const [mfNew, setMfNew] = useState('');
  const saveFirmaChange = async () => {
    if(!mfNew.trim() || mfNew.toUpperCase() === mfOld.toUpperCase()) return;
    setBulkBusy(true);
    await db.from(tbl).update({ firma: mfNew.toUpperCase() }).eq('firma', mfOld);
    setFirmaChangeModal(null); setBulkBusy(false); await onRefresh();
  };

  const exportXL = async () => {
    if (!filtered.length) return;
    const dt = safeFileDate();
    const wb = new ExcelJS.Workbook(); const sh = wb.addWorksheet('Numuneler');
    sh.addRow(['FİRMA','NUMUNE','FİYAT','DURUM','NOTLAR','TARİH']);
    groupedFirms.forEach(g => {
      g.items.forEach(s => {
        sh.addRow([g.firma, (s.numune||''), s.fiyat||'', getDur(s), (s.aciklama||''), fmtDate(s.created_at||s.tarih)]);
      });
    });
    const buf = await wb.xlsx.writeBuffer(); const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf])); a.download = 'Numuneler_' + dt + '.xlsx'; a.click();
  };

  const counts = { all: data.filter(i=>!isArsiv(i)).length };
  STATUSES.forEach(st => { counts[st] = st === 'Arşiv' ? data.filter(i => isArsiv(i)).length : data.filter(i => !isArsiv(i) && getDur(i) === st).length; });

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:14, position:'relative' }}>
      <input type="file" ref={fileInputRef} accept="image/*" multiple onChange={handlePhotoSelect} style={{display:'none'}} />
      {uploadProgress && (
        <div style={{ position:'fixed', top:20, right:20, zIndex:1000, background:C.sHead, color:'#fff', padding:'10px 16px', borderRadius:10, display:'flex', alignItems:'center', gap:10 }}>
          <span className="ypSpin"><IcoRefresh size={16}/></span> {uploadProgress}
        </div>
      )}

      {/* Fotoğraf Görüntüleyici */}
      {pv.open && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.9)', zIndex:2000, display:'flex', flexDirection:'column' }}>
          <div style={{ padding:20, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ color:'#fff', fontWeight:700 }}>{pv.idx + 1} / {pv.photos.length}</span>
            <button onClick={() => setPv(p=>({...p, open:false}))} style={{ background:'rgba(255,255,255,.2)', border:'none', color:'#fff', padding:8, borderRadius:'50%', cursor:'pointer' }}><IcoX size={20}/></button>
          </div>
          <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', padding:20, position:'relative' }}>
            {pv.photos.length > 1 && <button onClick={()=>setPv(p=>({...p, idx:Math.max(0, p.idx-1)}))} disabled={pv.idx===0} style={{ position:'absolute', left:20, zIndex:10, background:'rgba(255,255,255,.2)', border:'none', color:'#fff', padding:14, borderRadius:'50%', cursor:'pointer', opacity:pv.idx===0?0.3:1 }}>❮</button>}
            <img src={pv.photos[pv.idx]?.url} style={{ maxWidth:'100%', maxHeight:'100%', objectFit:'contain' }} />
            {pv.photos.length > 1 && <button onClick={()=>setPv(p=>({...p, idx:Math.min(pv.photos.length-1, p.idx+1)}))} disabled={pv.idx===pv.photos.length-1} style={{ position:'absolute', right:20, zIndex:10, background:'rgba(255,255,255,.2)', border:'none', color:'#fff', padding:14, borderRadius:'50%', cursor:'pointer', opacity:pv.idx===pv.photos.length-1?0.3:1 }}>❯</button>}
          </div>
          <div style={{ padding:20, display:'flex', justifyContent:'center' }}>
            <button onClick={() => { if(window.confirm('Bu fotoğrafı silmek istiyor musunuz?')) deletePhoto(pv.numuneId, pv.photos[pv.idx].path); }} 
              style={{ background:'#DC2626', color:'#fff', border:'none', padding:'10px 20px', borderRadius:10, fontWeight:700, cursor:'pointer' }}>
              🗑️ Fotoğrafı Sil
            </button>
          </div>
        </div>
      )}

      {/* Firma Değiştirme Modalı */}
      {firmaChangeModal && (
        <div onClick={e=>e.target===e.currentTarget&&setFirmaChangeModal(null)} style={S.mOv}>
          <div style={{...S.mBx, maxWidth:400}}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}><h3 style={{ fontSize:17, fontWeight:800 }}>🏢 Firma Değiştir</h3><button onClick={()=>setFirmaChangeModal(null)} style={{ background:'none', border:'none', cursor:'pointer' }}><IcoX/></button></div>
            <p style={{ fontSize:12, color:C.txt2, marginBottom:16 }}>"{mfOld}" firmasındaki tüm numuneler yeni firmaya taşınacak.</p>
            <div style={{ marginBottom:16 }}><label style={S.lbl}>YENİ FİRMA</label><FirmaInput value={mfNew} onChange={setMfNew} firmalar={firmalarList} /></div>
            <div style={{ display:'flex', gap:10 }}><button onClick={()=>setFirmaChangeModal(null)} style={S.bCan}>İptal</button><button onClick={saveFirmaChange} disabled={bulkBusy || !mfNew.trim()} style={{...S.bSav, background:C.navActive, opacity:(bulkBusy||!mfNew)?0.5:1}}>Değiştir</button></div>
          </div>
        </div>
      )}

      {/* Yeni / Düzenle Modal */}
      {showAdd && (
        <div onClick={e=>e.target===e.currentTarget&&setShowAdd(false)} style={S.mOv}>
          <div style={{...S.mBx, maxWidth:500}}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:18 }}><h3 style={{ fontSize:17, fontWeight:800 }}>{editItem ? (isV(editItem.numune)?'✏️ Varyant Düzenle':'✏️ Numune Düzenle') : '📦 Yeni Numune'}</h3><button onClick={()=>setShowAdd(false)} style={{ background:'none', border:'none', cursor:'pointer' }}><IcoX/></button></div>
            {!editItem && <div style={{ marginBottom:16 }}><label style={S.lbl}>FİRMA ADI *</label><FirmaInput value={form.firma} onChange={v=>setForm({firma:v})} firmalar={firmalarList} /></div>}
            
            {multiRows.map((r, i) => (
              <div key={i} style={{ background:C.page, padding:14, borderRadius:12, marginBottom:12, position:'relative' }}>
                {!editItem && multiRows.length > 1 && <button onClick={()=>setMultiRows(prev=>prev.filter((_,idx)=>idx!==i))} style={{ position:'absolute', top:8, right:8, background:'none', border:'none', color:C.red, cursor:'pointer' }}><IcoX size={16}/></button>}
                <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:10, marginBottom:10 }}>
                  <div><label style={S.lbl}>KOD / ÜRÜN *</label><input value={r.numune} onChange={e=>setMultiRows(prev=>prev.map((row,idx)=>idx===i?{...row,numune:e.target.value}:row))} placeholder="YT-1001" style={S.inp} /></div>
                  <div><label style={S.lbl}>FİYAT ($)</label><input type="number" step="0.01" value={r.fiyat} onChange={e=>setMultiRows(prev=>prev.map((row,idx)=>idx===i?{...row,fiyat:e.target.value}:row))} placeholder="25.50" style={{...S.inp, fontFamily:'monospace', textAlign:'right'}} /></div>
                </div>
                {!editItem && <div style={{ marginBottom:10 }}><label style={S.lbl}>VARYANTLAR (VİRGÜLLÜ)</label><input value={r.varyantlar} onChange={e=>setMultiRows(prev=>prev.map((row,idx)=>idx===i?{...row,varyantlar:e.target.value}:row))} placeholder="Siyah, Gri" style={S.inp} /></div>}
                <div><label style={S.lbl}>NOT</label><input value={r.aciklama} onChange={e=>setMultiRows(prev=>prev.map((row,idx)=>idx===i?{...row,aciklama:e.target.value}:row))} placeholder="İsteğe bağlı..." style={S.inp} /></div>
              </div>
            ))}
            {!editItem && <button onClick={()=>setMultiRows(prev=>[...prev, { numune: '', fiyat: '', varyantlar: '', aciklama: '' }])} style={{ width:'100%', padding:10, border:`1px dashed ${C.teal}`, background:C.tealS, color:C.teal, borderRadius:10, fontWeight:700, cursor:'pointer', marginBottom:16 }}>+ BİR SATIR DAHA EKLE</button>}
            
            <div style={{ display:'flex', gap:10 }}><button onClick={()=>setShowAdd(false)} style={S.bCan}>İptal</button><button onClick={saveForm} disabled={saving || (!editItem && !form.firma.trim())} style={{...S.bSav, background:'linear-gradient(135deg,#C2410C,#EA580C)', opacity:saving?0.5:1}}>💾 Kaydet</button></div>
          </div>
        </div>
      )}

      {/* Başlık, Arama, Filtreler */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
        <div><h2 style={{ fontSize:22, fontWeight:900, color:C.txt }}>Numune Takibi</h2><p style={{ fontSize:12, color:C.txt2, marginTop:2 }}>{filtered.length} / {counts.all} kayıt</p></div>
        <div style={{ display:'flex', gap:8 }}><button onClick={exportXL} style={{...S.bCan, width:'auto', padding:'8px 14px'}}>📊 Excel</button><button onClick={()=>openAdd()} style={{...S.bSav, width:'auto', background:'linear-gradient(135deg,#C2410C,#EA580C)', display:'flex', alignItems:'center', gap:5, padding:'8px 16px'}}><IcoPlus size={16}/> Yeni</button></div>
      </div>

      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}><span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2 }}><IcoSearch size={14}/></span><input placeholder="Firma, kod veya not ara…" value={q} onChange={e=>setQ(e.target.value)} style={{...S.inp, paddingLeft:34}} /></div>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{...S.inp, width:'auto'}}><option value="date">⏱ Tarihe Göre</option><option value="alpha">🔤 A-Z Sıralı</option><option value="status">🔵 Duruma Göre</option></select>
      </div>

      <div style={{ display:'flex', gap:7, flexWrap:'wrap' }}>
        {[['all','Tümü',counts.all,'#0891B2','rgba(8,145,178,.1)'],['Beklemede','⏳ Bekle',counts['Beklemede'],'#B45309','rgba(217,119,6,.12)'],['Takip Et','👀 Takip',counts['Takip Et'],'#0891B2','rgba(8,145,178,.12)'],['Gönderildi','🚀 Gitti',counts['Gönderildi'],'#1D4ED8','rgba(29,78,216,.12)'],['Onaylandı','✅ Onay',counts['Onaylandı'],'#15803D','rgba(21,128,61,.12)'],['Reddedildi','❌ Red',counts['Reddedildi'],'#991B1B','rgba(153,27,27,.12)'],['Arşiv','📂 Arşiv',counts['Arşiv'],'#475569','rgba(71,85,105,.12)']].map(([val,lbl,cnt,col,bg])=>{
          const active = sf === val;
          return <button key={val} onClick={()=>setSf(active&&val!=='all'?'all':val)} style={{ padding:'6px 13px', borderRadius:18, border:`2px solid ${active?col:C.border}`, background:active?bg:'transparent', color:active?col:C.txt2, fontSize:12, fontWeight:700, cursor:'pointer', transition:'all .15s', whiteSpace:'nowrap' }}>{lbl} <span style={{ opacity:.7 }}>{cnt}</span></button>;
        })}
      </div>

      {/* Seçim İşlem Çubuğu */}
      {selIds.size > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 14px', background:'#1E293B', borderRadius:12, flexWrap:'wrap', position:'sticky', top:10, zIndex:20 }}>
          <span style={{ fontSize:13, fontWeight:700, color:'#fff', flex:1 }}>✅ {selIds.size} seçili</span>
          {['Beklemede','Takip Et','Gönderildi','Onaylandı','Reddedildi','Arşiv'].map(st => (
            <button key={st} onClick={()=>bulkStatus(st)} disabled={bulkBusy} style={{ padding:'6px 12px', borderRadius:8, border:'none', background:{ Beklemede:'#B45309', 'Takip Et':'#0891B2', Gönderildi:'#1D4ED8', Onaylandı:'#15803D', Reddedildi:'#991B1B', Arşiv:'#475569' }[st], color:'#fff', fontSize:11, fontWeight:700, cursor:'pointer' }}>{SHORT[st]}</button>
          ))}
          <button onClick={bulkDelete} disabled={bulkBusy} style={{ padding:'5px 10px', borderRadius:8, border:'1px solid #DC2626', background:'transparent', color:'#DC2626', fontSize:11, fontWeight:700, cursor:'pointer' }}>🗑 Sil</button>
          <button onClick={clearSel} style={{ padding:'5px 10px', borderRadius:8, border:'1px solid #475569', background:'transparent', color:'#94A3B8', fontSize:11, cursor:'pointer' }}>İptal</button>
        </div>
      )}

      {/* Listeleme */}
      <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
        {groupedFirms.length === 0 ? (
          <div style={{ padding:40, textAlign:'center', color:C.txt2, background:C.surface, borderRadius:16, border:`1px solid ${C.border}` }}>Filtreye uyan kayıt yok.</div>
        ) : (
          groupedFirms.map((g, gi) => (
            <div key={gi} style={{ background:C.surface, borderRadius:16, border:`1px solid ${C.border}`, overflow:'hidden' }}>
              <div style={{ padding:'14px 20px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', alignItems:'center', background:C.page }}>
                <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                  <span style={{ fontSize:15, fontWeight:800, color:C.txt }}>🏢 {g.firma}</span>
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ fontSize:11, fontWeight:700, color:C.teal, background:C.tealS, padding:'3px 8px', borderRadius:8 }}>{g.items.length} Kayıt</span>
                  <button onClick={()=>{setMfOld(g.firma); setMfNew(g.firma); setFirmaChangeModal(g.firma)}} style={{ background:'none', border:'none', color:C.txt2, cursor:'pointer', padding:4 }} title="Firma Değiştir"><IcoEdit size={16}/></button>
                </div>
              </div>
              <div style={{ padding:'12px 16px', display:'flex', flexDirection:'column', gap:8 }}>
                {g.items.map((s, si) => (
                  <SampleItem key={s.id||si} s={s} isVar={isV(s.numune)} isSel={selIds.has(s.id)} toggleSel={toggleSel} tbl={tbl} onRefresh={onRefresh} busy={busy} setBusy={setBusy} openEditModal={openEdit} openPhotoInput={(id)=>{setActiveUploadId(id); fileInputRef.current?.click();}} openPV={(id, idx)=>setPv({open:true, photos:photoCache[id], idx, numuneId:id})} photoCache={photoCache} firmalarList={firmalarList} />
                ))}
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

// ── 4. FİYATLAR ──────────────────────────────────────────────────────
function PricesView({ data, onRefresh }) {
  const [q, setQ] = useState('');
  const [priceFilter, setPriceFilter] = useState('all');
  const [busy, setBusy] = useState(null);
  
  const [modal, setModal] = useState(null);
  const [editPrice, setEditPrice] = useState(null);
  const [saving, setSaving] = useState(false);
  const [bulkModal, setBulkModal] = useState(false);
  
  const [bulkType, setBulkType] = useState('pct_up');
  const [bulkVal, setBulkVal] = useState('');
  const [bulkBusy, setBulkBusy] = useState(false);
  
  const [selIds, setSelIds] = useState(new Set());
  const [openCats, setOpenCats] = useState(new Set());
  
  const [form, setForm] = useState({ urun_kodu: '', denye: '', pesin_fiyat: '', bolum_adi: '' });
  
  const [showChartModal, setShowChartModal] = useState(false);

  const G = useMemo(() => {
    const map = {};
    let cur = 'Genel';
    map[cur] = { hdr: null, items: [] };

    const sorted = [...(data || [])].sort((a, b) => (a.id || 0) - (b.id || 0));
    
    sorted.forEach(p => {
      if (p.bolum_adi) {
        const b = p.bolum_adi;
        if (!map[b]) map[b] = { hdr: null, items: [] };
        map[b].items.push(p);
      } 
      else if (!p.denye && !p.bolum_adi) {
        cur = p.urun_kodu || 'Bölümsüz';
        if (!map[cur]) map[cur] = { hdr: p, items: [] };
      } 
      else {
        if (!map[cur]) map[cur] = { hdr: null, items: [] };
        map[cur].items.push(p);
      }
    });

    if (map['Genel'] && map['Genel'].items.length === 0 && !map['Genel'].hdr) {
      delete map['Genel'];
    }
    return map;
  }, [data]);
  
  const allItems = useMemo(() => Object.keys(G).flatMap(k => G[k].items), [G]);
  const totalPriced = allItems.filter(p => p.pesin_fiyat > 0).length;
  const totalUnpriced = allItems.filter(p => !p.pesin_fiyat).length;
  
  const save = async () => {
    if (!form.urun_kodu.trim()) return;
    setSaving(true);
    const pf = parseFloat(form.pesin_fiyat) || 0;
    const pay = { 
      urun_kodu: form.urun_kodu.trim().toUpperCase(), 
      denye: form.denye.trim() || null, 
      pesin_fiyat: pf, 
      vadeli_fiyat: pf > 0 ? parseFloat((pf + 0.10).toFixed(4)) : 0, 
      bolum_adi: form.bolum_adi.trim().toUpperCase() || null,
      updated_at: new Date().toISOString()
    };
    
    if (modal === 'new') await db.from('fiyatlar').insert([pay]);
    else await db.from('fiyatlar').update(pay).eq('id', modal.id);
    
    setSaving(false); setModal(null); await onRefresh();
  };

  const delItem = async (p) => {
    if (window.confirm(`"${p.urun_kodu}" silinsin mi?`)) {
      setBusy(p.id); 
      await db.from('fiyatlar').delete().eq('id', p.id); 
      await onRefresh(); 
      setBusy(null);
    }
  };

  const commitEdit = async (p) => {
    const nv = parseFloat(editPrice.v);
    if (isNaN(nv)) { setEditPrice(null); return; }
    setBusy(p.id);
    await db.from('fiyatlar').update({ 
      pesin_fiyat: nv, 
      vadeli_fiyat: parseFloat((nv + 0.10).toFixed(4)),
      updated_at: new Date().toISOString()
    }).eq('id', p.id);
    setEditPrice(null); await onRefresh(); setBusy(null);
  };

  const doBulkUpdate = async () => {
    const v = parseFloat(bulkVal);
    if (isNaN(v) || v <= 0) return;
    const targets = selIds.size > 0 ? allItems.filter(p => selIds.has(p.id) && p.pesin_fiyat > 0) : allItems.filter(p => p.pesin_fiyat > 0);
    if (!targets.length) return;
    
    setBulkBusy(true);
    for (const p of targets) {
      let nv = p.pesin_fiyat;
      if (bulkType === 'pct_up')   nv = p.pesin_fiyat * (1 + v / 100);
      if (bulkType === 'pct_dn')   nv = p.pesin_fiyat * (1 - v / 100);
      if (bulkType === 'fixed_up') nv = p.pesin_fiyat + v;
      if (bulkType === 'fixed_dn') nv = Math.max(0, p.pesin_fiyat - v);
      
      await db.from('fiyatlar').update({ 
        pesin_fiyat: parseFloat(nv.toFixed(4)), 
        vadeli_fiyat: parseFloat((nv + 0.10).toFixed(4)),
        updated_at: new Date().toISOString()
      }).eq('id', p.id);
    }
    setBulkBusy(false); setBulkModal(false); setSelIds(new Set()); setBulkVal(''); await onRefresh();
  };

  const bulkPreview = () => {
    const v = parseFloat(bulkVal);
    if (isNaN(v) || v <= 0) return null;
    const sample = allItems.find(p => (selIds.size > 0 ? selIds.has(p.id) : true) && p.pesin_fiyat > 0);
    if (!sample) return null;
    let nv = sample.pesin_fiyat;
    if (bulkType === 'pct_up')   nv = sample.pesin_fiyat * (1 + v / 100);
    if (bulkType === 'pct_dn')   nv = sample.pesin_fiyat * (1 - v / 100);
    if (bulkType === 'fixed_up') nv = sample.pesin_fiyat + v;
    if (bulkType === 'fixed_dn') nv = Math.max(0, sample.pesin_fiyat - v);
    return { urun: sample.urun_kodu, eski: sample.pesin_fiyat.toFixed(2), yeni: nv.toFixed(2) };
  };

  const exportXL = async (wP) => {
    const items = selIds.size > 0 ? allItems.filter(p => selIds.has(p.id)) : allItems.filter(p => wP ? true : !p.pesin_fiyat);
    if (!items.length) return;
    
    const dt = safeFileDate();
    const wb = new ExcelJS.Workbook();
    const sh = wb.addWorksheet(wP ? 'Fiyat Listesi' : 'Eksik Fiyatlar', { pageSetup: { paperSize: 9, orientation: 'landscape' } });
    
    const colCount = wP ? 5 : 3;
    sh.mergeCells(1, 1, 1, colCount);
    const tc = sh.getCell('A1');
    tc.value = (wP ? 'YANTEKS FİYAT LİSTESİ' : 'EKSİK FİYATLAR') + ' (' + dt + ')';
    tc.font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
    tc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: wP ? 'FF14532D' : 'FFB45309' } };
    tc.alignment = { horizontal: 'center', vertical: 'middle' };
    sh.getRow(1).height = 30;
    
    const hdrs = wP ? ['ÜRÜN ADI', 'DENYE', 'PEŞİN ($)', '90 GÜN ($)', '180 GÜN ($)'] : ['ÜRÜN ADI', 'DENYE', 'BÖLÜM'];
    const hr = sh.addRow(hdrs);
    hr.eachCell(c => { 
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF166534' } }; 
      c.font = { color: { argb: 'FFFFFFFF' }, bold: true }; 
      c.alignment = { horizontal: 'center', vertical: 'middle' }; 
    });
    hr.height = 24;
    sh.columns = wP ? [{ width: 35 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 }] : [{ width: 35 }, { width: 15 }, { width: 25 }];
    
    let curBolum = '';
    items.forEach(p => {
      if (p.bolum_adi && p.bolum_adi !== curBolum) {
        curBolum = p.bolum_adi;
        const r = sh.addRow(['📂 ' + curBolum]);
        sh.mergeCells(r.number, 1, r.number, colCount);
        r.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F7F2' } };
        r.getCell(1).font = { bold: true, color: { argb: 'FF14532D' }, size: 11 };
        r.height = 22;
      }
      const c = p.pesin_fiyat || 0;
      const row = sh.addRow(wP
        ? [p.urun_kodu || '', p.denye || '-', c ? c.toFixed(2) + ' $' : '-', c ? (c + 0.10).toFixed(2) + ' $' : '-', c ? (c + 0.20).toFixed(2) + ' $' : '-']
        : [p.urun_kodu || '', p.denye || '-', p.bolum_adi || '-']);
      row.getCell(1).font = { bold: true };
      if (wP && c > 0) { 
        row.getCell(3).font = { color: { argb: 'FF15803D' }, bold: true }; 
        row.getCell(3).alignment = { horizontal: 'right' }; 
      }
    });
    
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = 'Yanteks_' + (wP ? 'Fiyat' : 'Eksik') + '_' + dt + '.xlsx';
    a.click();
  };

  // --- Grafik Componenti ---
  const PriceChartModal = ({ data, onClose }) => {
    const canvasRef = useRef(null);
    useEffect(() => {
      if (!canvasRef.current) return;
      const priced = data.filter(d => d.pesin_fiyat > 0).sort((a,b) => b.pesin_fiyat - a.pesin_fiyat).slice(0, 15);
      const chart = new window.Chart(canvasRef.current, {
        type: 'bar',
        data: {
          labels: priced.map(d => (d.urun_kodu || '').substring(0, 15)),
          datasets: [{ label: 'Peşin Fiyat ($)', data: priced.map(d => d.pesin_fiyat), backgroundColor: '#0891B2', borderRadius: 6 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
      return () => chart.destroy();
    }, [data]);

    return (
      <div style={S.mOv} onClick={onClose}>
        <div style={{ ...S.mBx, maxWidth: 800, height: 500, display: 'flex', flexDirection: 'column' }} onClick={e => e.stopPropagation()}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
            <h3 style={{ fontSize: 17, fontWeight: 800 }}>📊 Fiyat Analizi (En Yüksek 15 Ürün)</h3>
            <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer' }}><IcoX size={20}/></button>
          </div>
          <div style={{ flex: 1, position: 'relative' }}>
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      </div>
    );
  };

  return(
    <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
      
      {showChartModal && <PriceChartModal data={allItems} onClose={() => setShowChartModal(false)} />}
      
      {/* Toplu Güncelle Modal */}
      {bulkModal && (
        <div onClick={e => e.target === e.currentTarget && setBulkModal(false)} style={S.mOv}>
          <div style={{ ...S.mBx, maxWidth: 400 }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}>
              <h3 style={{ fontSize:17, fontWeight:800, color:C.txt }}>📈 Toplu Fiyat Güncelle</h3>
              <button onClick={() => setBulkModal(false)} style={{ background:'none', border:'none', cursor:'pointer', color:C.txt2 }}><IcoX size={20}/></button>
            </div>
            <p style={{ fontSize:12, color:C.txt2, marginBottom:16 }}>
              {selIds.size > 0 ? `${selIds.size} seçili ürüne` : 'Tüm fiyatlı ürünlere'} uygulanacak.
            </p>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:16 }}>
              {[
                { k:'pct_up', l:'% Artış', icon:'📈' },
                { k:'pct_dn', l:'% Azalış', icon:'📉' },
                { k:'fixed_up', l:'$ Artış', icon:'➕' },
                { k:'fixed_dn', l:'$ Azalış', icon:'➖' }
              ].map(o => (
                <button key={o.k} onClick={() => setBulkType(o.k)}
                  style={{ padding:'10px 8px', borderRadius:10, border:`2px solid ${bulkType === o.k ? C.green : C.border2}`, background:bulkType === o.k ? C.greenS : 'none', color:bulkType === o.k ? C.green : C.txt, fontWeight:bulkType === o.k ? 800 : 500, fontSize:13, cursor:'pointer', transition:'all .15s' }}>
                  {o.icon} {o.l}
                </button>
              ))}
            </div>
            <div style={{ marginBottom:14 }}>
              <label style={S.lbl}>{bulkType.startsWith('pct') ? 'Yüzde (%)' : 'Miktar ($)'}</label>
              <input type="number" step="0.01" min="0" value={bulkVal} onChange={e => setBulkVal(e.target.value)} placeholder="0.00" style={{ ...S.inp, fontSize:15, fontFamily:'monospace', textAlign:'right' }} />
            </div>
            {(() => { 
              const pr = bulkPreview(); 
              return pr && (
                <div style={{ padding:'10px 14px', background:C.greenS, borderRadius:10, marginBottom:14, border:`1px solid rgba(21,128,61,.2)`, fontSize:12 }}>
                  <span style={{ color:C.txt2 }}>Örnek: </span><span style={{ fontWeight:700, color:C.txt, fontFamily:'monospace' }}>{pr.urun}</span>
                  <span style={{ color:C.txt2 }}> → </span><span style={{ color:C.txt2, fontFamily:'monospace', textDecoration:'line-through' }}>${pr.eski}</span>
                  <span style={{ color:C.txt2 }}> → </span><span style={{ color:C.green, fontFamily:'monospace', fontWeight:800 }}>${pr.yeni}</span>
                </div>
              ); 
            })()}
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => setBulkModal(false)} style={S.bCan}>İptal</button>
              <button onClick={doBulkUpdate} disabled={bulkBusy || !bulkVal || parseFloat(bulkVal) <= 0} style={{ ...S.bSav, background:C.green, opacity: bulkBusy || !bulkVal || parseFloat(bulkVal) <= 0 ? 0.5 : 1 }}>
                {bulkBusy ? 'Güncelleniyor…' : '✅ Güncelle'}
              </button>
            </div>
          </div>
        </div>
      )}
      
      {/* Ekle / Düzenle Modal */}
      {modal && (
        <div onClick={e => e.target === e.currentTarget && setModal(null)} style={S.mOv}>
          <div style={S.mBx}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}>
              <h3 style={{ fontSize:17, fontWeight:800 }}>{modal === 'new' ? '➕ Yeni Ürün' : '✏️ Düzenle'}</h3>
              <button onClick={() => setModal(null)} style={{ background:'none', border:'none', cursor:'pointer' }}><IcoX size={20}/></button>
            </div>
            {[['Ürün Kodu *','urun_kodu'], ['Denye','denye'], ['Bölüm','bolum_adi']].map(([l,k]) => (
              <div key={k} style={{ marginBottom:12 }}>
                <label style={S.lbl}>{l}</label>
                <input value={form[k]} onChange={e => setForm(f => ({ ...f, [k]: e.target.value }))} style={S.inp} />
              </div>
            ))}
            <div style={{ marginBottom:18 }}>
              <label style={S.lbl}>Peşin Fiyat ($)</label>
              <input type="number" step="0.01" min="0" value={form.pesin_fiyat} onChange={e => setForm(f => ({ ...f, pesin_fiyat: e.target.value }))} style={{ ...S.inp, fontFamily:'monospace' }} />
              {form.pesin_fiyat && (
                <p style={{ fontSize:11, color:C.txt2, marginTop:4 }}>
                  90 gün vadeli: ${((parseFloat(form.pesin_fiyat) || 0) + 0.10).toFixed(2)} · 180 gün: ${((parseFloat(form.pesin_fiyat) || 0) + 0.20).toFixed(2)}
                </p>
              )}
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => setModal(null)} style={S.bCan}>İptal</button>
              <button onClick={save} disabled={saving || !form.urun_kodu.trim()} style={{ ...S.bSav, background:C.green, opacity: saving || !form.urun_kodu.trim() ? 0.5 : 1 }}>
                Kaydet
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Başlık ve Aksiyonlar */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:900, color:C.txt }}>İplik Fiyatları</h2>
          <p style={{ fontSize:12, color:C.txt2, marginTop:2 }}>{Object.keys(G).length} bölüm · {allItems.length} ürün</p>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={() => setShowChartModal(true)} style={{ ...S.bCan, background:C.navActive, color:'#fff', border:'none', display:'flex', alignItems:'center', gap:5 }}>
            📊 Grafik
          </button>
          <button onClick={() => setBulkModal(true)} style={{ ...S.bCan, background:C.navActive, color:'#fff', border:'none', display:'flex', alignItems:'center', gap:5 }}>
            📈 Toplu Güncelle
          </button>
          <button onClick={() => { setForm({ urun_kodu:'', denye:'', pesin_fiyat:'', bolum_adi:'' }); setModal('new'); }} style={{ ...S.bSav, background:C.green, width:'auto', display:'flex', alignItems:'center', gap:5 }}>
            <IcoPlus size={16}/> Yeni Ürün
          </button>
        </div>
      </div>

      {/* Arama ve Filtreler */}
      <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:C.txt2 }}><IcoSearch size={14}/></span>
          <input placeholder="Ürün kodu veya denye ara…" value={q} onChange={e => setQ(e.target.value)} style={{ ...S.inp, paddingLeft:34 }} />
        </div>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
        {[
          { key:'all', label:'Tümü', count: allItems.length },
          { key:'priced', label:'🟢 Fiyatlı', count: totalPriced },
          { key:'unpriced', label:'⚠️ Fiyatsız', count: totalUnpriced },
        ].map(chip => (
          <button key={chip.key} onClick={() => setPriceFilter(chip.key)}
            style={{ padding:'5px 13px', borderRadius:20, border:`1px solid ${priceFilter === chip.key ? C.green : C.border2}`, background:priceFilter === chip.key ? C.greenS : 'none', color:priceFilter === chip.key ? C.green : C.txt2, fontWeight:priceFilter === chip.key ? 700 : 500, fontSize:12, cursor:'pointer', transition:'all .15s' }}>
            {chip.label} <span style={{ fontSize:11, opacity:.7 }}>({chip.count})</span>
          </button>
        ))}
        <div style={{ flex:1 }}/>
        <button onClick={() => exportXL(true)} style={{ padding:'6px 13px', borderRadius:8, border:`1px solid ${C.green}`, background:C.greenS, color:C.green, fontWeight:700, fontSize:11, cursor:'pointer' }}>📊 Fiyatlı Excel</button>
        <button onClick={() => exportXL(false)} style={{ padding:'6px 13px', borderRadius:8, border:`1px solid ${C.amber}`, background:C.amberS, color:C.amber, fontWeight:700, fontSize:11, cursor:'pointer' }}>⚠️ Fiyatsız Excel</button>
      </div>
      
      {/* Seçim İşlem Çubuğu */}
      {selIds.size > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 16px', background:C.greenS, borderRadius:12, border:`1px solid rgba(21,128,61,.2)` }}>
          <span style={{ fontSize:13, fontWeight:700, color:C.green, flex:1 }}>✅ {selIds.size} ürün seçili</span>
          <button onClick={() => setBulkModal(true)} style={{ padding:'6px 13px', borderRadius:8, border:`1px solid #0891B2`, background:'#fff', color:'#0891B2', fontWeight:700, fontSize:11, cursor:'pointer' }}>📈 Toplu Güncelle</button>
          <button onClick={() => exportXL(true)} style={{ padding:'6px 13px', borderRadius:8, border:`1px solid ${C.green}`, background:'#fff', color:C.green, fontWeight:700, fontSize:11, cursor:'pointer' }}>📊 Excel</button>
          <button onClick={() => setSelIds(new Set())} style={{ padding:'6px 13px', borderRadius:8, border:`1px solid ${C.border2}`, background:'none', color:C.txt2, fontWeight:600, fontSize:11, cursor:'pointer' }}>Temizle</button>
        </div>
      )}

      {/* Akordeon Listeler */}
      {Object.keys(G).sort().map(c => {
        const hdr = G[c].hdr;

                      <th style={{ ...S.th, textAlign:'center' }}>İşlem</th>

                  </thead>
                  <tbody>
                    {fi.map(p => {
                      const bI = busy === p.id;
                      const iE = editPrice && editPrice.id === p.id;
                      const pf = p.pesin_fiyat;
                      const tm = p.updated_at ? new Date(p.updated_at).toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
                      
                      return (
                        <tr key={p.id} className="hov-row" style={{ opacity:bI ? 0.5 : 1, background:selIds.has(p.id) ? 'rgba(22,163,74,.06)' : 'none', borderBottom:`1px solid ${C.border}` }}>
                          <td style={{ ...S.td, textAlign:'center' }}><input type="checkbox" checked={selIds.has(p.id)} onChange={() => setSelIds(x => { const n = new Set(x); n.has(p.id) ? n.delete(p.id) : n.add(p.id); return n; })} style={{ cursor:'pointer', accentColor:C.green }}/></td>
